<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free RGB to HEX Color Converter - ToolGen</title>
    <meta name="description" content="Convert RGB to HEX and HEX to RGB instantly. Pick any color and get both formats with live preview. Free color converter.">
    <meta name="keywords" content="rgb to hex, hex to rgb, color converter, color picker">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:600px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:30px}
        .back{color:#667eea;text-decoration:none}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .desc{color:#888}
        .preview{width:100%;height:120px;border-radius:12px;border:2px solid #333;margin-bottom:20px;transition:background 0.2s}
        .box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:15px}
        label{display:block;color:#888;font-size:0.8rem;margin-bottom:8px;text-transform:uppercase}
        input[type="color"]{width:60px;height:40px;border:none;background:none;cursor:pointer}
        input[type="text"]{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-family:monospace;font-size:1.1rem;padding:10px}
        .rgb-row{display:flex;gap:15px;align-items:center}
        input[type="range"]{flex:1;accent-color:#667eea}
        .rgb-row span{min-width:35px;text-align:center;color:#667eea;font-weight:700}
        .result{font-family:monospace;font-size:1.5rem;color:#4ade80;margin-top:10px;text-align:center}
        .btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer;margin-top:10px;font-size:1rem}
    </style>
</head>
<body>
<div class="container">
<header><a href="/" class="back">&larr; Back to ToolGen</a>
<h1>RGB &harr; HEX Converter</h1><p class="desc">Convert between RGB and HEX color formats with live preview.</p></header>
<div class="preview" id="preview" style="background:#667eea"></div>
<div class="box"><label>Pick a Color</label>
<input type="color" id="picker" value="#667eea" oninput="fromPicker()">
<div style="margin-top:10px"><label>HEX</label>
<input type="text" id="hex" value="#667EEA" oninput="fromHex()"></div>
<div class="result" id="hexOut">#667EEA</div></div>
<div class="box"><label>RGB</label>
<div class="rgb-row">R: <input type="range" min="0" max="255" value="102" oninput="fromRgb()"><span id="rV">102</span></div>
<div class="rgb-row" style="margin-top:8px">G: <input type="range" min="0" max="255" value="126" oninput="fromRgb()"><span id="gV">126</span></div>
<div class="rgb-row" style="margin-top:8px">B: <input type="range" min="0" max="255" value="234" oninput="fromRgb()"><span id="bV">234</span></div>
<div class="result" id="rgbOut">rgb(102, 126, 234)</div>
<button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('rgbOut').textContent)">Copy RGB</button></div>
</div>
<script>
function fromPicker(){
const h=document.getElementById('picker').value;
document.getElementById('hex').value=h.toUpperCase();
document.getElementById('hexOut').textContent=h.toUpperCase();
document.getElementById('preview').style.background=h;
const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
['r','g','b'].forEach((x,i)=>{document.getElementById(x+'V').textContent=[r,g,b][i]});
document.getElementById('rgbOut').textContent=`rgb(${r}, ${g}, ${b})`;
}
function fromHex(){
const h=document.getElementById('hex').value;
if(!h.match(/^#[0-9A-Fa-f]{6}$/))return;
document.getElementById('picker').value=h;fromPicker();
}
function fromRgb(){
const r=parseInt(document.querySelectorAll('input[type="range"]')[0].value);
const g=parseInt(document.querySelectorAll('input[type="range"]')[1].value);
const b=parseInt(document.querySelectorAll('input[type="range"]')[2].value);
['r','g','b'].forEach((x,i)=>{document.getElementById(x+'V').textContent=[r,g,b][i]});
const h='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
document.getElementById('hex').value=h.toUpperCase();
document.getElementById('hexOut').textContent=h.toUpperCase();
document.getElementById('preview').style.background=h;
document.getElementById('rgbOut').textContent=`rgb(${r}, ${g}, ${b})`;
}
</script>
</body></html>
