html+=`<div class="trace-step ${s.type}"><div class="step-icon">${s.icon}</div><div class="step-content"><div class="step-type">${s.type}</div><div class="step-text">${s.text}</div></div></div>`;});container.innerHTML=html;}function generateCode(){document.getElementById('codeOutput').style.display='block';document.getElementById('codeOutput').textContent=`# Chain of Thought Logger - ToolGen
from dataclasses import dataclass
from datetime import datetime
from typing import List

@dataclass
class ThoughtStep:
    step_type: str  # thought, action, observation, final
    icon: str
    text: str
    timestamp: str

class CoTLogger:
    def __init__(self):
        self.trace: List[ThoughtStep] = []
    
    def log(self, step_type: str, icon: str, text: str):
        self.trace.append(ThoughtStep(
            step_type=step_type,
            icon=icon,
            text=text,
            timestamp=datetime.now().isoformat()
        ))
    
    def thought(self, text: str):
        self.log("thought", "💭", text)
    
    def action(self, text: str):
        self.log("action", "🔧", text)
    
    def observe(self, text: str):
        self.log("observation", "👁️", text)
    
    def finalize(self, text: str):
        self.log("final", "✅", text)
    
    def get_trace(self) -> List[ThoughtStep]:
        return self.trace
    
    def print_trace(self):
        for step in self.trace:
            print(f"[{step.step_type.upper()}] {step.icon} {step.text}")

# Usage:
cot = CoTLogger()
cot.thought("The user is asking about France")
cot.action('web_search(query="capital of France")')
cot.observe("Paris is the capital of France")
cot.finalize("Paris is the capital of France with 2.1M population")
cot.print_trace()`;}simulate();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
