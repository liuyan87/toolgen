<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free GPA Calculator - ToolGen</title>
    <meta name="description" content="Calculate your GPA instantly. Free online GPA calculator for high school and college. Works with 4.0 scale and weighted GPA.">
    <meta name="keywords" content="gpa calculator, grade point average, high school gpa, college gpa, weighted gpa, cumulative gpa, gpa scale">
    <link rel="canonical" href="https://toolgen.xyz/tools/gpa-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .course-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 10px; align-items: center; }
        input, select { padding: 10px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 0.9rem; outline: none; }
        input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 10px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-right: 8px; }
        .btn:hover { transform: translateY(-2px); }
        .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 25px; text-align: center; margin-top: 20px; }
        .gpa-num { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gpa-label { color: #888; font-size: 0.9rem; margin-top: 5px; }
        .courses-list { margin-top: 15px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎓 GPA Calculator</h1>
        <p class="subtitle">Calculate your Grade Point Average. Supports 4.0 scale and weighted GPA.</p>

        <div class="card">
            <label>Grade Scale:</label>
            <select id="scale">
                <option value="4">4.0 Scale (Standard)</option>
                <option value="4.3">4.3 Scale (Weighted)</option>
                <option value="5">5.0 Scale</option>
            </select>

            <div class="courses-list" id="coursesList">
                <div class="course-row" data-id="0">
                    <input type="text" placeholder="Course name (e.g. Math)" class="course-name">
                    <input type="number" placeholder="Credits" class="course-credits" value="3" min="1" max="10">
                    <select class="course-grade">
                        <option value="4">A / A+</option>
                        <option value="3.7">A-</option>
                        <option value="3.3">B+</option>
                        <option value="3">B</option>
                        <option value="2.7">B-</option>
                        <option value="2.3">C+</option>
                        <option value="2">C</option>
                        <option value="1.7">C-</option>
                        <option value="1.3">D+</option>
                        <option value="1">D</option>
                        <option value="0.7">D-</option>
                        <option value="0">F</option>
                    </select>
                </div>
                <div class="course-row" data-id="1">
                    <input type="text" placeholder="Course name (e.g. English)" class="course-name">
                    <input type="number" placeholder="Credits" class="course-credits" value="3" min="1" max="10">
                    <select class="course-grade">
                        <option value="4">A / A+</option>
                        <option value="3.7">A-</option>
                        <option value="3.3">B+</option>
                        <option value="3">B</option>
                        <option value="2.7">B-</option>
                        <option value="2.3">C+</option>
                        <option value="2">C</option>
                        <option value="1.7">C-</option>
                        <option value="1.3">D+</option>
                        <option value="1">D</option>
                        <option value="0.7">D-</option>
                        <option value="0">F</option>
                    </select>
                </div>
                <div class="course-row" data-id="2">
                    <input type="text" placeholder="Course name (e.g. Physics)" class="course-name">
                    <input type="number" placeholder="Credits" class="course-credits" value="4" min="1" max="10">
                    <select class="course-grade">
                        <option value="4">A / A+</option>
                        <option value="3.7">A-</option>
                        <option value="3.3">B+</option>
                        <option value="3">B</option>
                        <option value="2.7">B-</option>
                        <option value="2.3">C+</option>
                        <option value="2">C</option>
                        <option value="1.7">C-</option>
                        <option value="1.3">D+</option>
                        <option value="1">D</option>
                        <option value="0.7">D-</option>
                        <option value="0">F</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-sm" onclick="addCourse()">+ Add Course</button>
            <button class="btn btn-sm" style="background:#333;" onclick="resetCourses()">Reset</button>

            <div style="margin-top:20px;">
                <button class="btn" onclick="calculate()">Calculate GPA</button>
            </div>

            <div class="result-box" id="result">
                <div class="gpa-num" id="gpaNum">0.00</div>
                <div class="gpa-label">Your GPA</div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/gpa-calculator.html">GPA Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        let courseCount = 3;

        function addCourse() {
            if (courseCount >= 10) return;
            const list = document.getElementById('coursesList');
            const row = document.createElement('div');
            row.className = 'course-row';
            row.dataset.id = courseCount;
            row.innerHTML = `
                <input type="text" placeholder="Course name" class="course-name">
                <input type="number" placeholder="Credits" class="course-credits" value="3" min="1" max="10">
                <select class="course-grade">
                    <option value="4">A / A+</option>
                    <option value="3.7">A-</option>
                    <option value="3.3">B+</option>
                    <option value="3">B</option>
                    <option value="2.7">B-</option>
                    <option value="2.3">C+</option>
                    <option value="2">C</option>
                    <option value="1.7">C-</option>
                    <option value="1.3">D+</option>
                    <option value="1">D</option>
                    <option value="0.7">D-</option>
                    <option value="0">F</option>
                </select>
            `;
            list.appendChild(row);
            courseCount++;
        }

        function resetCourses() {
            const rows = document.querySelectorAll('.course-row');
            rows.forEach((row, i) => {
                if (i < 3) {
                    row.querySelector('.course-name').value = '';
                    row.querySelector('.course-credits').value = i === 2 ? '4' : '3';
                    row.querySelector('.course-grade').value = '4';
                }
            });
            document.getElementById('gpaNum').textContent = '0.00';
        }

        function calculate() {
            const rows = document.querySelectorAll('.course-row');
            let totalPoints = 0;
            let totalCredits = 0;

            rows.forEach(row => {
                const credits = parseFloat(row.querySelector('.course-credits').value) || 0;
                const grade = parseFloat(row.querySelector('.course-grade').value) || 0;
                if (credits > 0) {
                    totalPoints += credits * grade;
                    totalCredits += credits;
                }
            });

            const gpa = totalCredits > 0 ? (totalPoints / totalCredits) : 0;
            document.getElementById('gpaNum').textContent = gpa.toFixed(2);
        }
    </script>
</body>
</html>
