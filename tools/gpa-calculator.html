<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free GPA Calculator - ToolGen</title><meta name="description" content="Calculate your GPA (Grade Point Average) from letter grades. Free GPA calculator for students."><meta name="keywords" content="gpa calculator, grade point average, gpa, calculate gpa, college gpa, high school gpa"><link rel="canonical" href="https://toolgen.xyz/tools/gpa-calculator.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:700px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}.courses{display:grid;grid-template-columns:2fr 1fr 1fr 50px;gap:10px;margin-bottom:15px;font-size:0.85rem;color:#888;font-weight:700}.course-row{display:grid;grid-template-columns:2fr 1fr 1fr 50px;gap:10px;margin-bottom:8px;align-items:center}.course-row input{padding:10px;border-radius:6px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:0.95rem;text-align:center}.course-row input:focus{border-color:#667eea;outline:none}.course-row input.name{text-align:left}.del-btn{background:#ef4444;border:none;border-radius:6px;color:#fff;cursor:pointer;padding:8px;font-size:1rem}.gpa-display{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:30px;text-align:center;font-size:3rem;font-weight:800;margin:20px 0}.gpa-display span{font-size:1rem;opacity:0.9;display:block;margin-top:5px}.scale{margin:15px 0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:0.8rem}.scale div{background:#0a0a0a;border-radius:6px;padding:8px;text-align:center;color:#888}.scale div span{display:block;color:#667eea;font-weight:700;font-size:1rem}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🎓 GPA Calculator</h1><p class="subtitle">Calculate your GPA from letter grades. Free for students.</p><div class="card"><div class="courses"><span>Course Name</span><span>Credits</span><span>Grade</span><span></span></div><div id="courses"><div class="course-row"><input class="name" placeholder="Course name" value="Mathematics"><input type="number" value="3" min="1" max="10"><select class="grade"><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select><button class="del-btn" onclick="this.parentElement.remove()">×</button></div></div><button class="btn" onclick="addCourse()">➕ Add Course</button><button class="btn" onclick="calculate()">⚡ Calculate GPA</button><div class="gpa-display" id="gpa">0.00<span>Grade Point Average</span></div><div class="scale"><div><span>4.0</span>A</div><div><span>3.0</span>B</div><div><span>2.0</span>C</div><div><span>1.0</span>D</div><div><span>0.0</span>F</div></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const grades={'A':4,'B':3,'C':2,'D':1,'F':0};function addCourse(){const div=document.createElement('div');div.className='course-row';div.innerHTML='<input class="name" placeholder="Course name"><input type="number" value="3" min="1" max="10"><select class="grade"><option>A</option><option>B</option><option>C</option><option>D</option><option>F</option></select><button class="del-btn" onclick="this.parentElement.remove()">×</button>';document.getElementById('courses').appendChild(div);}function calculate(){const rows=document.querySelectorAll('.course-row');let totalPoints=0,totalCredits=0;rows.forEach(row=>{const credits=parseFloat(row.children[1].value)||0;const grade=row.children[2].value;if(credits>0){totalPoints+=grades[grade]*credits;totalCredits+=credits;}});const gpa=totalCredits>0?(totalPoints/totalCredits).toFixed(2):'0.00';document.getElementById('gpa').innerHTML=`${gpa}<span>Grade Point Average</span>`;}</script></body></html>
