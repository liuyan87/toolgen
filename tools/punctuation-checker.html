analyze punctuation in your text. Fix common mistakes.</p><div class="card"><textarea id="input" placeholder="Paste your text here to check punctuation..." oninput="analyze()"></textarea><div class="stats"><div class="stat"><div class="num" id="periods">0</div><div class="lbl">. Periods</div></div><div class="stat"><div class="num" id="commas">0</div><div class="lbl">, Commas</div></div><div class="stat"><div class="num" id="questions">0</div><div class="lbl">? Questions</div></div><div class="stat"><div class="num" id="exclam">0</div><div class="lbl">! Exclam</div></div><div class="stat"><div class="num" id="quotes">0</div><div class="lbl">" Quotes</div></div></div><button class="btn" onclick="fix()">⚡ Fix Common Issues</button><button class="btn" onclick="copy()">📋 Copy</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function analyze(){const t=document.getElementById('input').value;document.getElementById('periods').textContent=(t.match(/\./g)||[]).length;document.getElementById('commas').textContent=(t.match(/,/g)||[]).length;document.getElementById('questions').textContent=(t.match(/\?/g)||[]).length;document.getElementById('exclam').textContent=(t.match(/!/g)||[]).length;document.getElementById('quotes').textContent=(t.match(/["']/g)||[]).length;}function fix(){let t=document.getElementById('input').value;// Fix double spaces

t=t.replace(/\."/g,'".');document.getElementById('input').value=t;analyze();}function copy(){navigator.clipboard.writeText(document.getElementById('input').value);}</script></body></html>
