<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Loan EMI Calculator - ToolGen</title>
    <meta name="description" content="Calculate monthly loan EMI instantly. Free online loan calculator for mortgage, car loan, personal loan EMI calculation.">
    <meta name="keywords" content="loan calculator, emi calculator, mortgage calculator, car loan, personal loan, monthly payment calculator">
    <link rel="canonical" href="https://toolgen.xyz/tools/loan-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box .val { font-size: 1.5rem; font-weight: 700; color: #22c55e; }
        .result-box .label { color: #888; font-size: 0.8rem; margin-top: 5px; }
        .result-box.highlight { border: 2px solid #667eea; }
        .result-box.highlight .val { color: #667eea; font-size: 1.8rem; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🏦 Loan EMI Calculator</h1>
        <p class="subtitle">Calculate your monthly loan payment. Supports mortgage, car loan, and personal loan.</p>

        <div class="card">
            <label>Loan Amount ($)</label>
            <input type="number" id="principal" placeholder="250000" value="250000">

            <label>Annual Interest Rate (%)</label>
            <input type="number" id="rate" placeholder="6.5" value="6.5" step="0.1">

            <label>Loan Term (Years)</label>
            <input type="number" id="years" placeholder="30" value="30">

            <button class="btn" onclick="calculate()">Calculate EMI</button>

            <div class="result-grid" id="results">
                <div class="result-box highlight">
                    <div class="val" id="emi">$0</div>
                    <div class="label">Monthly EMI</div>
                </div>
                <div class="result-box">
                    <div class="val" id="totalInterest">$0</div>
                    <div class="label">Total Interest</div>
                </div>
                <div class="result-box">
                    <div class="val" id="totalPayment">$0</div>
                    <div class="label">Total Payment</div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/loan-calculator.html">Loan Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function calculate() {
            const P = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) / 100 / 12 || 0;
            const n = parseFloat(document.getElementById('years').value) * 12 || 0;

            if (P <= 0 || r <= 0 || n <= 0) return;

            const emi = P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
            const total = emi * n;
            const interest = total - P;

            document.getElementById('emi').textContent = '$' + emi.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('totalInterest').textContent = '$' + interest.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('totalPayment').textContent = '$' + total.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }

        calculate();
    </script>
</body>
</html>
