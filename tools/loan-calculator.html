<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Loan Calculator - ToolGen</title>
    <meta name="description" content="Free online loan calculator. Calculate monthly mortgage payments, total interest, and amortization schedule.">
    <meta name="keywords" content="loan calculator, mortgage calculator, home loan calculator, EMI calculator">
    <link rel="canonical" href="https://toolgen.xyz/tools/loan-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 20px; }
        input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .result-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .result-box { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 12px; padding: 20px; text-align: center; }
        .result-label { font-size: 0.85rem; opacity: 0.8; }
        .result-value { font-size: 1.5rem; font-weight: 800; }
        .highlight { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
        th { color: #667eea; font-weight: 600; }
        td { color: #aaa; font-size: 0.9rem; }
        .schedule-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
        @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🏦 Loan Calculator</h1>
        <p class="subtitle">Calculate your monthly mortgage or loan payments instantly.</p>
        <div class="card">
            <label>Loan Amount ($)</label>
            <input type="number" id="amount" value="250000" min="1000" oninput="calculate()">
            <label>Annual Interest Rate (%)</label>
            <input type="number" id="rate" value="6.5" step="0.1" min="0.1" max="30" oninput="calculate()">
            <label>Loan Term (Years)</label>
            <input type="number" id="years" value="30" min="1" max="50" oninput="calculate()">
            <br><br>
            <button class="btn" onclick="calculate()">Calculate</button>
        </div>
        <div class="result-grid">
            <div class="result-box">
                <div class="result-label">Monthly Payment</div>
                <div class="result-value" id="monthly">$0</div>
            </div>
            <div class="result-box highlight">
                <div class="result-label">Total Interest</div>
                <div class="result-value" id="totalInterest">$0</div>
            </div>
            <div class="result-box">
                <div class="result-label">Total Amount</div>
                <div class="result-value" id="totalAmount">$0</div>
            </div>
        </div>
        <div class="card">
            <div class="schedule-header">
                <h3>Amortization Schedule</h3>
                <span id="scheduleInfo" style="color: #888; font-size: 0.9rem;"></span>
            </div>
            <div style="max-height: 300px; overflow-y: auto;">
                <table>
                    <thead><tr><th>Month</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        function calculate() {
            const P = parseFloat(document.getElementById('amount').value) || 0;
            const annualRate = parseFloat(document.getElementById('rate').value) || 0;
            const n = (parseFloat(document.getElementById('years').value) || 0) * 12;
            const r = annualRate / 100 / 12;
            if (P <= 0 || n <= 0) return;
            let monthly = 0;
            if (r === 0) { monthly = P / n; }
            else { monthly = P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1); }
            const totalAmount = monthly * n;
            const totalInterest = totalAmount - P;
            document.getElementById('monthly').textContent = '$' + monthly.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('totalInterest').textContent = '$' + totalInterest.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('totalAmount').textContent = '$' + totalAmount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            let balance = P;
            let html = '';
            const maxRows = Math.min(n, 120);
            for (let i = 1; i <= maxRows; i++) {
                const interestPayment = balance * r;
                const principalPayment = monthly - interestPayment;
                balance -= principalPayment;
                if (balance < 0) balance = 0;
                html += `<tr><td>${i}</td><td>$${monthly.toFixed(2)}</td><td>$${principalPayment.toFixed(2)}</td><td>$${interestPayment.toFixed(2)}</td><td>$${balance.toFixed(2)}</td></tr>`;
            }
            document.getElementById('scheduleBody').innerHTML = html;
            document.getElementById('scheduleInfo').textContent = `Showing first ${maxRows} of ${n} months`;
        }
        calculate();
    </script>
</body>
</html>
