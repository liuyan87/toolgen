<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Password Strength Checker - ToolGen</title>
    <meta name="description" content="Check password strength instantly. See how secure your password is.">
    <meta name="keywords" content="password strength, password checker, password security, strong password">
    <link rel="canonical" href="https://toolgen.xyz/tools/password-strength.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .input-wrap { position: relative; }
        input { width: 100%; padding: 14px; padding-right: 50px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1.2rem; outline: none; }
        input:focus { border-color: #667eea; }
        .toggle-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #888; cursor: pointer; font-size: 1.2rem; }
        .strength-bar { height: 8px; border-radius: 4px; margin-top: 15px; background: #333; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; }
        .strength-text { display: flex; justify-content: space-between; margin-top: 10px; }
        .strength-label { font-weight: 700; font-size: 1.1rem; }
        .strength-score { color: #888; }
        .checks { margin-top: 20px; }
        .check { padding: 8px 0; display: flex; align-items: center; gap: 10px; }
        .check-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .check-icon.pass { background: #4ade80; color: #000; }
        .check-icon.fail { background: #333; color: #666; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: 600; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔐 Password Strength Checker</h1>
        <p class="subtitle">Check how strong your password is. Free & secure.</p>
        <div class="card">
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Enter your password" oninput="checkStrength()">
                <button class="toggle-btn" onclick="toggle()">👁</button>
            </div>
            <div class="strength-bar"><div class="strength-fill" id="fill" style="width:0%"></div></div>
            <div class="strength-text">
                <span class="strength-label" id="label">Enter a password</span>
                <span class="strength-score" id="score"></span>
            </div>
            <div class="checks" id="checks">
                <div class="check"><div class="check-icon fail" id="c1">✗</div><span>At least 8 characters</span></div>
                <div class="check"><div class="check-icon fail" id="c2">✗</div><span>Contains uppercase letter</span></div>
                <div class="check"><div class="check-icon fail" id="c3">✗</div><span>Contains lowercase letter</span></div>
                <div class="check"><div class="check-icon fail" id="c4">✗</div><span>Contains number</span></div>
                <div class="check"><div class="check-icon fail" id="c5">✗</div><span>Contains special character</span></div>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        let visible = false;
        function toggle() {
            const inp = document.getElementById('password');
            visible = !visible;
            inp.type = visible ? 'text' : 'password';
        }
        function checkStrength() {
            const p = document.getElementById('password').value;
            const checks = [
                [p.length >= 8, 'c1'],
                (/[A-Z]/.test(p), 'c2'),
                (/[a-z]/.test(p), 'c3'),
                (/[0-9]/.test(p), 'c4'),
                (/[^A-Za-z0-9]/.test(p), 'c5'),
            ];
            const score = checks.filter(([c]) => c).length;
            checks.forEach(([c, id]) => {
                const el = document.getElementById(id);
                el.className = 'check-icon ' + (c ? 'pass' : 'fail');
                el.textContent = c ? '✓' : '✗';
            });
            const fill = document.getElementById('fill');
            const label = document.getElementById('label');
            const colors = ['#ef4444','#f97316','#eab308','#4ade80'];
            const texts = ['Very Weak','Weak','Fair','Strong','Very Strong'];
            const pct = (score / 5) * 100;
            fill.style.width = pct + '%';
            fill.style.background = colors[Math.min(score, 4)];
            label.textContent = texts[Math.min(score, 4)];
            label.style.color = colors[Math.min(score, 4)];
        }
    </script>
</body>
</html>
