<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free QR Code Generator - ToolGen</title>
    <meta name="description" content="Generate QR codes instantly. Create QR codes for URLs, text, WiFi, contacts. Free online QR code generator no registration.">
    <meta name="keywords" content="qr code generator, generate qr code, make qr code, free qr generator, wifi qr code, qr code maker">
    <link rel="canonical" href="https://toolgen.xyz/tools/qr-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .type-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .type-tab { padding: 8px 16px; background: #0a0a0a; border: 2px solid #333; border-radius: 20px; color: #888; cursor: pointer; font-size: 0.85rem; }
        .type-tab:hover { border-color: #667eea; color: #fff; }
        .type-tab.active { border-color: #667eea; color: #fff; background: rgba(102,126,234,0.15); }
        textarea, input, select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        textarea:focus, input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .qr-preview { background: #fff; border-radius: 12px; padding: 20px; display: flex; justify-content: center; margin-top: 20px; }
        .qr-preview canvas { max-width: 200px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📱 QR Code Generator</h1>
        <p class="subtitle">Generate QR codes for URLs, text, WiFi, and more. Free and instant.</p>

        <div class="card">
            <div class="type-tabs">
                <button class="type-tab active" onclick="setType('text')">Text / URL</button>
                <button class="type-tab" onclick="setType('wifi')">WiFi</button>
                <button class="type-tab" onclick="setType('email')">Email</button>
                <button class="type-tab" onclick="setType('sms')">SMS</button>
            </div>

            <div id="input-text">
                <textarea id="urlText" placeholder="Enter URL or text..." rows="3"></textarea>
            </div>

            <div id="input-wifi" style="display:none;">
                <input type="text" id="wifiName" placeholder="Network Name (SSID)">
                <select id="wifiType">
                    <option value="WPA">WPA/WPA2</option>
                    <option value="WEP">WEP</option>
                    <option value="nopass">No Password</option>
                </select>
                <input type="password" id="wifiPass" placeholder="Password">
            </div>

            <div id="input-email" style="display:none;">
                <input type="email" id="emailAddr" placeholder="Email address">
                <input type="text" id="emailSubject" placeholder="Subject">
            </div>

            <div id="input-sms" style="display:none;">
                <input type="tel" id="smsNum" placeholder="Phone number">
                <textarea id="smsBody" placeholder="Message" rows="2"></textarea>
            </div>

            <button class="btn" onclick="generateQR()">Generate QR Code</button>

            <div class="qr-preview" id="qrPreview">
                <canvas id="qrCanvas"></canvas>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/qr-generator.html">QR Code Generator</a> - 150+ Free Tools</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        let currentType = 'text';

        function setType(type) {
            currentType = type;
            document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            ['text','wifi','email','sms'].forEach(t => {
                document.getElementById('input-' + t).style.display = t === type ? 'block' : 'none';
            });
        }

        function generateQR() {
            let data = '';
            if (currentType === 'text') {
                data = document.getElementById('urlText').value.trim();
            } else if (currentType === 'wifi') {
                const name = document.getElementById('wifiName').value;
                const type = document.getElementById('wifiType').value;
                const pass = document.getElementById('wifiPass').value;
                data = `WIFI:T:${type};S:${name};P:${pass};;`;
            } else if (currentType === 'email') {
                const email = document.getElementById('emailAddr').value;
                const sub = document.getElementById('emailSubject').value;
                data = `mailto:${email}?subject=${encodeURIComponent(sub)}`;
            } else if (currentType === 'sms') {
                const num = document.getElementById('smsNum').value;
                const body = document.getElementById('smsBody').value;
                data = `sms:${num}${body ? '?body=' + encodeURIComponent(body) : ''}`;
            }

            if (!data) { alert('Please enter data'); return; }

            const canvas = document.getElementById('qrCanvas');
            canvas.width = 200; canvas.height = 200;
            QRCode.toCanvas(canvas, data, { width: 200, margin: 2 });
        }
    </script>
</body>
</html>
