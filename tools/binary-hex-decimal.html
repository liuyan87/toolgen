<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Binary/Hex/Decimal Converter - ToolGen</title>
    <meta name="description" content="Convert between binary, hex, decimal, and octal instantly. Free online number base converter for developers.">
    <meta name="keywords" content="binary to decimal, hex to decimal, decimal to binary, hex to binary, base converter, binary converter, hexadecimal converter">
    <link rel="canonical" href="https://toolgen.xyz/tools/binary-hex-decimal.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input { padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-family: monospace; font-size: 1.1rem; outline: none; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .results { background: #0a0a0a; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .result-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-family: monospace; }
        .result-row:last-child { border-bottom: none; }
        .result-row .label { color: #888; width: 120px; }
        .result-row .value { color: #22c55e; cursor: pointer; }
        .result-row .value:hover { color: #fff; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔢 Binary/Hex/Decimal Converter</h1>
        <p class="subtitle">Convert between binary, hex, decimal, and octal. Essential for developers.</p>

        <div class="card">
            <label>Enter value (auto-detect base):</label>
            <input type="text" id="input" placeholder="e.g. 255, 0xFF, 11111111, 0377" oninput="convert()">

            <button class="btn" onclick="copyResult()">📋 Copy Result</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="results" id="results">
                <div class="result-row"><span class="label">Decimal (10)</span><span class="value" id="dec" onclick="copy('dec')">-</span></div>
                <div class="result-row"><span class="label">Hexadecimal (16)</span><span class="value" id="hex" onclick="copy('hex')">-</span></div>
                <div class="result-row"><span class="label">Binary (2)</span><span class="value" id="bin" onclick="copy('bin')">-</span></div>
                <div class="result-row"><span class="label">Octal (8)</span><span class="value" id="oct" onclick="copy('oct')">-</span></div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/binary-hex-decimal.html">Binary/Hex/Decimal</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function convert() {
            const input = document.getElementById('input').value.trim();
            if (!input) {
                ['dec','hex','bin','oct'].forEach(id => document.getElementById(id).textContent = '-');
                return;
            }

            let decimal;
            if (input.startsWith('0x') || input.startsWith('0X')) {
                decimal = parseInt(input, 16);
            } else if (input.startsWith('0') && input.length > 1) {
                decimal = parseInt(input, 8);
            } else if (/^[01]+$/.test(input)) {
                decimal = parseInt(input, 2);
            } else {
                decimal = parseInt(input, 10);
            }

            if (isNaN(decimal)) {
                ['dec','hex','bin','oct'].forEach(id => document.getElementById(id).textContent = 'Invalid');
                return;
            }

            document.getElementById('dec').textContent = decimal;
            document.getElementById('hex').textContent = '0x' + decimal.toString(16).toUpperCase();
            document.getElementById('bin').textContent = decimal.toString(2);
            document.getElementById('oct').textContent = '0' + decimal.toString(8);
        }

        function copy(type) {
            const val = document.getElementById(type).textContent;
            if (val && val !== '-' && val !== 'Invalid') navigator.clipboard.writeText(val);
        }

        function copyResult() {
            const vals = ['dec','hex','bin','oct'].map(id => document.getElementById(id).textContent).join(', ');
            navigator.clipboard.writeText(vals);
        }

        function clearText() {
            document.getElementById('input').value = '';
            ['dec','hex','bin','oct'].forEach(id => document.getElementById(id).textContent = '-');
        }
    </script>
</body>
</html>
