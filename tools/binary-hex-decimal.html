ss="back">← Back to ToolGen</a><h1>💻 Binary/Hex/Decimal</h1><p class="subtitle">Convert between binary, hexadecimal, decimal, and octal instantly.</p><div class="card"><label>Enter value (auto-detects base)</label><input type="text" id="input" placeholder="255 or 0xFF or 0b11111111" oninput="convert()"><div class="results"><div class="result-item"><label>Decimal (Base 10)</label><div class="val" id="dec" onclick="copy(this)">0</div></div><div class="result-item"><label>Binary (Base 2)</label><div class="val" id="bin" onclick="copy(this)">0</div></div><div class="result-item"><label>Hexadecimal (Base 16)</label><div class="val" id="hex" onclick="copy(this)">0</div></div><div class="result-item"><label>Octal (Base 8)</label><div class="val" id="oct" onclick="copy(this)">0</div></div></div><button class="btn" onclick="convert()">⚡ Convert</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function convert(){const s=document.getElementById('input').value.trim();if(!s){['dec','bin','hex','oct'].forEach(id=>document.getElementById(id).textContent='0');return;}let num;if(s.startsWith('0x')||s.startsWith('0X')){num=parseInt(s,16);}else if(s.startsWith('0b')||s.startsWith('0B')){num=parseInt(s.slice(2),2);}else if(s.startsWith('0o')||s.startsWith('0O')){num=parseInt(s.slice(2),8);}else if(/^[01]+$/.test(s)){num=parseInt(s,2);}else if(/^[0-9a-fA-F]+$/.test(s)&&s.length>2){num=parseInt(s,16);}else{num=parseInt(s,10);}if(isNaN(num))return;document.getElementById('dec').textContent=num;document.getElementById('bin').textContent=num.toString(2);document.getElementById('hex').textContent='0x'+num.toString(16).toUpperCase();document.getElementById('oct').textContent='0o'+num.toString(8);}function copy(el){navigator.clipboard.writeText(el.textContent);}convert();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
