ach((src,i)=>{const div=document.createElement('div');div.className='thumb';const img=document.createElement('img');img.src=src;const num=document.createElement('span');num.className='num';num.textContent=i+1;const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=e=>{e.stopPropagation();images.splice(i,1);renderThumbs();};div.appendChild(img);div.appendChild(num);div.appendChild(rm);thumbs.appendChild(div);});const add=document.createElement('div');add.className='add-thumb';add.textContent='+';add.onclick=addMore;thumbs.appendChild(add);dz.style.display=images.length?'none':'block';document.getElementById('convertBtn').style.display=images.length?'inline-block':'none';document.getElementById('thumbs').style.display=images.length?'flex':'none';}function convertToPDF(){// Note: True PDF encoding needs a library. We'll create a simple HTML-based PDF viewer
// For a pure JS solution, we use canvas to create a printable page
if(images.length===0)return;document.getElementById('status').textContent='Generating PDF...';// Use a data URL approach - create printable HTML
const html=`<!DOCTYPE html><html><head><title>Images</title><style>body{margin:0;padding:20px}img{display:block;max-width:100%;margin-bottom:20px;page-break-after:always}@media print{img{page-break-after:always}}</style></head><body>${images.map(src=>`<img src="${src}">`).join('')}</body></html>`;const blob=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='images.html';a.click();document.getElementById('status').textContent='Note: Generated printable HTML. Print (Ctrl+P) and save as PDF for best results!';}</script></body></html>
