<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Random Number Generator - ToolGen</title>
    <meta name="description" content="Generate random numbers in a range. Perfect for lotteries, dice, picks, and more.">
    <meta name="keywords" content="random number generator, random number, lottery number generator, dice roller">
    <link rel="canonical" href="https://toolgen.xyz/tools/random-number.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .range { display: flex; gap: 15px; margin: 20px 0; align-items: center; justify-content: center; }
        .range input { width: 120px; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1.2rem; text-align: center; }
        .range input:focus { border-color: #667eea; outline: none; }
        .range span { font-size: 1.5rem; color: #888; }
        .result { font-size: 5rem; font-weight: 800; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 30px 0; }
        .count-group { margin: 15px 0; }
        .count-group label { color: #888; margin-right: 10px; }
        .count-group input { width: 80px; padding: 8px; border-radius: 6px; border: 2px solid #333; background: #0a0a0a; color: #fff; text-align: center; }
        .numbers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px 0; min-height: 60px; }
        .num-bubble { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: 600; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎲 Random Number Generator</h1>
        <p class="subtitle">Generate random numbers in any range. Perfect for lotteries, dice, picks.</p>
        <div class="card">
            <div class="range">
                <input type="number" id="min" value="1" placeholder="Min">
                <span>to</span>
                <input type="number" id="max" value="100" placeholder="Max">
            </div>
            <div class="count-group">
                <label>How many numbers:</label>
                <input type="number" id="count" value="1" min="1" max="100">
            </div>
            <button class="btn" onclick="generate()">🎲 Generate</button>
            <div class="numbers" id="numbers"></div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        function generate() {
            const min = parseInt(document.getElementById('min').value) || 1;
            const max = parseInt(document.getElementById('max').value) || 100;
            const count = parseInt(document.getElementById('count').value) || 1;
            const container = document.getElementById('numbers');
            container.innerHTML = '';
            for (let i = 0; i < Math.min(count, 100); i++) {
                const num = Math.floor(Math.random() * (max - min + 1)) + min;
                const bubble = document.createElement('div');
                bubble.className = 'num-bubble';
                bubble.textContent = num;
                container.appendChild(bubble);
            }
        }
        generate();
    </script>
</body>
</html>
