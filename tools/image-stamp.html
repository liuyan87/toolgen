<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Add Text to Image - ToolGen</title><meta name="description" content="Add text to images online. Create stamps, captions, and watermarks with custom fonts."><meta name="keywords" content="add text to image, image text, stamp image, caption photo, text overlay image"><link rel="canonical" href="https://toolgen.xyz/tools/image-stamp.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}.drop-zone{border:3px dashed #333;border-radius:16px;padding:60px;text-align:center;cursor:pointer;transition:border-color 0.3s}.drop-zone:hover{border-color:#667eea}.drop-zone input{display:none}.preview{display:none;text-align:center;margin-bottom:20px}.preview img{max-width:100%;max-height:400px;border-radius:8px}.controls{display:none}.control-row{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}.control-group{margin-bottom:12px}.control-group label{display:block;margin-bottom:6px;font-weight:600;color:#aaa;font-size:0.9rem}.control-group input,.control-group select,.control-group textarea{width:100%;padding:10px;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:0.95rem;outline:none}.control-group input:focus,.control-group textarea:focus{border-color:#667eea}.color-row{display:flex;gap:10px;align-items:center}.color-row input[type="color"]{width:50px;height:40px;border:none;cursor:pointer;border-radius:6px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>✍️ Add Text to Image</h1><p class="subtitle">Add custom text, captions, or stamps to your photos. Free online.</p><div class="card"><div class="drop-zone" id="dz"><div style="font-size:4rem;margin-bottom:15px">🖼️ + ✍️</div><p>Drag & drop image or click to select</p><input type="file" id="fi" accept="image/*"></div><div class="preview" id="preview"><img id="img"><canvas id="canvas" style="display:none"></canvas></div><div class="controls" id="controls"><div class="control-row"><div class="control-group"><label>Text</label><textarea id="text" rows="2" placeholder="Your text here..." oninput="render()">Sample Text</textarea></div><div class="control-group"><label>Font</label><select id="font" onchange="render()"><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option><option value="Impact">Impact</option><option value="Comic Sans MS">Comic Sans MS</option></select></div></div><div class="control-row"><div class="control-group"><label>Font Size</label><input type="range" id="size" min="12" max="200" value="48" oninput="render()"></div><div class="control-group"><label>Position</label><select id="position" onchange="render()"><option value="center">Center</option><option value="top">Top</option><option value="bottom">Bottom</option><option value="top-left">Top Left</option><option value="top-right">Top Right</option><option value="bottom-left">Bottom Left</option><option value="bottom-right">Bottom Right</option></select></div></div><div class="control-row"><div class="control-group"><label>Text Color</label><div class="color-row"><input type="color" id="color" value="#ffffff" oninput="render()"><input type="text" id="colorText" value="#ffffff" style="flex:1" oninput="document.getElementById('color').value=this.value;render()"></div></div><div class="control-group"><label>Stroke Color</label><div class="color-row"><input type="color" id="strokeColor" value="#000000" oninput="render()"><input type="text" id="strokeText" value="#000000" style="flex:1" oninput="document.getElementById('strokeColor').value=this.value;render()"></div></div></div><div class="control-group"><label><input type="checkbox" id="bold" onchange="render()"> Bold</label><label style="margin-left:15px"><input type="checkbox" id="italic" onchange="render()"> Italic</label><label style="margin-left:15px"><input type="checkbox" id="shadow" checked onchange="render()"> Shadow</label></div><button class="btn" onclick="download()">💾 Download</button><button class="btn" onclick="render()">🔄 Refresh</button></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let imgEl=new Image();const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const dz=document.getElementById('dz');const fi=document.getElementById('fi');dz.onclick=()=>fi.click();dz.ondragover=e=>{e.preventDefault();dz.style.borderColor='#667eea';};dz.ondragleave=()=>dz.style.borderColor='#333';dz.ondrop=e=>{e.preventDefault();dz.style.borderColor='#333';loadFile(e.dataTransfer.files[0]);};fi.onchange=e=>loadFile(e.target.files[0]);function loadFile(f){if(!f||!f.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=e=>{imgEl.onload=()=>{canvas.width=imgEl.width;canvas.height=imgEl.height;dz.style.display='none';document.getElementById('preview').style.display='block';document.getElementById('controls').style.display='block';render();};imgEl.src=e.target.result;};reader.readAsDataURL(f);}function render(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(imgEl,0,0);const text=document.getElementById('text').value||'Sample Text';const font=document.getElementById('font').value;const size=document.getElementById('size').value;const bold=document.getElementById('bold').checked?'bold ':'';const italic=document.getElementById('italic').checked?'italic ':'';ctx.font=`${bold}${italic}${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';const color=document.getElementById('colorText').value||'#ffffff';const strokeColor=document.getElementById('strokeText').value||'#000000';const shadow=document.getElementById('shadow').checked;const position=document.getElementById('position').value;let x,y;const tw=canvas.width*0.8;const th=parseInt(size)*2;if(position==='center'){x=canvas.width/2;y=canvas.height/2;}else if(position==='top'){x=canvas.width/2;y=50+parseInt(size)/2;}else if(position==='bottom'){x=canvas.width/2;y=canvas.height-50-parseInt(size)/2;}else if(position==='top-left'){x=20;y=50+parseInt(size)/2;ctx.textAlign='left';}else if(position==='top-right'){x=canvas.width-20;y=50+parseInt(size)/2;ctx.textAlign='right';}else if(position==='bottom-left'){x=20;y=canvas.height-50-parseInt(size)/2;ctx.textAlign='left';}else if(position==='bottom-right'){x=canvas.width-20;y=canvas.height-50-parseInt(size)/2;ctx.textAlign='right';}ctx.lineWidth=Math.max(2,parseInt(size)/15);if(shadow){ctx.shadowColor='rgba(0,0,0,0.7)';ctx.shadowBlur=10;ctx.shadowOffsetX=3;ctx.shadowOffsetY=3;}ctx.strokeStyle=strokeColor;ctx.fillStyle=color;ctx.strokeText(text,x,y);ctx.fillText(text,x,y);ctx.shadowColor='transparent';ctx.shadowBlur=0;document.getElementById('img').src=canvas.toDataURL('image/png');}function download(){const a=document.createElement('a');a.download='text-image.png';a.href=canvas.toDataURL('image/png');a.click();}</script></body></html>
