<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Favicon Generator - ToolGen</title>
    <meta name="description" content="Generate favicon from any image or emoji. Create .ico file for your website.">
    <meta name="keywords" content="favicon generator, favicon creator, make favicon, ico generator">
    <link rel="canonical" href="https://toolgen.xyz/tools/favicon-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .drop-zone { border: 2px dashed #667eea; border-radius: 16px; padding: 60px 20px; cursor: pointer; transition: all 0.3s; }
        .drop-zone:hover { background: rgba(102,126,234,0.1); }
        input[type="file"] { display: none; }
        .preview-area { display: flex; justify-content: center; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
        .preview-item { text-align: center; }
        .preview-item canvas { border: 2px solid #333; border-radius: 8px; background: #fff; }
        .preview-item p { color: #888; font-size: 0.85rem; margin-top: 8px; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: 600; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔖 Favicon Generator</h1>
        <p class="subtitle">Generate favicon from any image. Supports multiple sizes.</p>
        <div class="card">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem;">📁</div>
                <p>Click or drag image to upload</p>
                <p style="color:#666;font-size:0.85rem;">PNG, JPG, GIF, SVG supported</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="processImage(this.files[0])">
            <div class="preview-area" id="preview" style="display:none;"></div>
            <button class="btn" id="downloadBtn" style="display:none;" onclick="downloadAll()">⬇️ Download All Sizes</button>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        let currentImage = null;
        const sizes = [16, 32, 48, 64, 128, 256];
        function processImage(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    const container = document.getElementById('preview');
                    container.innerHTML = '';
                    container.style.display = 'flex';
                    sizes.forEach(size => {
                        const canvas = document.createElement('canvas');
                        canvas.width = size;
                        canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const s = Math.min(img.width, img.height);
                        const sx = (img.width - s) / 2;
                        const sy = (img.height - s) / 2;
                        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.innerHTML = `<canvas width="${size}" height="${size}"></canvas><p>${size}x${size}</p>`;
                        div.querySelector('canvas').getContext('2d').drawImage(canvas, 0, 0);
                        container.appendChild(div);
                    });
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    // Draw proper previews
                    container.innerHTML = '';
                    sizes.forEach(size => {
                        const canvas = document.createElement('canvas');
                        canvas.width = size; canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const s = Math.min(img.width, img.height);
                        ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
                        const div = document.createElement('div');
                        div.className = 'preview-item';
                        div.appendChild(canvas);
                        const p = document.createElement('p');
                        p.textContent = `${size}x${size}`;
                        div.appendChild(p);
                        container.appendChild(div);
                    });
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        function downloadAll() {
            if (!currentImage) return;
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size; canvas.height = size;
                const ctx = canvas.getContext('2d');
                const s = Math.min(currentImage.width, currentImage.height);
                ctx.drawImage(currentImage, (currentImage.width-s)/2, (currentImage.height-s)/2, s, s, 0, 0, size, size);
                const link = document.createElement('a');
                link.download = `favicon-${size}x${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
