<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Few-shot Example Generator - ToolGen</title><meta name="description" content="Generate few-shot examples for AI prompts. Create high-quality training examples for better LLM performance."><link rel="canonical" href="https://toolgen.xyz/tools/fewshot-example-generator.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}textarea,input,select{width:100%;padding:12px;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:0.95rem;outline:none;margin-bottom:12px}textarea{min-height:80px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#667eea}.example{display:grid;grid-template-columns:auto 1fr;gap:15px;margin:15px 0;padding:15px;background:#0a0a0a;border-radius:12px}.example-label{font-weight:700;color:#667eea;font-size:0.85rem;text-transform:uppercase}.example-content{font-family:monospace;font-size:0.85rem;color:#ccc;white-space:pre-wrap}.code-output{background:#0a0a0a;border-radius:10px;padding:15px;font-family:monospace;font-size:0.8rem;color:#667eea;white-space:pre;max-height:400px;overflow:auto;margin-top:15px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🎯 Few-shot Example Generator</h1><p class="subtitle">Generate few-shot examples for AI prompts. Create high-quality training examples.</p><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px"><select id="taskType"><option value="qa">Q&A</option><option value="classification">Classification</option><option value="sentiment">Sentiment Analysis</option><option value="extraction">Information Extraction</option><option value="translation">Translation</option><option value="summarization">Summarization</option></select><select id="numExamples"><option>3 examples</option><option selected>5 examples</option><option>7 examples</option></select></div><input type="text" id="topic" placeholder="Topic (e.g., customer support, medical, coding)" value="customer support"><button class="btn" onclick="generateExamples()">⚡ Generate Examples</button><div id="examples"></div><button class="btn" onclick="generateCode()">⚡ Generate Prompt Code</button><div class="code-output" id="codeOutput" style="display:none"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const templates={qa:{prefix:'Answer the question based on the context.',examples:[{input:'What is Python?',output:'Python is a high-level programming language known for its readable syntax and versatility in web development, data science, and AI.'},{input:'How does photosynthesis work?',output:'Photosynthesis converts sunlight, water, and CO2 into glucose and oxygen using chlorophyll in plant cells.'}]},{classification:{prefix:'Classify the following into categories.',examples:[{input:'The movie was absolutely terrible. Worst 2 hours of my life.',output:'Sentiment: Negative'},{input:'Great product! Fast shipping and excellent quality.',output:'Sentiment: Positive'},{input:'Meh, it was okay. Nothing special.',output:'Sentiment: Neutral'}]},{sentiment:{prefix:'Analyze the sentiment of each text.',examples:[{input:'I love this product! Best purchase ever!',output:'Positive (5/5)'},{input:'Completely disappointed. Would not recommend.',output:'Negative (1/5)'},{input:'Average. Does what it says.',output:'Neutral (3/5)'}]},{extraction:{prefix:'Extract the key information.',examples:[{input:'John Smith works as Senior Engineer at Google. Email: john.smith@gmail.com, Phone: 555-123-4567',output:'Name: John Smith\nTitle: Senior Engineer\nCompany: Google\nEmail: john.smith@gmail.com\nPhone: 555-123-4567'},{input:'Acme Corp acquired another startup for $50M in San Francisco',output:'Company: Acme Corp\nAction: Acquired startup\nAmount: $50M\nLocation: San Francisco'}]},{translation:{prefix:'Translate to Spanish.',examples:[{input:'Hello, how are you?',output:'Hola, como estas?'},{input:'Where is the nearest airport?',output:'Donde esta el aeropuerto mas cercano?'}]},{summarization:{prefix:'Summarize in 3 bullet points.',examples:[{input:'Python is a programming language created by Guido van Rossum in 1991. It emphasizes code readability with significant indentation. Python is used in web development, data science, AI, scientific computing, and more.',output:'• Created by Guido van Rossum in 1991\n• Emphasizes code readability\n• Used in web dev, data science, AI, and scientific computing'}]}};function generateExamples(){const topic=document.getElementById('topic').value;const task=document.getElementById('taskType').value;const num=parseInt(document.getElementById('numExamples').value);const t=templates[task];const container=document.getElementById('examples');let html=`<div style="color:#667eea;font-weight:700;margin-bottom:10px">${t.prefix}</div>`;t.examples.slice(0,num).forEach((e,i)=>{html+=`<div class="example"><div class="example-label">Example ${i+1}</div><div class="example-content">Input: ${e.input}\n\nOutput: ${e.output}</div></div>`;});container.innerHTML=html;}function generateCode(){document.getElementById('codeOutput').style.display='block';const task=document.getElementById('taskType').value;const topic=document.getElementById('topic').value;const t=templates[task];const examples=t.examples.map(e=>`Example:\nInput: ${e.input}\nOutput: ${e.output}`).join('\n\n');document.getElementById('codeOutput').textContent=`# Few-shot Prompt for ${task}
# Add to your system prompt or user message

prompt = f"""${t.prefix}

${examples}

Now answer this:
Input: Your ${topic} question here
Output:"""`;}generateExamples();</script></body></html>
