<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free UUID Generator - ToolGen</title>
    <meta name="description" content="Generate UUIDs (v4) instantly. One-click copy. Free UUID generator for developers. No registration required.">
    <meta name="keywords" content="uuid generator, guid generator, random uuid, unique id generator">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:700px;margin:0 auto;padding:60px 20px;text-align:center}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .uuid-box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:25px;margin:30px 0;font-family:'Courier New',monospace;font-size:1.4rem;color:#4ade80;word-break:break-all}
        .btn{padding:14px 36px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:1.1rem;margin:10px}
        .btn:hover{transform:scale(1.05)}
        .desc{color:#888;max-width:500px;margin:0 auto}
        .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        .copied{color:#4ade80;font-size:0.9rem;height:20px;margin-top:5px}
    </style>
</head>
<body>
<div class="container">
<a href="/" style="color:#667eea;text-decoration:none;font-size:0.9rem">&larr; Back to ToolGen</a>
<h1>UUID Generator</h1>
<p class="desc">Generate random UUIDs (Version 4) instantly. Click Generate for a new one.</p>
<div class="uuid-box" id="uuidDisplay">Click Generate to create a UUID</div>
<div class="copied" id="copied"></div>
<div class="row">
<button class="btn" onclick="gen()">Generate</button>
<button class="btn" style="background:#333" onclick="copy()">Copy</button>
</div>
</div>
<script>
function gen(){
const u='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
const r=Math.random()*16|0;
return(c==='x'?r:(r&0x3|0x8)).toString(16)});
document.getElementById('uuidDisplay').textContent=u;
document.getElementById('copied').textContent='';
}
function copy(){
const u=document.getElementById('uuidDisplay').textContent;
if(u.length>30){navigator.clipboard.writeText(u);document.getElementById('copied').textContent='✓ Copied!';setTimeout(()=>document.getElementById('copied').textContent='',2000)}
}
gen();
</script>
</body></html>
