<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator - ToolGen</title>
    <meta name="description" content="Generate random UUIDs for your projects. Free UUID generator tool.">
    <link rel="canonical" href="https://toolgen.xyz/tools/uuid-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .uuid-display { background: #0a0a0a; border: 2px solid #667eea; border-radius: 10px; padding: 20px; font-family: 'Courier New', monospace; font-size: 1.2rem; color: #667eea; word-break: break-all; margin: 20px 0; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔢 UUID Generator</h1>
        <p class="subtitle">Generate random UUIDs for your projects instantly.</p>
        <div class="card">
            <div class="uuid-display" id="uuidDisplay">Click "Generate" to create a UUID</div>
            <button class="btn" onclick="generateUUID()">⚡ Generate</button>
            <button class="btn" onclick="copyUUID()">📋 Copy</button>
            <button class="btn" onclick="generateMultiple()">📋 Copy 10</button>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        let currentUUID = '';
        function generateUUID() {
            currentUUID = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
            document.getElementById('uuidDisplay').textContent = currentUUID;
        }
        function copyUUID() {
            if (!currentUUID) return;
            navigator.clipboard.writeText(currentUUID);
            alert('UUID copied!');
        }
        function generateMultiple() {
            let uuids = [];
            for (let i = 0; i < 10; i++) {
                uuids.push('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                }));
            }
            navigator.clipboard.writeText(uuids.join('\n'));
            alert('10 UUIDs copied!');
        }
        generateUUID();
    </script>
</body>
</html>
