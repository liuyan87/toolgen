yId('contrast').value;const s=document.getElementById('saturation').value;const h=document.getElementById('hue').value;const bl=document.getElementById('blur').value;document.getElementById('bVal').textContent=b+'%';document.getElementById('cVal').textContent=c+'%';document.getElementById('sVal').textContent=s+'%';document.getElementById('hVal').textContent=h+'°';document.getElementById('blVal').textContent=bl+'px';img.style.filter=`brightness(${b}%) contrast(${c}%) saturate(${s}%) hue-rotate(${h}deg) blur(${bl}px)`;}function setFilter(f){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');const presets={none:{'brightness':100,'contrast':100,'saturation':100,'hue':0},grayscale:{'brightness':100,'contrast':100,'saturation':0,'hue':0},sepia:{'brightness':100,'contrast':90,'saturation':80,'hue':0},invert:{'brightness':100,'contrast':100,'saturation':100,'hue':0},vintage:{'brightness':110,'contrast':95,'saturation':70,'hue':30},warm:{'brightness':105,'contrast':100,'saturation':120,'hue':0},cool:{'brightness':100,'contrast':105,'saturation':90,'hue':200},highContrast:{'brightness':100,'contrast':150,'saturation':120,'hue':0}};const p=presets[f]||presets.none;document.getElementById('brightness').value=p.brightness;document.getElementById('contrast').value=p.contrast;document.getElementById('saturation').value=p.saturation;document.getElementById('hue').value=p.hue;apply();}function download(){canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0);const a=document.createElement('a');a.download='adjusted-image.png';a.href=canvas.toDataURL('image/png');a.click();}function reset(){document.getElementById('brightness').value=100;document.getElementById('contrast').value=100;document.getElementById('saturation').value=100;document.getElementById('hue').value=0;document.getElementById('blur').value=0;apply();}</script></body></html>
