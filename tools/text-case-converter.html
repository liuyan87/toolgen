<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Text Case Converter - ToolGen</title><meta name="description" content="Convert text between UPPERCASE, lowercase, Title Case, and Sentence case instantly."><meta name="keywords" content="text case converter, uppercase, lowercase, title case, sentence case, text converter"><link rel="canonical" href="https://toolgen.xyz/tools/text-case-converter.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:700px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:1rem;outline:none;resize:vertical;min-height:150px}textarea:focus{border-color:#667eea}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.btn{display:inline-block;padding:10px 20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:0.9rem;font-weight:600}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔠 Text Case Converter</h1><p class="subtitle">Convert text between UPPERCASE, lowercase, Title Case, and more.</p><div class="card"><textarea id="input" placeholder="Type your text here..."></textarea><div class="buttons"><button class="btn" onclick="convert('upper')">UPPERCASE</button><button class="btn" onclick="convert('lower')">lowercase</button><button class="btn" onclick="convert('title')">Title Case</button><button class="btn" onclick="convert('sentence')">Sentence case</button><button class="btn" onclick="convert('alternate')">aLtErNaTiNg</button><button class="btn" onclick="convert('inverse')">INVERSE</button></div><textarea id="output" readonly style="margin-top:15px"></textarea><div class="buttons"><button class="btn" onclick="copy()">📋 Copy</button><button class="btn" onclick="swap()">⇅ Swap</button></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function convert(type){const t=document.getElementById('input').value;let out='';if(type==='upper')out=t.toUpperCase();else if(type==='lower')out=t.toLowerCase();else if(type==='title')out=t.split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');else if(type==='sentence')out=t.charAt(0).toUpperCase()+t.slice(1).toLowerCase();else if(type==='alternate'){out='';for(let i=0;i<t.length;i++)out+=i%2===0?t.charAt(i).toUpperCase():t.charAt(i).toLowerCase();}else if(type==='inverse')out=t.split('').map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('');document.getElementById('output').value=out;}function copy(){navigator.clipboard.writeText(document.getElementById('output').value);}function swap(){const i=document.getElementById('input');const o=document.getElementById('output');const tmp=i.value;i.value=o.value;o.value=tmp;}</script></body></html>
