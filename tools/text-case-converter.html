<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Case Converter - ToolGen</title>
    <meta name="description" content="Convert text between different cases: lowercase, UPPERCASE, Title Case, Sentence case. Free online case converter tool.">
    <meta name="keywords" content="case converter, lowercase, uppercase, title case, sentence case, convert case, text converter">
    <link rel="canonical" href="https://toolgen.xyz/tools/text-case-converter.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-size: 1.1rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 120px; }
        textarea:focus { border-color: #667eea; }
        .case-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .case-btn { padding: 10px 18px; background: #0a0a0a; border: 2px solid #333; border-radius: 20px; color: #888; cursor: pointer; font-size: 0.85rem; }
        .case-btn:hover { border-color: #667eea; color: #fff; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .output-box { background: #0a0a0a; border-radius: 10px; padding: 20px; margin-top: 15px; font-size: 1.1rem; color: #22c55e; min-height: 80px; white-space: pre-wrap; }
        .copy-msg { color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>Abc Case Converter</h1>
        <p class="subtitle">Convert text between lowercase, UPPERCASE, Title Case, and more.</p>

        <div class="card">
            <label>Enter your text:</label>
            <textarea id="input" placeholder="Type or paste your text here..."></textarea>

            <div class="case-btns">
                <button class="case-btn" onclick="convert('lower')">lowercase</button>
                <button class="case-btn" onclick="convert('upper')">UPPERCASE</button>
                <button class="case-btn" onclick="convert('title')">Title Case</button>
                <button class="case-btn" onclick="convert('sentence')">Sentence case</button>
                <button class="case-btn" onclick="convert('toggle')">tOGGLE cASE</button>
                <button class="case-btn" onclick="convert('capital')">Capitalized</button>
            </div>

            <button class="btn" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="output-box" id="output">Results will appear here...</div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/text-case-converter.html">Case Converter</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function convert(type) {
            const text = document.getElementById('input').value;
            if (!text) {
                document.getElementById('output').textContent = 'Results will appear here...';
                return;
            }
            let result = '';
            switch(type) {
                case 'lower': result = text.toLowerCase(); break;
                case 'upper': result = text.toUpperCase(); break;
                case 'title': result = text.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); break;
                case 'sentence': result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase()); break;
                case 'toggle': result = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join(''); break;
                case 'capital': result = text.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' '); break;
            }
            document.getElementById('output').textContent = result;
        }

        function copy() {
            const text = document.getElementById('output').textContent;
            if (text && text !== 'Results will appear here...') {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = 'Results will appear here...';
        }
    </script>
</body>
</html>
