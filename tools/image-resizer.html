<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Image Resizer - ToolGen</title>
    <meta name="description" content="Resize images to any dimension online. Maintain aspect ratio or set custom size. Free.">
    <meta name="keywords" content="image resizer, resize image, resize photo, image size">
    <link rel="canonical" href="https://toolgen.xyz/tools/image-resizer.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .drop-zone { border: 2px dashed #667eea; border-radius: 16px; padding: 60px 20px; cursor: pointer; transition: all 0.3s; }
        .drop-zone:hover { background: rgba(102,126,234,0.1); }
        input[type="file"] { display: none; }
        .options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin: 20px 0; text-align: left; }
        .options label { color: #aaa; font-size: 0.85rem; margin-bottom: 5px; }
        .options input { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; }
        .presets { display: flex; gap: 10px; flex-wrap: wrap; margin: 15px 0; justify-content: center; }
        .preset { padding: 6px 14px; background: #333; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
        .preset:hover { background: #667eea; }
        .preview-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin: 15px 0; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
        @media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📐 Image Resizer</h1>
        <p class="subtitle">Resize images to any dimension. Maintain quality and aspect ratio.</p>
        <div class="card">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem;">🖼️</div>
                <p>Click or drag image to upload</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="loadImage(this.files[0])">
            <input type="file" id="fileInput" accept="image/*" onchange="resizeImage(this.files[0])" style="display:none;">
            <img id="previewImg" class="preview-img" style="display:none;">
            <div class="options" id="options" style="display:none;">
                <div><label>Width</label><input type="number" id="width" value="800" oninput="updateHeight()"></div>
                <div><label>Height</label><input type="number" id="height" value="600"></div>
                <div><label>Quality</label><input type="number" id="quality" value="90" min="10" max="100"></div>
            </div>
            <div class="presets" id="presets" style="display:none;">
                <span class="preset" onclick="setSize(1920,1080)">1920×1080</span>
                <span class="preset" onclick="setSize(1280,720)">1280×720</span>
                <span class="preset" onclick="setSize(800,600)">800×600</span>
                <span class="preset" onclick="setSize(640,480)">640×480</span>
                <span class="preset" onclick="setSize(300,300)">300×300</span>
            </div>
            <div id="btnArea" style="display:none;">
                <button class="btn" onclick="document.getElementById('fileInput').click()">📂 Change Image</button>
                <button class="btn" onclick="doResize()">⬇️ Resize & Download</button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        let currentImg = null;
        function loadImage(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('previewImg').style.display = 'block';
                    document.getElementById('width').value = img.width;
                    document.getElementById('height').value = img.height;
                    document.getElementById('options').style.display = 'grid';
                    document.getElementById('presets').style.display = 'flex';
                    document.getElementById('btnArea').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        function setSize(w, h) { document.getElementById('width').value = w; document.getElementById('height').value = h; }
        function updateHeight() {
            if (currentImg) {
                const ratio = currentImg.height / currentImg.width;
                document.getElementById('height').value = Math.round(document.getElementById('width').value * ratio);
            }
        }
        function doResize() {
            if (!currentImg) return;
            const canvas = document.createElement('canvas');
            canvas.width = parseInt(document.getElementById('width').value);
            canvas.height = parseInt(document.getElementById('height').value);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);
            const link = document.createElement('a');
            link.download = 'resized-image.png';
            link.href = canvas.toDataURL('image/png', parseInt(document.getElementById('quality').value)/100);
            link.click();
        }
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
