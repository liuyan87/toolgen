const base64=dataUrl.split(',')[1];const size=Math.round(base64.length*0.75);document.getElementById('compImg').src=dataUrl;document.getElementById('compSize').textContent=formatSize(size);const origSize=parseInt(imgEl.src.length*0.75)||size;const savings=Math.max(0,Math.round((1-size/origSize)*100));document.getElementById('savings').textContent=savings+'%';document.getElementById('finalSize').textContent=formatSize(size);}function updateQuality(){quality=parseInt(document.getElementById('quality').value);document.getElementById('qVal').textContent=quality+'%';document.getElementById('qualityVal').textContent=quality+'%';compress();}function setFormat(f,btn){format=f;document.querySelectorAll('.format-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');compress();}function download(){const canvas=document.createElement('canvas');canvas.width=imgEl.width;canvas.height=imgEl.height;const ctx=canvas.getContext('2d');ctx.drawImage(imgEl,0,0);const ext=format==='image/jpeg'?'jpg':format==='image/png'?'png':'webp';const a=document.createElement('a');a.download=`compressed.${ext}`;a.href=canvas.toDataURL(format,quality/100);a.click();}function formatSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/(1024*1024)).toFixed(2)+' MB';}</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
