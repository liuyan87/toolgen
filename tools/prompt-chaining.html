dius:12px;padding:20px;text-align:center;cursor:pointer;color:#667eea;font-size:0.95rem;transition:all 0.2s;margin-bottom:20px}.add-step:hover{background:rgba(102,126,234,0.1)}.output-card{background:#0a0a0a;border:2px solid #667eea;border-radius:12px;padding:15px;margin-top:15px}.output-card textarea{width:100%;min-height:300px;padding:12px;border-radius:8px;border:none;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.85rem;resize:vertical;outline:none}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔗 Prompt Chaining Builder</h1><p class="subtitle">Build multi-step prompt workflows. Chain prompts together for complex AI tasks.</p><div class="card"><div class="chain" id="chain"><div class="step"><div class="step-num">1</div><div class="step-content"><div class="step-header"><div class="step-title">📥 Step 1</div></div><textarea placeholder="Describe step 1...">Generate a list of 5 trending topics in AI</textarea></div></div></div><div class="arrow">⬇️</div><div class="add-step" onclick="addStep()">+ Add Chain Step</div><button class="btn" onclick="generateChain()">⚡ Generate Chain Code</button><div class="output-card" id="outputCard" style="display:none"><div style="color:#667eea;font-weight:700;margin-bottom:10px">Generated Chain:</div><textarea id="output" readonly onclick="this.select()"></textarea><button class="btn" onclick="copyOutput()">📋 Copy</button></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let stepCount=1;function addStep(){stepCount++;const chain=document.getElementById('chain');const arrow=document.querySelector('.arrow');const div=document.createElement('div');div.className='step';div.innerHTML=`<div class="step-num">${stepCount}</div><div class="step-content"><div class="step-header"><div class="step-title">Step ${stepCount}</div><button class="remove-step" onclick="removeStep(this)">×</button></div><textarea placeholder="Describe what this step does...">Step ${stepCount}...</textarea></div>`;chain.insertBefore(div,arrow);chain.insertBefore(document.createElement('div'),arrow);chain.insertBefore(document.createElement('div'),arrow);document.querySelectorAll('.arrow')[1].textContent='⬇️';}function removeStep(btn){const step=btn.closest('.step');const arrows=document.querySelectorAll('.arrow');if(arrows.length>1)arrows[1].remove();step.previousElementSibling.remove();step.remove();stepCount--;renumber();}function renumber(){let num=1;document.querySelectorAll('.step').forEach(s=>{s.querySelector('.step-num').textContent=num++;});}function generateChain(){const steps=[];document.querySelectorAll('.step').forEach(s=>{steps.push(s.querySelector('textarea').value);});let code='# Prompt Chain - Generated by ToolGen\n\ndef run_prompt_chain(input_text, llm):\n    results = []\n    ';steps.forEach((s,i)=>{code+=`\n    # Step ${i+1}: ${s.substring(0,50)}...\n    response_${i+1} = llm(f"""${s}\n    \nContext: {results[-1] if results else input_text}""")\n    results.append(response_${i+1})\n    `;});code+=`\n    return results[-1]\n\n# Usage:\n# result = run_prompt_chain("your input", client)`;document.getElementById('output').value=code;document.getElementById('outputCard').style.display='block';}function copyOutput(){navigator.clipboard.writeText(document.getElementById('output').value);}</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
