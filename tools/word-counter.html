<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word Counter - ToolGen</title>
    <meta name="description" content="Count words, characters, sentences, and paragraphs instantly. Paste your text for detailed statistics. Free, no registration.">
    <meta name="keywords" content="word counter, character counter, sentence counter, paragraph counter">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:30px}
        .back{color:#667eea;text-decoration:none}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .desc{color:#888}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
        .card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;text-align:center}
        .num{font-size:2rem;font-weight:800;color:#667eea}
        .lbl{color:#888;font-size:0.85rem;margin-top:5px}
        textarea{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-size:1rem;padding:12px;min-height:200px;resize:vertical}
        label{display:block;color:#888;font-size:0.8rem;margin-bottom:8px;text-transform:uppercase}
        .box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-top:15px}
        .extra{color:#888;font-size:0.9rem}
        @media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
<div class="container">
<header><a href="/" class="back">&larr; Back to ToolGen</a>
<h1>Word Counter</h1><p class="desc">Count words, characters, sentences, and paragraphs in real-time.</p></header>
<div class="stats">
<div class="card"><div class="num" id="w">0</div><div class="lbl">Words</div></div>
<div class="card"><div class="num" id="c">0</div><div class="lbl">Characters</div></div>
<div class="card"><div class="num" id="s">0</div><div class="lbl">Sentences</div></div>
<div class="card"><div class="num" id="p">0</div><div class="lbl">Paragraphs</div></div>
</div>
<div class="box"><label>Your Text</label>
<textarea id="text" placeholder="Type or paste text here..." oninput="count()"></textarea>
<div class="extra" id="extra"></div></div>
</div>
<script>
function count(){
const t=document.getElementById('text').value;
const words=t.trim()?t.trim().split(/\s+/).length:0;
const chars=t.length;
const sentences=t.split(/[.!?。！？]+/).filter(x=>x.trim()).length;
const paragraphs=t.split(/\n\n+/).filter(x=>x.trim()).length;
document.getElementById('w').textContent=words;
document.getElementById('c').textContent=chars;
document.getElementById('s').textContent=sentences;
document.getElementById('p').textContent=Math.max(paragraphs,t.trim()?1:0);
const freq={};
(t.match(/\b[a-z]{4,}\b/g)||[]).forEach(x=>{freq[x]=(freq[x]||0)+1});
const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,5);
document.getElementById('extra').innerHTML=top.length?'Top keywords: '+top.map(([w,c])=>w+'('+c+')').join(', '):'';
}
</script>
</body></html>
