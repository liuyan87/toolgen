<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Word Counter - ToolGen</title><meta name="description" content="Count words, characters, sentences, and paragraphs in your text instantly. Free online word counter tool."><meta name="keywords" content="word counter, character counter, count words, text analysis, letter counter"><link rel="canonical" href="https://toolgen.xyz/tools/word-counter.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.95rem;outline:none;resize:vertical;min-height:200px}textarea:focus{border-color:#667eea}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}.stat{background:#0a0a0a;border-radius:10px;padding:20px;text-align:center}.stat-num{font-size:2rem;font-weight:700;color:#667eea}.stat-label{color:#888;font-size:0.85rem;margin-top:5px}.reading{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:10px;padding:15px;margin-top:15px;text-align:center;font-weight:600}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>📝 Word Counter</h1><p class="subtitle">Count words, characters, sentences, and paragraphs in your text instantly.</p><div class="card"><textarea id="input" placeholder="Type or paste your text here..." oninput="count()"></textarea><div class="stats"><div class="stat"><div class="stat-num" id="words">0</div><div class="stat-label">Words</div></div><div class="stat"><div class="stat-num" id="chars">0</div><div class="stat-label">Characters</div></div><div class="stat"><div class="stat-num" id="sentences">0</div><div class="stat-label">Sentences</div></div><div class="stat"><div class="stat-num" id="paragraphs">0</div><div class="stat-label">Paragraphs</div></div></div><div class="reading" id="reading"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function count(){const t=document.getElementById('input').value;const words=t.trim()?t.trim().split(/\s+/).length:0;const chars=t.length;const sentences=(t.match(/[.!?]+/g)||[]).length;const paragraphs=t.trim()?t.split(/\n\n+/).filter(p=>p.trim()).length:0;document.getElementById('words').textContent=words;document.getElementById('chars').textContent=chars;document.getElementById('sentences').textContent=sentences;document.getElementById('paragraphs').textContent=paragraphs;const mins=Math.ceil(words/200);document.getElementById('reading').textContent=`~${mins} min read at 200 wpm`;}count();</script></body></html>
