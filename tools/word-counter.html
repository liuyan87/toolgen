<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word Counter - ToolGen</title>
    <meta name="description" content="Count words, characters, sentences, and paragraphs instantly. Free online word counter tool.">
    <meta name="keywords" content="word counter, character count, sentence counter, paragraph counter, online counter">
    <link rel="canonical" href="https://toolgen.xyz/tools/word-counter.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 200px; }
        textarea:focus { border-color: #667eea; }
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 12px; padding: 20px; text-align: center; }
        .stat-num { font-size: 2rem; font-weight: 800; }
        .stat-label { font-size: 0.85rem; opacity: 0.8; margin-top: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔢 Word Counter</h1>
        <p class="subtitle">Count words, characters, sentences, and paragraphs instantly.</p>
        <div class="card">
            <textarea id="text" placeholder="Paste or type your text here..." oninput="count()"></textarea>
            <div class="stats" id="stats">
                <div class="stat-box"><div class="stat-num" id="words">0</div><div class="stat-label">Words</div></div>
                <div class="stat-box"><div class="stat-num" id="chars">0</div><div class="stat-label">Characters</div></div>
                <div class="stat-box"><div class="stat-num" id="sentences">0</div><div class="stat-label">Sentences</div></div>
                <div class="stat-box"><div class="stat-num" id="paragraphs">0</div><div class="stat-label">Paragraphs</div></div>
                <div class="stat-box"><div class="stat-num" id="reading">0</div><div class="stat-label">Min Read</div></div>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        function count() {
            const text = document.getElementById('text').value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const sentences = (text.match(/[.!?]+/g) || []).length;
            const paragraphs = text.trim() ? text.split(/\n\n+/).filter(p => p.trim()).length : 0;
            const reading = Math.ceil(words / 200);
            document.getElementById('words').textContent = words;
            document.getElementById('chars').textContent = chars;
            document.getElementById('sentences').textContent = sentences;
            document.getElementById('paragraphs').textContent = paragraphs;
            document.getElementById('reading').textContent = reading;
        }
    </script>
</body>
</html>
