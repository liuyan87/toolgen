    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }

        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        input[type="date"] { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; margin: 15px 0; }
        input[type="date"]:focus { border-color: #667eea; outline: none; }
        .result { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; padding: 30px; margin: 20px 0; }
        .result-num { font-size: 4rem; font-weight: 800; }
        .result-label { font-size: 1.2rem; opacity: 0.9; }
        .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .detail-box { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; }
        .detail-box .num { font-size: 1.5rem; font-weight: 700; }
        .detail-box .lbl { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: 600; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎂 Age Calculator</h1>
        <p class="subtitle">Find out exactly how old you are in years, months, and days.</p>
        <div class="card">
            <label style="display:block;margin-bottom:8px;font-weight:600;color:#aaa;">Enter your birthdate</label>
            <input type="date" id="birthdate" onchange="calculate()">
            <button class="btn" onclick="calculate()">⚡ Calculate Age</button>
            <div class="result" id="result" style="display:none;">
                <div class="result-num" id="years">0</div>
                <div class="result-label">years old</div>
                <div class="details">
                    <div class="detail-box"><div class="num" id="months">0</div><div class="lbl">Months</div></div>
                    <div class="detail-box"><div class="num" id="days">0</div><div class="lbl">Days</div></div>
                    <div class="detail-box"><div class="num" id="totalDays">0</div><div class="lbl">Total Days</div></div>
                </div>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        function calculate() {
            const birth = document.getElementById('birthdate').value;
            if (!birth) return;
            const birthDate = new Date(birth);
            const today = new Date();
            let y = today.getFullYear() - birthDate.getFullYear();
            let m = today.getMonth() - birthDate.getMonth();
            let d = today.getDate() - birthDate.getDate();
            if (d < 0) { m--; d += new Date(today.getFullYear(), today.getMonth(), 0).getDate(); }
            if (m < 0) { y--; m += 12; }
            const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
            document.getElementById('years').textContent = y;
            document.getElementById('months').textContent = m;
            document.getElementById('days').textContent = d;
            document.getElementById('totalDays').textContent = totalDays.toLocaleString();
            document.getElementById('result').style.display = 'block';
        }
    </script>
