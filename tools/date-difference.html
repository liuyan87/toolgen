<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Date Difference Calculator - ToolGen</title>
    <meta name="description" content="Calculate days between two dates. Find date difference in days, weeks, months. Free online date difference calculator.">
    <meta name="keywords" content="date calculator, days between dates, date difference, calculate days, days calculator, date diff">
    <link rel="canonical" href="https://toolgen.xyz/tools/date-difference.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input[type="date"] { padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; width: 100%; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box .num { font-size: 2rem; font-weight: 800; color: #22c55e; }
        .result-box .label { color: #888; font-size: 0.8rem; margin-top: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📅 Date Difference Calculator</h1>
        <p class="subtitle">Calculate the exact difference between two dates.</p>

        <div class="card">
            <div class="date-row">
                <div>
                    <label>Start Date:</label>
                    <input type="date" id="startDate">
                </div>
                <div>
                    <label>End Date:</label>
                    <input type="date" id="endDate">
                </div>
            </div>

            <button class="btn" onclick="calculate()">Calculate</button>

            <div class="result-grid" id="results" style="display:none;">
                <div class="result-box"><div class="num" id="days">0</div><div class="label">Days</div></div>
                <div class="result-box"><div class="num" id="weeks">0</div><div class="label">Weeks</div></div>
                <div class="result-box"><div class="num" id="months">0</div><div class="label">Months</div></div>
                <div class="result-box"><div class="num" id="years">0</div><div class="label">Years</div></div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/date-difference.html">Date Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function calculate() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);

            if (!start.getTime() || !end.getTime()) {
                alert('Please select both dates');
                return;
            }

            if (end < start) {
                alert('End date must be after start date');
                return;
            }

            const diffMs = end - start;
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(days / 7);
            const months = Math.floor(days / 30.44);
            const years = Math.floor(days / 365.25);

            document.getElementById('days').textContent = days;
            document.getElementById('weeks').textContent = weeks;
            document.getElementById('months').textContent = months;
            document.getElementById('years').textContent = years;
            document.getElementById('results').style.display = 'grid';
        }

        // Set default dates
        const today = new Date();
        const lastWeek = new Date(today - 7 * 24 * 60 * 60 * 1000);
        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = lastWeek;
        calculate();
    </script>
</body>
</html>
