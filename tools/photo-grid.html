<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Photo Grid / Collage Maker - ToolGen</title><meta name="description" content="Create photo grids and collages online. Combine multiple images into a grid. Free."><meta name="keywords" content="photo grid, collage maker, image grid, photo collage, combine images, grid maker"><link rel="canonical" href="https://toolgen.xyz/tools/photo-grid.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}.controls{display:flex;flex-wrap:wrap;gap:15px;margin-bottom:20px;align-items:center}.controls label{color:#888;font-size:0.9rem}.controls select,.controls input{padding:10px 14px;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:0.95rem}.controls select:focus,.controls input:focus{border-color:#667eea;outline:none}.grid-preview{display:grid;gap:4px;margin:20px 0;max-width:600px;margin-left:auto;margin-right:auto}.grid-preview img{width:100%;height:100%;object-fit:cover;border-radius:4px;aspect-ratio:1;background:#222;cursor:pointer;transition:opacity 0.2s}.grid-preview img:hover{opacity:0.7}.cell-placeholder{width:100%;aspect-ratio:1;border:2px dashed #333;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#333;cursor:pointer}.cell-placeholder:hover{border-color:#667eea;color:#667eea}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🖼️ Photo Grid Maker</h1><p class="subtitle">Create beautiful photo grids and collages. Combine multiple images into one.</p><div class="card"><div class="controls"><label>Columns:</label><select id="cols" onchange="updateGrid()"><option value="2">2 Columns</option><option value="3" selected>3 Columns</option><option value="4">4 Columns</option></select><label>Gap:</label><select id="gap" onchange="updateGap()"><option value="0">No Gap</option><option value="4" selected>4px</option><option value="8">8px</option><option value="16">16px</option></select><button class="btn" onclick="downloadGrid()">💾 Download Grid</button></div><div class="grid-preview" id="gridPreview"></div><input type="file" id="fileInput" multiple accept="image/*" style="display:none"></input></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let images=[];let cols=3;let gapSize=4;const grid=document.getElementById('gridPreview');const fi=document.getElementById('fileInput');function updateGrid(){cols=parseInt(document.getElementById('cols').value);renderGrid();}function updateGap(){gapSize=parseInt(document.getElementById('gap').value);grid.style.gap=gapSize+'px';}function renderGrid(){grid.innerHTML='';for(let i=0;i<cols*cols;i++){if(images[i]){const div=document.createElement('div');div.style.position='relative';const img=document.createElement('img');img.src=images[i];img.onclick=()=>replaceImage(i);div.appendChild(img);const rm=document.createElement('button');rm.textContent='×';rm.style.cssText='position:absolute;top:2px;right:2px;background:rgba(239,68,68,0.9);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:24px';rm.onclick=e=>{e.stopPropagation();images[i]=null;renderGrid();};div.appendChild(rm);grid.appendChild(div);}else{const d=document.createElement('div');d.className='cell-placeholder';d.textContent='+';d.onclick=()=>selectImage(i);grid.appendChild(d);}}}function selectImage(idx){fi.onchange=e=>{if(e.target.files[0])loadImage(e.target.files[0],idx);};fi.click();}function replaceImage(idx){selectImage(idx);}function loadImage(file,idx){const reader=new FileReader();reader.onload=e=>{images[idx]=e.target.result;renderGrid();};reader.readAsDataURL(file);}renderGrid();function downloadGrid(){const maxSize=2000;const cellSize=Math.floor(maxSize/cols);const oc=document.createElement('canvas');oc.width=cellSize*cols;oc.height=cellSize*cols;const octx=oc.getContext('2d');octx.fillStyle='#1a1a1a';octx.fillRect(0,0,oc.width,oc.height);let loaded=0;let total=cols*cols;images.forEach((src,i)=>{if(src){const img=new Image();img.onload=()=>{const col=i%cols;const row=Math.floor(i/cols);octx.drawImage(img,col*cellSize+gapSize,row*cellSize+gapSize,cellSize-gapSize*2,cellSize-gapSize*2);loaded++;if(loaded===images.filter(Boolean).length){const a=document.createElement('a');a.download='photo-grid.png';a.href=oc.toDataURL('image/png');a.click();}};img.src=src;}});if(images.filter(Boolean).length===0)alert('Add at least one image first!');}</script></body></html>
