<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free HTTP Status Codes Reference - ToolGen</title>
    <meta name="description" content="Complete HTTP status codes reference guide. 200, 301, 404, 500 errors explained. Free online HTTP status code checker.">
    <meta name="keywords" content="http status codes, 404 error, 500 error, 301 redirect, http error codes, status code meanings, http response codes">
    <link rel="canonical" href="https://toolgen.xyz/tools/http-status-codes.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .search-box { margin-bottom: 20px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #667eea; }
        .category { margin-bottom: 20px; }
        .cat-title { color: #667eea; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid #333; }
        .code-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .code-item { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px 15px; cursor: pointer; transition: all 0.2s; }
        .code-item:hover { border-color: #667eea; transform: translateY(-2px); }
        .code-item .code { font-weight: 800; font-size: 1.1rem; }
        .code-item .desc { color: #888; font-size: 0.8rem; margin-top: 4px; }
        .code-item.success .code { color: #22c55e; }
        .code-item.redirect .code { color: #f59e0b; }
        .code-item.client .code { color: #ef4444; }
        .code-item.server .code { color: #dc2626; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📡 HTTP Status Codes</h1>
        <p class="subtitle">Complete reference guide for all HTTP status codes.</p>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search status codes (e.g. 404, redirect, not found)..." oninput="filter()">
        </div>

        <div id="codes"></div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/http-status-codes.html">HTTP Status Codes</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const codes = [
            // 1xx Informational
            { code: '100', name: 'Continue', desc: 'Server receives partial request', type: 'info' },
            { code: '101', name: 'Switching Protocols', desc: 'Protocol upgrade accepted', type: 'info' },
            // 2xx Success
            { code: '200', name: 'OK', desc: 'Request succeeded', type: 'success' },
            { code: '201', name: 'Created', desc: 'Resource created', type: 'success' },
            { code: '204', name: 'No Content', desc: 'Request succeeded, no content', type: 'success' },
            // 3xx Redirect
            { code: '301', name: 'Moved Permanently', desc: 'Permanent redirect', type: 'redirect' },
            { code: '302', name: 'Found', desc: 'Temporary redirect', type: 'redirect' },
            { code: '304', name: 'Not Modified', desc: 'Cached version valid', type: 'redirect' },
            { code: '307', name: 'Temporary Redirect', desc: 'Temporary redirect (POST unchanged)', type: 'redirect' },
            { code: '308', name: 'Permanent Redirect', desc: 'Permanent redirect (POST unchanged)', type: 'redirect' },
            // 4xx Client Error
            { code: '400', name: 'Bad Request', desc: 'Malformed request syntax', type: 'client' },
            { code: '401', name: 'Unauthorized', desc: 'Authentication required', type: 'client' },
            { code: '403', name: 'Forbidden', desc: 'Access denied', type: 'client' },
            { code: '404', name: 'Not Found', desc: 'Resource not found', type: 'client' },
            { code: '405', name: 'Method Not Allowed', desc: 'HTTP method not supported', type: 'client' },
            { code: '408', name: 'Request Timeout', desc: 'Server timeout waiting for request', type: 'client' },
            { code: '429', name: 'Too Many Requests', desc: 'Rate limit exceeded', type: 'client' },
            // 5xx Server Error
            { code: '500', name: 'Internal Server Error', desc: 'Generic server error', type: 'server' },
            { code: '502', name: 'Bad Gateway', desc: 'Invalid response from upstream', type: 'server' },
            { code: '503', name: 'Service Unavailable', desc: 'Server temporarily down', type: 'server' },
            { code: '504', name: 'Gateway Timeout', desc: 'Upstream server timeout', type: 'server' }
        ];

        function render(filter = '') {
            const filtered = codes.filter(c =>
                c.code.includes(filter) ||
                c.name.toLowerCase().includes(filter.toLowerCase()) ||
                c.desc.toLowerCase().includes(filter.toLowerCase())
            );

            const categories = {
                info: { title: '💡 1xx Informational', items: filtered.filter(c => c.type === 'info') },
                success: { title: '✅ 2xx Success', items: filtered.filter(c => c.type === 'success') },
                redirect: { title: '🔄 3xx Redirect', items: filtered.filter(c => c.type === 'redirect') },
                client: { title: '❌ 4xx Client Error', items: filtered.filter(c => c.type === 'client') },
                server: { title: '🚨 5xx Server Error', items: filtered.filter(c => c.type === 'server') }
            };

            document.getElementById('codes').innerHTML = Object.entries(categories)
                .filter(([_, cat]) => cat.items.length > 0)
                .map(([type, cat]) => `
                    <div class="category">
                        <div class="cat-title">${cat.title}</div>
                        <div class="code-grid">
                            ${cat.items.map(c => `
                                <div class="code-item ${c.type}" onclick="copy('${c.code}')">
                                    <div class="code">${c.code} ${c.name}</div>
                                    <div class="desc">${c.desc}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
        }

        function filter() {
            render(document.getElementById('search').value);
        }

        function copy(code) {
            navigator.clipboard.writeText(code);
        }

        render();
    </script>
</body>
</html>
