<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free HTTP Status Codes Reference - ToolGen</title><meta name="description" content="Complete list of HTTP status codes with explanations. 200, 301, 404, 500 and more."><meta name="keywords" content="http status codes, 404, 500 error, status codes, http codes"><link rel="canonical" href="https://toolgen.xyz/tools/http-status-codes.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.search{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#1a1a1a;color:#fff;font-size:1rem;margin-bottom:20px}.search:focus{border-color:#667eea;outline:none}.categories{display:grid;gap:20px}.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}.code{display:flex;align-items:center;gap:12px;padding:12px 15px;background:#1a1a1a;border-radius:8px;border:1px solid #333;cursor:pointer;transition:border-color 0.2s}.code:hover{border-color:#667eea}.code .num{font-weight:700;min-width:45px;color:#667eea}.code .desc{color:#888;font-size:0.9rem}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🌐 HTTP Status Codes</h1><p class="subtitle">Complete reference of HTTP status codes with explanations.</p><input type="text" class="search" id="search" placeholder="Search status codes (e.g. 404, not found)..." oninput="filter()"><div class="categories" id="categories"></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const codes={1:{'name':'Informational','codes':{'100':'Continue','101':'Switching Protocols','102':'Processing'}},2:{'name':'Success','codes':{'200':'OK','201':'Created','202':'Accepted','204':'No Content','206':'Partial Content'}},3:{'name':'Redirection','codes':{'301':'Moved Permanently','302':'Found','303':'See Other','304':'Not Modified','307':'Temporary Redirect','308':'Permanent Redirect'}},4:{'name':'Client Error','codes':{'400':'Bad Request','401':'Unauthorized','403':'Forbidden','404':'Not Found','405':'Method Not Allowed','408':'Request Timeout','409':'Conflict','410':'Gone','413':'Payload Too Large','414':'URI Too Long','415':'Unsupported Media Type','422':'Unprocessable Entity','429':'Too Many Requests'}},5:{'name':'Server Error','codes':{'500':'Internal Server Error','501':'Not Implemented','502':'Bad Gateway','503':'Service Unavailable','504':'Gateway Timeout','505':'HTTP Version Not Supported'}}};function render(){const container=document.getElementById('categories');Object.entries(codes).forEach(([cat,data])=>{const div=document.createElement('div');div.className='cat';div.innerHTML=`<div style="grid-column:1/-1;color:#667eea;font-weight:700;font-size:1.1rem;padding:10px 0">${cat}xx ${data.name}</div>`;Object.entries(data.codes).forEach(([num,desc])=>{const item=document.createElement('div');item.className='code';item.innerHTML=`<span class="num">${num}</span><span class="desc">${desc}</span>`;item.onclick=()=>{navigator.clipboard.writeText(num);};div.appendChild(item);});container.appendChild(div);});}function filter(){const q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.code').forEach(el=>{const text=el.textContent.toLowerCase();el.style.display=text.includes(q)?'':'none';});}render();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body></html>
