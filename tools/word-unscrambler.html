<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Word Unscrambler - ToolGen</title>
    <meta name="description" content="Unscramble letters to form words. Free online word unscrambler for Scrabble, Wordle, and word games.">
    <meta name="keywords" content="word unscrambler, unscramble letters, scrabble cheat, wordle solver, anagram solver, make words from letters">
    <link rel="canonical" href="https://toolgen.xyz/tools/word-unscrambler.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-size: 1.5rem; font-family: monospace; text-transform: uppercase; outline: none; margin-bottom: 15px; letter-spacing: 4px; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .words-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .word-item { background: #0a0a0a; border-radius: 8px; padding: 12px; text-align: center; color: #22c55e; font-size: 1.1rem; font-weight: 600; }
        .word-item.len-3 { color: #888; }
        .count-info { color: #888; margin-top: 15px; font-size: 0.9rem; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📝 Word Unscrambler</h1>
        <p class="subtitle">Unscramble letters to find all possible words. Perfect for Scrabble, Wordle, and word games.</p>

        <div class="card">
            <label>Enter your letters:</label>
            <input type="text" id="letters" placeholder="A B C D E" maxlength="15" oninput="unscramble()">

            <button class="btn" onclick="unscramble()">Find Words</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="words-grid" id="results"></div>
            <p class="count-info" id="countInfo"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/word-unscrambler.html">Word Unscrambler</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const wordList = [
            'the','and','for','are','but','not','you','all','can','had','her','was','one','our','out','day','get','has','him','his','how','man','new','now','old','see','two','way','who','boy','did','own','say','she','too','use','dad','mom','big','red','sun','run','eat','new','old','the','and','are','but','not','how','man','new','now','see','two','way','who','boy','did','own','say','she','too','use','let','put','set','may','tie','win','see','act','add','age','ago','air','ask','bit','box','bug','bus','buy','cap','car','cat','cup','cut','dog','dot','dry','due','ear','end','eye','far','fat','few','fit','fix','fly','fog','fun','fur','gap','gas','god','got','gun','hat','hen','hid','hot','ice','ill','ink','its','jam','jar','jet','job','joy','jug','key','kid','kit','lab','lad','lag','lap','law','lay','led','leg','let','lid','lie','lip','lit','log','lot','low','mad','map','mat','max','mid','mix','mud','net','nor','nor','note','oven','pack','page','pain','pair','pale','palm','park','part','pass','past','path','pick','pill','pine','pink','pipe','plan','play','plot','plug','plus','poem','pool','poor','pope','port','post','pull','push','race','rack','rage','raid','rail','rain','rank','rare','rate','read','real','rear','rent','rest','rice','rich','ride','ring','rise','risk','road','rock','role','roll','roof','room','root','rope','rose','rule','safe','sail','sake','sale','salt','same','sand','sang','save','sea','seed','seek','seem','seen','self','sell','send','sent','set','shed','ship','shoe','shop','shot','show','shut','sick','side','sign','silk','sing','sink','site','size','skin','skip','slip','slow','snow','soft','soil','sold','sole','some','song','soon','sort','soul','spot','star','stay','step','stop','such','suit','sure','swim','tail','take','tale','talk','tall','tank','tape','task','team','tear','tell','temp','tent','term','test','text','than','that','them','then','they','thin','this','thus','till','time','tiny','tire','toe','told','tone','took','tool','tore','torn','town','tree','trim','trip','true','tube','turn','twin','type','unit','upon','used','user','very','view','vote','wage','wait','wake','walk','wall','want','warm','wash','wave','way','weak','wear','week','well','went','were','west','what','when','whom','wide','wife','wild','will','wind','wine','wing','wire','wise','wish','with','woke','wolf','wood','word','wore','work','worn','wrap','yard','yeah','year','your','zero','zone'
        ];

        function unscramble() {
            const input = document.getElementById('letters').value.replace(/\s/g, '').toLowerCase().trim();
            if (!input || input.length < 2) {
                document.getElementById('results').innerHTML = '';
                document.getElementById('countInfo').textContent = '';
                return;
            }

            const letters = input.split('').sort();
            const matches = wordList.filter(w => {
                if (w.length < 2 || w.length > input.length) return false;
                const wSorted = w.split('').sort();
                return wSorted.every(l => letters.includes(l)) && w.split('').every(l => w.split('').filter(x => x === l).length <= letters.filter(x => x === l).length);
            });

            document.getElementById('countInfo').textContent = `Found ${matches.length} words`;
            document.getElementById('results').innerHTML = matches.slice(0, 100).map(w =>
                `<div class="word-item">${w}</div>`
            ).join('');
        }

        function clearText() {
            document.getElementById('letters').value = '';
            document.getElementById('results').innerHTML = '';
            document.getElementById('countInfo').textContent = '';
        }
    </script>
</body>
</html>
