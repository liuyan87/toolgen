<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Upside Down Text Generator - ToolGen</title>
    <meta name="description" content="Flip text upside down. Generate ʇxǝʇ uʍop ǝpısdn text for social media. Free online upside down text converter.">
    <meta name="keywords" content="upside down text, flip text, text inverter, unicode text, uʍop ǝpısdn, upside down generator, backward text">
    <link rel="canonical" href="https://toolgen.xyz/tools/upside-down-text.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }

        h1 { font-size: 2rem; margin-bottom: 10px; }

        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-family: monospace; font-size: 1.1rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 120px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .output-box { background: #0a0a0a; border-radius: 10px; padding: 20px; margin-top: 15px; font-size: 1.8rem; color: #22c55e; min-height: 80px; word-break: break-all; }
        .copy-msg { color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
        .examples { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .ex-btn { padding: 6px 14px; background: #0a0a0a; border: 1px solid #333; border-radius: 15px; color: #888; cursor: pointer; font-size: 0.8rem; }
        .ex-btn:hover { border-color: #667eea; color: #fff; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔄 Upside Down Text Generator</h1>
        <p class="subtitle">Flip your text upside down. Perfect for social media fun and creative posts.</p>

        <div class="card">
            <label>Type or paste your text:</label>
            <textarea id="input" placeholder="Type something here..." oninput="flip()"></textarea>

            <button class="btn" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="output-box" id="output">Your flipped text will appear here...</div>
            <p class="copy-msg" id="copyMsg"></p>

            <div class="examples">
                <button class="ex-btn" onclick="example('Hello World')">Hello World</button>
                <button class="ex-btn" onclick="example('ToolGen')">ToolGen</button>
                <button class="ex-btn" onclick="example('AI Tools')">AI Tools</button>
                <button class="ex-btn" onclick="example('Make It Upside Down')">Make It Upside Down</button>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/upside-down-text.html">Upside Down Text</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const flipMap = {
            'a': 'ɐ', 'b': 'q', 'c': 'ɔ', 'd': 'p', 'e': 'ǝ', 'f': 'ɟ', 'g': 'ƃ', 'h': 'ɥ',
            'i': 'ᴉ', 'j': 'ɾ', 'k': 'ʞ', 'l': 'l', 'm': 'ɯ', 'n': 'u', 'o': 'o', 'p': 'd',
            'q': 'b', 'r': 'ɹ', 's': 's', 't': 'ʇ', 'u': 'n', 'v': 'ʌ', 'w': 'ʍ', 'x': 'x',
            'y': 'ʎ', 'z': 'z',
            'A': '∀', 'B': 'ᗺ', 'C': 'Ɔ', 'D': 'ᗡ', 'E': 'Ǝ', 'F': 'Ⅎ', 'G': '⅁', 'H': 'H',
            'I': 'I', 'J': 'ſ', 'K': 'ʞ', 'L': '⅂', 'M': 'W', 'N': 'N', 'O': 'O', 'P': 'Ԁ',
            'Q': 'Ό', 'R': 'ᴚ', 'S': 'S', 'T': '⊥', 'U': '∩', 'V': 'Λ', 'W': 'M', 'X': 'X',
            'Y': '⅄', 'Z': 'Z',
            '1': 'Ɩ', '2': 'ᄅ', '3': 'Ɛ', '4': 'ㄣ', '5': 'ϛ', '6': '9', '7': 'ㄥ', '8': '8', '9': '6', '0': '0',
            '!': '¡', '?': '¿', '.': '˙', ',': "'", '\'': ',', '"': ',,', '(': ')', ')': '(',
            '[': ']', ']': '[', '{': '}', '}': '{', '<': '>', '>': '<', '&': '⅋', '_': '‾',
            ';': '؛', '=': '=', '+': '⊕', '-': '⁒', '*': '✱', '/': '/', '\\': '\\',
            ' ': ' '
        };

        function flipText(text) {
            return text.split('').reverse().map(c => flipMap[c] || c).join('');
        }

        function flip() {
            const text = document.getElementById('input').value;
            document.getElementById('output').textContent = text ? flipText(text) : 'Your flipped text will appear here...';
        }

        function copy() {
            const text = document.getElementById('output').textContent;
            if (text && text !== 'Your flipped text will appear here...') {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        function example(text) {
            document.getElementById('input').value = text;
            flip();
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = 'Your flipped text will appear here...';
            document.getElementById('copyMsg').textContent = '';
        }
    </script>
</body>
</html>
