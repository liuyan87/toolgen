<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Credit Card Validator - ToolGen</title>
    <meta name="description" content="Validate credit card numbers instantly. Check card type (Visa, Mastercard, Amex). Free online credit card validator.">
    <meta name="keywords" content="credit card validator, validate credit card, check credit card, card number validator, luhn check, credit card checker">
    <link rel="canonical" href="https://toolgen.xyz/tools/credit-card-validator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1.5rem; font-family: monospace; letter-spacing: 2px; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 25px; text-align: center; margin-top: 20px; }
        .result-box .icon { font-size: 3rem; margin-bottom: 10px; }
        .result-box .status { font-size: 1.3rem; font-weight: 700; }
        .result-box.valid { border: 2px solid #22c55e; }
        .result-box.valid .status { color: #22c55e; }
        .result-box.invalid { border: 2px solid #ef4444; }
        .result-box.invalid .status { color: #ef4444; }
        .card-type { margin-top: 15px; color: #888; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>💳 Credit Card Validator</h1>
        <p class="subtitle">Validate credit card numbers using the Luhn algorithm.</p>

        <div class="card">
            <label>Enter card number:</label>
            <input type="text" id="cardNumber" placeholder="4111 1111 1111 1111" maxlength="19" oninput="validate()">

            <button class="btn" onclick="validate()">Validate</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="result-box" id="result" style="display:none;">
                <div class="icon" id="resultIcon"></div>
                <div class="status" id="resultStatus"></div>
                <div class="card-type" id="resultType"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/credit-card-validator.html">Credit Card Validator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function getCardType(num) {
            const clean = num.replace(/\s/g, '');
            if (/^4/.test(clean)) return 'Visa';
            if (/^5[1-5]/.test(clean)) return 'Mastercard';
            if (/^3[47]/.test(clean)) return 'American Express';
            if (/^6(?:011|5)/.test(clean)) return 'Discover';
            if (/^35/.test(clean)) return 'JCB';
            if (/^30[0-5]/.test(clean)) return 'Diners Club';
            return 'Unknown';
        }

        function luhnCheck(num) {
            const clean = num.replace(/\s/g, '');
            let sum = 0;
            let isEven = false;
            for (let i = clean.length - 1; i >= 0; i--) {
                let digit = parseInt(clean[i]);
                if (isEven) {
                    digit *= 2;
                    if (digit > 9) digit -= 9;
                }
                sum += digit;
                isEven = !isEven;
            }
            return sum % 10 === 0;
        }

        function validate() {
            const num = document.getElementById('cardNumber').value;
            const resultBox = document.getElementById('result');

            if (!num.trim()) {
                resultBox.style.display = 'none';
                return;
            }

            const clean = num.replace(/\s/g, '');
            if (!/^\d{13,19}$/.test(clean)) {
                showResult(false, 'Invalid Format', 'Unknown');
                return;
            }

            const valid = luhnCheck(clean);
            const type = getCardType(clean);
            showResult(valid, valid ? 'Valid Card' : 'Invalid Card', type);
        }

        function showResult(valid, status, type) {
            const resultBox = document.getElementById('result');
            resultBox.className = 'result-box ' + (valid ? 'valid' : 'invalid');
            resultBox.style.display = 'block';
            document.getElementById('resultIcon').textContent = valid ? '✓' : '✗';
            document.getElementById('resultStatus').textContent = status;
            document.getElementById('resultType').textContent = 'Card Type: ' + type;
        }

        function clearText() {
            document.getElementById('cardNumber').value = '';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
