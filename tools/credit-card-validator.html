<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Credit Card Validator - ToolGen</title><meta name="description" content="Validate credit card numbers using the Luhn algorithm. Check if a card number is valid."><meta name="keywords" content="credit card validator, card number validator, luhn algorithm, validate credit card"><link rel="canonical" href="https://toolgen.xyz/tools/credit-card-validator.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:500px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px;text-align:center}input{width:100%;padding:16px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:1.3rem;text-align:center;letter-spacing:2px;outline:none;margin-bottom:20px}input:focus{border-color:#667eea}.result{font-size:2rem;font-weight:800;padding:20px;border-radius:12px;margin:15px 0}.valid{background:rgba(74,222,128,0.2);color:#4ade80;border:2px solid #4ade80}.invalid{background:rgba(239,68,68,0.2);color:#ef4444;border:2px solid #ef4444}.card-type{font-size:1.2rem;color:#888;margin:10px 0}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>💳 Credit Card Validator</h1><p class="subtitle">Validate credit card numbers using the Luhn algorithm.</p><div class="card"><input type="text" id="card" placeholder="4111 1111 1111 1111" maxlength="19" oninput="validate()"><div id="result"></div><div class="card-type" id="type"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function getCardType(num){const n=num.replace(/\s/g,'');if(/^4/.test(n))return'Visa';if(/^5[1-5]/.test(n))return'Mastercard';if(/^3[47]/.test(n))return'Amex';if(/^6(?:011|5)/.test(n))return'Discover';if(/^35/.test(n))return'JCB';return'Unknown';}function luhn(num){const n=num.replace(/\s/g,'');let sum=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=parseInt(n[i]);if(alt){d*=2;if(d>9)d-=9;}sum+=d;alt=!alt;}return sum%10===0;}function validate(){const num=document.getElementById('card').value;const result=document.getElementById('result');const type=document.getElementById('type');if(!num.trim()){result.textContent='';result.className='';type.textContent='';return;}const cleanNum=num.replace(/\s/g,'');const cardType=getCardType(cleanNum);type.textContent=cardType;if(luhn(cleanNum)){result.textContent='✅ Valid';result.className='result valid';}else{result.textContent='❌ Invalid';result.className='result invalid';}}</script></body></html>
