<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Password Strength Checker - ToolGen</title>
    <meta name="description" content="Check password strength instantly. Test if your password is weak, medium, or strong. Free online password strength checker.">
    <meta name="keywords" content="password strength checker, password test, password strength meter, check password strength, strong password generator">
    <link rel="canonical" href="https://toolgen.xyz/tools/password-strength-checker.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .input-wrap { position: relative; }
        input { width: 100%; padding: 14px; padding-right: 50px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1.1rem; outline: none; margin-bottom: 15px; font-family: monospace; }
        input:focus { border-color: #667eea; }
        .toggle-btn { position: absolute; right: 15px; top: 12px; background: none; border: none; color: #888; cursor: pointer; font-size: 1.2rem; }
        .strength-bar { height: 8px; border-radius: 4px; background: #333; margin-top: 10px; overflow: hidden; }
        .strength-fill { height: 100%; border-radius: 4px; transition: width 0.3s, background 0.3s; }
        .strength-text { margin-top: 10px; font-weight: 700; font-size: 1.1rem; }
        .checks { margin-top: 20px; }
        .check-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: #888; }
        .check-item.done { color: #22c55e; }
        .check-item.fail { color: #ef4444; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔐 Password Strength Checker</h1>
        <p class="subtitle">Test your password strength and see improvement tips.</p>

        <div class="card">
            <label>Enter your password:</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Type a password..." oninput="check()">
                <button class="toggle-btn" onclick="toggle()">👁</button>
            </div>

            <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%"></div></div>
            <div class="strength-text" id="strengthText"></div>

            <div class="checks" id="checks">
                <div class="check-item" id="c-length">✗ At least 8 characters</div>
                <div class="check-item" id="c-upper">✗ Contains uppercase letter</div>
                <div class="check-item" id="c-lower">✗ Contains lowercase letter</div>
                <div class="check-item" id="c-number">✗ Contains number</div>
                <div class="check-item" id="c-special">✗ Contains special character</div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/password-strength-checker.html">Password Strength</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function toggle() {
            const inp = document.getElementById('password');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        function check() {
            const p = document.getElementById('password').value;
            const checks = {
                'c-length': p.length >= 8,
                'c-upper': /[A-Z]/.test(p),
                'c-lower': /[a-z]/.test(p),
                'c-number': /[0-9]/.test(p),
                'c-special': /[^A-Za-z0-9]/.test(p)
            };

            let score = Object.values(checks).filter(Boolean).length;
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            const colors = ['#ef4444', '#f59e0b', '#22c55e'];
            const labels = ['Weak', 'Medium', 'Strong'];
            const widths = ['25%', '60%', '100%'];

            fill.style.width = widths[Math.min(score - 1, 2)];
            fill.style.background = colors[Math.min(score - 1, 2)];
            text.textContent = p.length > 0 ? labels[Math.min(score - 1, 2)] : '';
            text.style.color = colors[Math.min(score - 1, 2)];

            Object.entries(checks).forEach(([id, ok]) => {
                const el = document.getElementById(id);
                el.className = 'check-item ' + (ok ? 'done' : 'fail');
                el.textContent = (ok ? '✓' : '✗') + ' ' + el.textContent.substring(2);
            });
        }
    </script>
</body>
</html>
