<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Bold Text Generator - ToolGen</title>
    <meta name="description" content="Generate bold text using Unicode. Transform any text to bold 𝐁𝐨𝐥𝐝 letters for social media bio and posts. Free online bold text generator.">
    <meta name="keywords" content="bold text generator, bold text, unicode bold, bold letters, text generator, 𝐁𝐨𝐥𝐝, 𝗯𝗼𝗹𝗱, social media text">
    <link rel="canonical" href="https://toolgen.xyz/tools/bold-text-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-size: 1.1rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 120px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .output-box { background: #0a0a0a; border-radius: 10px; padding: 20px; margin-top: 15px; font-size: 1.4rem; color: #22c55e; min-height: 80px; word-break: break-all; }
        .copy-msg { color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
        .style-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .style-btn { padding: 8px 16px; background: #0a0a0a; border: 2px solid #333; border-radius: 20px; color: #888; cursor: pointer; font-size: 0.85rem; }
        .style-btn:hover { border-color: #667eea; color: #fff; }
        .style-btn.active { border-color: #667eea; color: #fff; background: rgba(102,126,234,0.1); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>𝐁𝐨𝐥𝐝 Bold Text Generator</h1>
        <p class="subtitle">Transform any text into bold Unicode letters. Perfect for Instagram, Twitter, TikTok bios.</p>

        <div class="card">
            <label>Type your text:</label>
            <textarea id="input" placeholder="Type something here..." oninput="generate()"></textarea>

            <div class="style-btns">
                <button class="style-btn active" onclick="setStyle('bold')">𝐁 Bold</button>
                <button class="style-btn" onclick="setStyle('italic')">𝐼 Italic</button>
                <button class="style-btn" onclick="setStyle('bolditalic')">𝑩 Bold Italic</button>
                <button class="style-btn" onclick="setStyle('monospace')">𝙼𝚖𝚘𝚗𝚘</button>
                <button class="style-btn" onclick="setStyle('sans')">𝗦𝗮𝗻𝘀</button>
                <button class="style-btn" onclick="setStyle('serif')">𝑺𝒆𝒓𝒊𝒇</button>
            </div>

            <div style="margin-top:15px;">
                <button class="btn" onclick="copy()">📋 Copy</button>
                <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>
            </div>

            <div class="output-box" id="output">Your styled text will appear here...</div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/bold-text-generator.html">Bold Text Generator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        let currentStyle = 'bold';

        const styles = {
            bold: { chars: '𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' },
            italic: { chars: '𝘢𝘣𝘤𝘥𝘦𝘧𝘨𝘩𝘪𝘫𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻𝘈𝘉𝘊𝘋𝘌𝘍𝘎𝘏𝘐𝘑𝘒𝘓𝘔𝘕𝘖𝘗𝘘𝘙𝘚𝘛𝘜𝘝𝘞𝘟𝘠𝘡', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' },
            bolditalic: { chars: '𝑎𝑏𝑐𝑑𝑒𝑓𝑔𝘩𝑖𝑗𝘬𝘭𝘮𝘯𝘰𝘱𝘲𝘳𝘴𝘵𝘶𝘷𝘸𝘹𝘺𝘻𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' },
            monospace: { chars: '𝚊𝚋𝚌𝚍𝚎𝚏𝚐𝚑𝚒𝚓𝚔𝚕𝚖𝚗𝚘𝚙𝚚𝚛𝚜𝚝𝚞𝚟𝚠𝚡𝚢𝚣𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' },
            sans: { chars: '𝗮𝗯𝗰𝗱𝗲𝗳𝗴𝗵𝗶𝗷𝗸𝗹𝗺𝗻𝗼𝗽𝗾𝗿𝘀𝘁𝘂𝘃𝘄𝘅𝘆𝘇𝗔𝗕𝗖𝗗𝗘𝗙𝗚𝗛𝗜𝗝𝗞𝗟𝗠𝗡𝗢𝗣𝗤𝗥𝗦𝗧𝗨𝗩𝗪𝗫𝗬𝗭', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' },
            serif: { chars: '𝒂𝒃𝒄𝒅𝒆𝒇𝒈𝒉𝒊𝒋𝒌𝒍𝒎𝒏𝒐𝒑𝒒𝒓𝒔𝒕𝒖𝒗𝒘𝒙𝒚𝒛𝑨𝑩𝑪𝑫𝑬𝑭𝑮𝑯𝑰𝑱𝑲𝑳𝑴𝑵𝑶𝑷𝑸𝑹𝑺𝑻𝑼𝑽𝑾𝑿𝒀𝒁', base: 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ' }
        };

        function setStyle(style) {
            currentStyle = style;
            document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            generate();
        }

        function generate() {
            const text = document.getElementById('input').value;
            if (!text) {
                document.getElementById('output').textContent = 'Your styled text will appear here...';
                return;
            }
            const s = styles[currentStyle];
            const map = {};
            for (let i = 0; i < s.base.length; i++) map[s.base[i]] = s.chars[i];
            document.getElementById('output').textContent = text.split('').map(c => map[c] || c).join('');
        }

        function copy() {
            const text = document.getElementById('output').textContent;
            if (text && text !== 'Your styled text will appear here...') {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = 'Your styled text will appear here...';
        }
    </script>
</body>
</html>
