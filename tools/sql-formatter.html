<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free SQL Formatter - ToolGen</title><meta name="description" content="Format and beautify SQL queries instantly. Supports MySQL, PostgreSQL, SQL Server and more."><meta name="keywords" content="sql formatter, sql beautifier, format sql, sql prettifier"><link rel="canonical" href="https://toolgen.xyz/tools/sql-formatter.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#aaa}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.9rem;outline:none;resize:vertical;min-height:250px}textarea:focus{border-color:#667eea}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🗄️ SQL Formatter</h1><p class="subtitle">Format and beautify SQL queries instantly. Supports all major SQL dialects.</p><div class="card"><textarea id="input" placeholder="SELECT id,name,email FROM users WHERE active=1 ORDER BY created_at DESC LIMIT 10"></textarea><button class="btn" onclick="format()">⚡ Format SQL</button><button class="btn" onclick="minify()">🗜️ Minify</button><button class="btn" onclick="copy()">📋 Copy</button><textarea id="output" readonly style="margin-top:15px"></textarea></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const KW=['SELECT','FROM','WHERE','AND','OR','JOIN','LEFT','RIGHT','INNER','OUTER','ON','ORDER BY','GROUP BY','HAVING','LIMIT','OFFSET','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','TABLE','INDEX','DROP','ALTER','ADD','DISTINCT','AS','ASC','DESC','NULL','NOT','IN','LIKE','BETWEEN','IS','EXISTS','UNION','ALL','COUNT','SUM','AVG','MIN','MAX','UNIQUE','KEY','PRIMARY','FOREIGN','REFERENCES'];function format(){let sql=document.getElementById('input').value.trim();if(!sql)return;KW.forEach(kw=>{const re=new RegExp('\\b('+kw+')\\b','gi');sql=sql.replace(re,'\n'+kw);});sql=sql.replace(/\n+/g,'\n').trim();sql=sql.split('\n').map((line,i)=>i===0?line:'  '+line).join('\n');document.getElementById('output').value=sql;}function minify(){document.getElementById('output').value=document.getElementById('input').value.replace(/\s+/g,' ').trim();}function copy(){navigator.clipboard.writeText(document.getElementById('output').value);}</script></body></html>
