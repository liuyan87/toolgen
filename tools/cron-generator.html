<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Cron Expression Generator - ToolGen</title>
    <meta name="description" content="Generate cron job schedules visually. Build valid cron expressions with an easy point-and-click interface. Free online cron generator.">
    <meta name="keywords" content="cron expression generator, cron job scheduler, cron generator, crontab generator, cron schedule, cron syntax, cron job creator">
    <link rel="canonical" href="https://toolgen.xyz/tools/cron-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        select:focus { border-color: #667eea; }
        .cron-result { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; margin: 20px 0; }
        .cron-expr { font-size: 2rem; font-family: monospace; color: #22c55e; font-weight: 700; }
        .human { color: #888; margin-top: 10px; font-size: 0.9rem; }
        .result-box { background: #0a0a0a; border-radius: 10px; padding: 15px; margin-top: 15px; }
        .result-box .label { color: #888; font-size: 0.8rem; }
        .result-box .value { color: #667eea; font-family: monospace; font-size: 0.9rem; margin-top: 5px; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>⏰ Cron Expression Generator</h1>
        <p class="subtitle">Build cron schedules with an easy visual interface. Get instant cron syntax.</p>

        <div class="card">
            <label>Minute:</label>
            <select id="minute">
                <option value="*">Every minute (*)</option>
                <option value="0">At minute 0</option>
                <option value="15">At minute 15</option>
                <option value="30">At minute 30</option>
                <option value="45">At minute 45</option>
                <option value="0,30">Every 30 minutes (0,30)</option>
            </select>

            <label>Hour:</label>
            <select id="hour">
                <option value="*">Every hour (*)</option>
                <option value="0">Midnight (0)</option>
                <option value="6">6 AM</option>
                <option value="9">9 AM</option>
                <option value="12">Noon (12)</option>
                <option value="18">6 PM</option>
                <option value="0,12">Twice a day (0,12)</option>
            </select>

            <label>Day of Month:</label>
            <select id="dom">
                <option value="*">Every day (*)</option>
                <option value="1">1st of month</option>
                <option value="15">15th of month</option>
            </select>

            <label>Month:</label>
            <select id="month">
                <option value="*">Every month (*)</option>
                <option value="1">January</option>
                <option value="6">June</option>
            </select>

            <label>Day of Week:</label>
            <select id="dow">
                <option value="*">Every day of week (*)</option>
                <option value="1-5">Weekdays (Mon-Fri)</option>
                <option value="0,6">Weekends (Sat-Sun)</option>
                <option value="0">Sunday only</option>
            </select>

            <div class="cron-result">
                <div class="cron-expr" id="cronExpr">* * * * *</div>
                <div class="human" id="humanDesc">Every minute</div>
            </div>

            <div class="result-box">
                <div class="label">Crontab format:</div>
                <div class="value" id="crontab">* * * * *</div>
            </div>

            <button class="btn" onclick="copy()">📋 Copy</button>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/cron-generator.html">Cron Generator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function updateCron() {
            const min = document.getElementById('minute').value;
            const hr = document.getElementById('hour').value;
            const dom = document.getElementById('dom').value;
            const mon = document.getElementById('month').value;
            const dow = document.getElementById('dow').value;
            const expr = `${min} ${hr} ${dom} ${mon} ${dow}`;
            document.getElementById('cronExpr').textContent = expr;
            document.getElementById('crontab').textContent = expr;

            let desc = '';
            if (min === '*' && hr === '*' && dom === '*' && mon === '*' && dow === '*') desc = 'Every minute';
            else if (min === '0' && hr === '0') desc = 'Every day at midnight';
            else if (min === '0' && hr === '12') desc = 'Every day at noon';
            else if (dow === '1-5') desc = 'Every weekday at ' + (hr === '*' ? 'every hour' : hr + ':00');
            else desc = `${min} ${hr} ${dom} ${mon} ${dow}`;
            document.getElementById('humanDesc').textContent = desc;
        }

        ['minute','hour','dom','month','dow'].forEach(id => {
            document.getElementById(id).addEventListener('change', updateCron);
        });

        function copy() {
            const expr = document.getElementById('cronExpr').textContent;
            navigator.clipboard.writeText(expr);
        }

        updateCron();
    </script>
</body>
</html>
