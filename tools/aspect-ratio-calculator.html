<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Aspect Ratio Calculator - ToolGen</title>
    <meta name="description" content="Calculate aspect ratio and resize images proportionally. Find missing dimension. Free online aspect ratio calculator.">
    <meta name="keywords" content="aspect ratio calculator, calculate aspect ratio, resize image aspect ratio, aspect ratio 16:9, proportional resize">
    <link rel="canonical" href="https://toolgen.xyz/tools/aspect-ratio-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .dim-row { display: grid; grid-template-columns: 1fr 1fr 80px; gap: 10px; margin-bottom: 15px; align-items: end; }
        input { padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; width: 100%; text-align: center; }
        input:focus { border-color: #667eea; }
        select { padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; width: 100%; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box .num { font-size: 1.5rem; font-weight: 700; color: #22c55e; }
        .result-box .label { color: #888; font-size: 0.8rem; margin-top: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📐 Aspect Ratio Calculator</h1>
        <p class="subtitle">Calculate missing dimension or find aspect ratio.</p>

        <div class="card">
            <label>Select aspect ratio:</label>
            <select id="ratio" onchange="calculate()">
                <option value="16:9">16:9 (YouTube, HD Video)</option>
                <option value="4:3">4:3 (Traditional TV)</option>
                <option value="1:1">1:1 (Square)</option>
                <option value="21:9">21:9 (Ultrawide)</option>
                <option value="9:16">9:16 (Vertical Video)</option>
                <option value="3:2">3:2 (Photo)</option>
                <option value="custom">Custom</option>
            </select>

            <div class="dim-row" id="customRatio" style="display:none;">
                <input type="number" id="ratioW" placeholder="Width" oninput="calculate()">
                <span style="color:#888; text-align:center;">:</span>
                <input type="number" id="ratioH" placeholder="Height" oninput="calculate()">
            </div>

            <div class="dim-row">
                <div>
                    <label>Width:</label>
                    <input type="number" id="width" placeholder="1920" oninput="calculate()">
                </div>
                <div>
                    <label>Height:</label>
                    <input type="number" id="height" placeholder="1080" oninput="calculate()">
                </div>
                <button class="btn" onclick="swap()">⇄ Swap</button>
            </div>

            <div class="result-grid">
                <div class="result-box"><div class="num" id="aspectRatio">16:9</div><div class="label">Aspect Ratio</div></div>
                <div class="result-box"><div class="num" id="ratioDecimal">1.78</div><div class="label">Ratio (decimal)</div></div>
                <div class="result-box"><div class="num" id="megapixels">2.07 MP</div><div class="label">Megapixels</div></div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/aspect-ratio-calculator.html">Aspect Ratio Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

        function calculate() {
            const custom = document.getElementById('ratio').value;
            let ratioW, ratioH;

            if (custom === 'custom') {
                ratioW = parseInt(document.getElementById('ratioW').value) || 1;
                ratioH = parseInt(document.getElementById('ratioH').value) || 1;
            } else {
                [ratioW, ratioH] = custom.split(':').map(Number);
            }

            const w = parseInt(document.getElementById('width').value) || 0;
            const h = parseInt(document.getElementById('height').value) || 0;

            if (w && h) {
                const divisor = gcd(w, h);
                const arW = w / divisor;
                const arH = h / divisor;
                document.getElementById('aspectRatio').textContent = `${arW}:${arH}`;
                document.getElementById('ratioDecimal').textContent = (w/h).toFixed(2);
                document.getElementById('megapixels').textContent = ((w*h)/1000000).toFixed(2) + ' MP';
            }
        }

        function swap() {
            const w = document.getElementById('width').value;
            const h = document.getElementById('height').value;
            document.getElementById('width').value = h;
            document.getElementById('height').value = w;
            calculate();
        }

        document.getElementById('ratio').addEventListener('change', () => {
            document.getElementById('customRatio').style.display = document.getElementById('ratio').value === 'custom' ? 'grid' : 'none';
            calculate();
        });

        calculate();
    </script>
</body>
</html>
