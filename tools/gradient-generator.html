<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free CSS Gradient Generator - ToolGen</title>
    <meta name="description" content="Create beautiful CSS gradients visually. Linear, radial, and conic gradients. Free online CSS gradient generator with live preview.">
    <meta name="keywords" content="css gradient generator, gradient generator, linear gradient, radial gradient, css gradient, gradient maker">
    <link rel="canonical" href="https://toolgen.xyz/tools/gradient-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .preview { width: 100%; height: 200px; border-radius: 16px; border: 2px solid #333; margin-bottom: 20px; transition: background 0.3s; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .color-row { display: grid; grid-template-columns: 1fr 80px 80px; gap: 10px; margin-bottom: 10px; align-items: center; }
        input[type="color"] { width: 80px; height: 40px; border: none; background: none; cursor: pointer; }
        input[type="number"] { padding: 8px; border-radius: 6px; border: 2px solid #333; background: #0a0a0a; color: #fff; width: 80px; }
        select { padding: 10px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #22c55e; font-family: monospace; font-size: 0.85rem; margin-top: 15px; resize: none; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🌈 CSS Gradient Generator</h1>
        <p class="subtitle">Create beautiful CSS gradients with live preview.</p>

        <div class="preview" id="preview"></div>

        <div class="card">
            <label>Gradient Type:</label>
            <select id="type" onchange="update()">
                <option value="linear">Linear Gradient</option>
                <option value="radial">Radial Gradient</option>
            </select>

            <label>Color 1:</label>
            <div class="color-row">
                <input type="color" id="color1" value="#667eea" onchange="update()">
                <input type="number" id="pos1" value="0" min="0" max="100" onchange="update()">
                <span style="color:#888;">%</span>
            </div>

            <label>Color 2:</label>
            <div class="color-row">
                <input type="color" id="color2" value="#764ba2" onchange="update()">
                <input type="number" id="pos2" value="100" min="0" max="100" onchange="update()">
                <span style="color:#888;">%</span>
            </div>

            <label>Direction (for linear):</label>
            <select id="direction" onchange="update()">
                <option value="to right">Left → Right</option>
                <option value="to left">Right → Left</option>
                <option value="to bottom">Top → Bottom</option>
                <option value="to top">Bottom → Top</option>
                <option value="to bottom right">TopLeft → BottomRight</option>
                <option value="135deg">135 degrees</option>
            </select>

            <button class="btn" onclick="copy()">📋 Copy CSS</button>

            <textarea id="output" rows="3" readonly></textarea>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/gradient-generator.html">CSS Gradient Generator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function update() {
            const type = document.getElementById('type').value;
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;
            const p1 = document.getElementById('pos1').value;
            const p2 = document.getElementById('pos2').value;
            const dir = document.getElementById('direction').value;

            let gradient;
            if (type === 'linear') {
                gradient = `linear-gradient(${dir}, ${c1} ${p1}%, ${c2} ${p2}%)`;
            } else {
                gradient = `radial-gradient(circle, ${c1} ${p1}%, ${c2} ${p2}%)`;
            }

            document.getElementById('preview').style.background = gradient;
            document.getElementById('output').value = `background: ${gradient};`;
        }

        function copy() {
            const text = document.getElementById('output').value;
            if (text) navigator.clipboard.writeText(text);
        }

        update();
    </script>
</body>
</html>
