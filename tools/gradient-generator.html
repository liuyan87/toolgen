<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create beautiful CSS gradients for free. Linear, radial, and conic gradients. Copy CSS code instantly.">
    <meta name="keywords" content="css gradient generator, gradient generator, css gradient, background gradient">
    <link rel="canonical" href="https://toolgen.xyz/tools/gradient-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .preview { height: 200px; border-radius: 12px; margin: 20px 0; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 0.9rem; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .controls label { color: #aaa; font-size: 0.85rem; }
        .controls input[type="color"] { width: 100%; height: 40px; border: none; background: none; cursor: pointer; }
        .controls input[type="text"] { padding: 8px; border-radius: 6px; border: 2px solid #333; background: #0a0a0a; color: #fff; }
        .controls input[type="range"] { width: 100%; }
        .controls div { display: flex; flex-direction: column; gap: 5px; }
        .type-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-tab { padding: 8px 20px; background: #333; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
        .type-tab.active { background: #667eea; }
        .code-box { background: #0a0a0a; border: 2px solid #333; border-radius: 10px; padding: 15px; font-family: monospace; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .code-box code { color: #667eea; word-break: break-all; flex: 1; }
        .btn { display: inline-block; padding: 10px 24px; background: #667eea; color: #fff; border: none; border-radius: 20px; font-size: 0.9rem; cursor: pointer; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
        @media(max-width:600px){ .controls{grid-template-columns:1fr;} }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🌈 CSS Gradient Generator</h1>
        <p class="subtitle">Create beautiful CSS gradients. Copy the code instantly.</p>
        <div class="card">
            <div class="type-tabs">
                <span class="type-tab active" onclick="setType('linear')">Linear</span>
                <span class="type-tab" onclick="setType('radial')">Radial</span>
                <span class="type-tab" onclick="setType('conic')">Conic</span>
            </div>
            <div class="preview" id="preview">Preview</div>
            <div class="controls">
                <div><label>Color 1</label><input type="color" id="c1" value="#667eea" oninput="update()"></div>
                <div><label>Color 2</label><input type="color" id="c2" value="#764ba2" oninput="update()"></div>
                <div><label>Angle</label><input type="range" id="angle" min="0" max="360" value="135" oninput="update()"><span id="angleVal">135°</span></div>
                <div><label>Color Stop %</label><input type="range" id="stop" min="0" max="100" value="50" oninput="update()"><span id="stopVal">50%</span></div>
            </div>
            <div class="code-box">
                <code id="code">background: linear-gradient(135deg, #667eea 50%, #764ba2);</code>
                <button class="btn" onclick="copy()">📋 Copy</button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        let type = 'linear';
        function setType(t) {
            type = t;
            document.querySelectorAll('.type-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            update();
        }
        function update() {
            const c1 = document.getElementById('c1').value;
            const c2 = document.getElementById('c2').value;
            const angle = document.getElementById('angle').value;
            const stop = document.getElementById('stop').value;
            document.getElementById('angleVal').textContent = angle + '°';
            document.getElementById('stopVal').textContent = stop + '%';
            let css = '';
            if (type === 'linear') {
                css = `linear-gradient(${angle}deg, ${c1} ${stop}%, ${c2})`;
            } else if (type === 'radial') {
                css = `radial-gradient(circle, ${c1} ${stop}%, ${c2})`;
            } else {
                css = `conic-gradient(from ${angle}deg, ${c1} ${stop}%, ${c2})`;
            }
            document.getElementById('preview').style.background = css;
            document.getElementById('preview').textContent = '';
            document.getElementById('code').textContent = `background: ${css};`;
        }
        function copy() {
            navigator.clipboard.writeText(`background: ${document.getElementById('code').textContent};`);
            alert('Copied!');
        }
        update();
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
</html>
