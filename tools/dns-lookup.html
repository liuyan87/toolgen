<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free DNS Lookup - ToolGen</title>
    <meta name="description" content="DNS lookup and WHOIS lookup for any domain. Find DNS records and domain information. Free online DNS lookup tool.">
    <meta name="keywords" content="dns lookup, whois lookup, dns records, domain lookup, mx records, a record lookup, nameserver lookup">
    <link rel="canonical" href="https://toolgen.xyz/tools/dns-lookup.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); }
        .result-section { margin-top: 20px; }
        .section-title { color: #667eea; font-weight: 700; margin-bottom: 10px; font-size: 1rem; }
        .records { background: #0a0a0a; border-radius: 10px; padding: 15px; }
        .record { display: flex; gap: 15px; padding: 8px 0; border-bottom: 1px solid #222; font-family: monospace; font-size: 0.9rem; }
        .record:last-child { border-bottom: none; }
        .record .type { color: #667eea; width: 80px; font-weight: 700; }
        .record .value { color: #22c55e; flex: 1; word-break: break-all; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔍 DNS Lookup</h1>
        <p class="subtitle">Look up DNS records for any domain.</p>

        <div class="card">
            <div class="input-row">
                <input type="text" id="domain" placeholder="example.com" value="toolgen.xyz">
                <button class="btn" onclick="lookup()">Lookup</button>
            </div>

            <div id="results"></div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/dns-lookup.html">DNS Lookup</a> - 150+ Free Tools</p>
    </footer>

    <script>
        async function lookup() {
            const domain = document.getElementById('domain').value.trim();
            if (!domain) return;

            const results = document.getElementById('results');
            results.innerHTML = '<p style="color:#888;">Loading...</p>';

            try {
                // Use a public DNS-over-HTTPS API
                const types = ['A', 'AAAA', 'MX', 'NS', 'TXT', 'CNAME'];
                let html = '';

                for (const type of types) {
                    try {
                        const url = `https://dns.google/resolve?name=${domain}&type=${type === 'AAAA' ? '28' : type === 'MX' ? '15' : type === 'NS' ? '2' : type === 'TXT' ? '16' : type === 'CNAME' ? '5' : '1'}`;
                        const res = await fetch(url);
                        const data = await res.json();

                        if (data.Answer && data.Answer.length > 0) {
                            html += `<div class="result-section">
                                <div class="section-title">${type} Records</div>
                                <div class="records">`;
                            data.Answer.forEach(ans => {
                                let value = ans.data;
                                if (type === 'MX') {
                                    const parts = value.split(' ');
                                    value = parts[1] + ' (priority: ' + parts[0] + ')';
                                }
                                html += `<div class="record"><span class="type">${type}</span><span class="value">${value}</span></div>`;
                            });
                            html += '</div></div>';
                        }
                    } catch(e) {}
                }

                results.innerHTML = html || '<p style="color:#888;">No records found</p>';
            } catch(e) {
                results.innerHTML = '<p style="color:#ef4444;">Error looking up domain</p>';
            }
        }

        lookup();
    </script>
</body>
</html>
