<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free DNS Lookup - ToolGen</title><meta name="description" content="Look up DNS records (A, AAAA, MX, TXT, CNAME, NS) for any domain. Free DNS lookup tool."><meta name="keywords" content="dns lookup, dns records, mx records, txt records, ns lookup, dns checker"><link rel="canonical" href="https://toolgen.xyz/tools/dns-lookup.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:700px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}input{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:1.1rem;outline:none;margin-bottom:15px}input:focus{border-color:#667eea}.result-box{background:#0a0a0a;border-radius:8px;padding:15px;margin-top:15px}.record{display:flex;padding:10px 0;border-bottom:1px solid #333;flex-wrap:wrap}.record:last-child{border-bottom:none}.record .type{min-width:80px;font-weight:700;color:#667eea;font-size:0.9rem}.record .value{color:#fff;font-family:monospace;font-size:0.9rem;word-break:break-all}.record .ttl{color:#888;font-size:0.8rem;min-width:80px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🌐 DNS Lookup</h1><p class="subtitle">Look up DNS records for any domain. A, AAAA, MX, TXT, CNAME records.</p><div class="card"><input type="text" id="domain" placeholder="example.com" onkeydown="if(event.key==='Enter')lookup()"><button class="btn" onclick="lookup()">🔍 Lookup</button><div id="result"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>async function lookup(){const domain=document.getElementById('domain').value.trim();if(!domain)return;document.getElementById('result').innerHTML='<div style="color:#888">Looking up DNS records...</div>';try{const r=await fetch(`https://dns.google/resolve?name=${domain}&type=A`);const d=await r.json();let html='';if(d.Answer){html='<div style="color:#667eea;margin-bottom:10px;font-weight:700">A Records (IPv4)</div>';d.Answer.filter(a=>a.type===1).forEach(a=>{html+=`<div class="record"><span class="type">A</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});d.Answer.filter(a=>a.type===28).forEach(a=>{html+=`<div class="record"><span class="type">AAAA</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});d.Answer.filter(a=>a.type===5).forEach(a=>{html+=`<div class="record"><span class="type">CNAME</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});d.Answer.filter(a=>a.type===15).forEach(a=>{html+=`<div class="record"><span class="type">MX</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});d.Answer.filter(a=>a.type===16).forEach(a=>{html+=`<div class="record"><span class="type">TXT</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});d.Answer.filter(a=>a.type===2).forEach(a=>{html+=`<div class="record"><span class="type">NS</span><span class="value">${a.data}</span><span class="ttl">TTL: ${a.TTL}s</span></div>`;});}else{html='<div style="color:#888">No DNS records found or NXDOMAIN</div>';}document.getElementById('result').innerHTML=`<div class="result-box">${html}</div>`;}catch(e){document.getElementById('result').innerHTML=`<div class="result-box" style="color:#ef4444">Error: ${e.message}</div>`;}}</script></body></html>
