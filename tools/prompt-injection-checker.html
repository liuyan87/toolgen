end to be|you now behave/i,type:'high',label:'Role Play / Persona Override',desc:'Attempts to assign a new persona'},{pattern:/new (system|master|hidden) prompt|override (system|your) (instruction|config)/gi,type:'critical',label:'System Prompt Override',desc:'Attempts to inject a new system prompt'},{pattern:/\{.*(system|instruction|prompt).*\}|\[SYSTEM\]|&lt;system&gt;|\[INST\]|&lt;!--.*system/gi,type:'high',label:'Markup Injection',desc:'Attempts to inject via markup or comments'},{pattern:/\\n\\[SYSTEM\\]|\\[SYS\\]|\\[ADMIN\\]|\\[PRIVATE\\]/gi,type:'high',label:'Bracketed Instruction Injection',desc:'Hidden instructions in brackets'},{pattern:/reveal (your|the) (system|original|true) (prompt|instructions?|context)/gi,type:'high',label:'Prompt Elicitation',desc:'Attempting to extract system prompt'},{pattern:/how (do|can) (you|i) (bypass|circumvent|disable|remove) (your|the) (safety|filter|restriction|rule)/gi,type:'high',label:'Safety Bypass Inquiry',desc:'Asking how to bypass safety measures'},{pattern:/disregard (your|the) (previous|above|earlier) (response|answer|output|instruction)/gi,type:'medium',label:'Response Override',desc:'Attempting to override previous responses'},{pattern:/you are (a|an) (helpful|harmless|safe|ethical) (assistant|AI|Bot)/gi,type:'medium',label:'Identity Anchoring Attempt',desc:'Attempts to reinforce or change identity'},];function check(){const text=document.getElementById('prompt').value;const result=document.getElementById('result');if(!text.trim()){result.style.display='none';return;}result.style.display='block';const found=patterns.filter(p=>p.pattern.test(text));const issuesEl=document.getElementById('issues');const icon=document.getElementById('icon');const title=document.getElementById('title');const mitigations=document.getElementById('mitigations');if(found.length===0){icon.textContent='✅';title.textContent='No Injection Patterns Detected';title.className='result-title safe';issuesEl.innerHTML='<li>No known prompt injection patterns found in this text.</li>';mitigations.style.display='none';}else{const maxSeverity=found.reduce((a,b)=>{const order={'critical':3,'high':2,'medium':1,'low':0};return order[a.type]>order[b.type]?a:b;});if(maxSeverity.type==='critical'){icon.textContent='🚨';title.textContent='Critical Injection Risk!';title.className='result-title danger';}else if(maxSeverity.type==='high'){icon.textContent='⚠️';title.textContent='High Injection Risk';title.className='result-title warning';}else{icon.textContent='🟡';title.textContent='Medium Injection Risk';title.className='result-title warning';}issuesEl.innerHTML=found.map(f=>`<li><span class="type ${f.type}">${f.type.toUpperCase()}</span> <strong>${f.label}</strong><br><span style="color:#888;font-size:0.8rem">${f.desc}</span></li>`).join('');mitigations.style.display='block';mitigations.querySelector('ul').innerHTML='<li>Use input validation and sanitization before processing user input</li><li>Implement instruction boundaries — separate system prompts from user input</li><li>Use XML or JSON structure to distinguish roles (e.g., &lt;user&gt; vs &lt;system&gt;)</li><li>Add a validation layer that checks user input for known injection patterns</li><li>Consider using a "sandwich" pattern: system prompt → user input → system prompt</li><li>Log and monitor injection attempts for pattern analysis</li>'.split('</li>').filter(s=>s.trim()).map(s=>'<li>'+s.trim()+'</li>').join('');}}}check();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
