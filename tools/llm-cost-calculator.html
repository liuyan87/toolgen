<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free LLM Cost Calculator - ToolGen</title>
    <meta name="description" content="Calculate LLM API costs for GPT-4o, Claude, Gemini, DeepSeek. Compare OpenAI, Anthropic, Google pricing. Save up to 80% on AI costs.">
    <meta name="keywords" content="llm cost calculator, openai pricing, claude pricing, gemini cost, deepseek pricing, ai api cost, gpt-4o cost, token cost">
    <link rel="canonical" href="https://toolgen.xyz/tools/llm-cost-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 15px; }
        input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box .model { color: #888; font-size: 0.85rem; margin-bottom: 8px; }
        .result-box .price { font-size: 1.8rem; font-weight: 800; color: #22c55e; }
        .result-box .label { color: #666; font-size: 0.8rem; margin-top: 5px; }
        .result-box.highlight { border: 2px solid #667eea; }
        .result-box.highlight .price { color: #667eea; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>💰 LLM Cost Calculator</h1>
        <p class="subtitle">Compare AI model costs. Find the cheapest option for your use case. Save up to 80%.</p>

        <div class="card">
            <label>Input tokens (prompt):</label>
            <input type="number" id="inputTokens" value="1000" min="1" oninput="calculate()">

            <label>Output tokens (completion):</label>
            <input type="number" id="outputTokens" value="500" min="1" oninput="calculate()">
        </div>

        <div class="result-grid" id="results">
            <!-- Populated by JS -->
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/llm-cost-calculator.html">LLM Cost Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const models = [
            { name: 'GPT-4o', provider: 'OpenAI', input: 2.50, output: 10.00, unit: '1M tokens' },
            { name: 'GPT-4o Mini', provider: 'OpenAI', input: 0.15, output: 0.60, unit: '1M tokens' },
            { name: 'GPT-4 Turbo', provider: 'OpenAI', input: 10.00, output: 30.00, unit: '1M tokens' },
            { name: 'Claude 3.5 Sonnet', provider: 'Anthropic', input: 3.00, output: 15.00, unit: '1M tokens' },
            { name: 'Claude 3 Opus', provider: 'Anthropic', input: 15.00, output: 75.00, unit: '1M tokens' },
            { name: 'Claude 3 Haiku', provider: 'Anthropic', input: 0.25, output: 1.25, unit: '1M tokens' },
            { name: 'Gemini 1.5 Pro', provider: 'Google', input: 1.25, output: 5.00, unit: '1M tokens' },
            { name: 'Gemini 1.5 Flash', provider: 'Google', input: 0.00, output: 0.35, unit: '1M tokens' },
            { name: 'DeepSeek V2', provider: 'DeepSeek', input: 0.14, output: 0.28, unit: '1M tokens' },
            { name: 'Llama 3 70B', provider: 'Meta', input: 0.65, output: 2.75, unit: '1M tokens' },
        ];

        function calculate() {
            const input = parseInt(document.getElementById('inputTokens').value) || 0;
            const output = parseInt(document.getElementById('outputTokens').value) || 0;

            const sorted = [...models].sort((a, b) => {
                const costA = (input * a.input + output * a.output) / 1e6;
                const costB = (input * b.input + output * b.output) / 1e6;
                return costA - costB;
            });

            document.getElementById('results').innerHTML = sorted.map((m, i) => {
                const cost = (input * m.input + output * m.output) / 1e6;
                return `<div class="result-box ${i === 0 ? 'highlight' : ''}">
                    <div class="model">${m.provider} ${m.name}</div>
                    <div class="price">$${cost.toFixed(4)}</div>
                    <div class="label">${m.unit} | Input: $${m.input}/M | Output: $${m.output}/M</div>
                </div>`;
            }).join('');
        }

        calculate();
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
