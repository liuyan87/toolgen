<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Percentage Change Calculator - ToolGen</title>
    <meta name="description" content="Calculate percentage increase or decrease between two numbers. Free online percentage change calculator.">
    <meta name="keywords" content="percentage change calculator, percent change, percentage increase, percentage decrease, how to calculate percentage change">
    <link rel="canonical" href="https://toolgen.xyz/tools/percentage-change.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1.2rem; text-align: center; outline: none; margin-bottom: 15px; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 30px; text-align: center; margin-top: 20px; }
        .result-box .num { font-size: 3rem; font-weight: 800; }
        .result-box .label { color: #888; margin-top: 10px; }
        .result-box.increase .num { color: #22c55e; }
        .result-box.decrease .num { color: #ef4444; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📈 Percentage Change Calculator</h1>
        <p class="subtitle">Calculate percentage increase or decrease between two values.</p>

        <div class="card">
            <label>Original Value:</label>
            <input type="number" id="original" placeholder="100" value="100">

            <label>New Value:</label>
            <input type="number" id="new" placeholder="150" value="150">

            <button class="btn" onclick="calculate()">Calculate</button>

            <div class="result-box" id="result">
                <div class="num" id="pctChange">+50%</div>
                <div class="label" id="changeLabel">increase</div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/percentage-change.html">Percentage Change</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function calculate() {
            const original = parseFloat(document.getElementById('original').value) || 0;
            const newVal = parseFloat(document.getElementById('new').value) || 0;

            if (original === 0) {
                alert('Original value cannot be zero');
                return;
            }

            const change = ((newVal - original) / original) * 100;
            const isIncrease = change >= 0;
            const absChange = Math.abs(change);

            const result = document.getElementById('result');
            result.className = 'result-box ' + (isIncrease ? 'increase' : 'decrease');
            document.getElementById('pctChange').textContent = (isIncrease ? '+' : '') + change.toFixed(2) + '%';
            document.getElementById('changeLabel').textContent = isIncrease ? 'increase' : 'decrease';
        }

        calculate();
    </script>
</body>
</html>
