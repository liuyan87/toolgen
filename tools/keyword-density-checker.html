<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Keyword Density Checker - ToolGen</title><meta name="description" content="Check keyword density in your text or article. Free SEO tool for content optimization."><meta name="keywords" content="keyword density, keyword density checker, seo tool, keyword analysis, keyword count"><link rel="canonical" href="https://toolgen.xyz/tools/keyword-density-checker.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.9rem;outline:none;resize:vertical;min-height:200px}textarea:focus{border-color:#667eea}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:15px 0}.stat{background:#0a0a0a;border-radius:8px;padding:15px;text-align:center}.stat .num{font-size:1.8rem;font-weight:700;color:#667eea}.stat .label{color:#888;font-size:0.85rem;margin-top:5px}.keyword-list{background:#0a0a0a;border-radius:8px;padding:15px;margin-top:15px;max-height:300px;overflow:auto}.keyword-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #333;align-items:center}.keyword-row:last-child{border-bottom:none}.keyword-name{color:#fff;font-family:monospace}.keyword-bar{flex:1;height:6px;background:#333;border-radius:3px;margin:0 15px;overflow:hidden}.keyword-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:3px}.keyword-pct{color:#667eea;font-weight:700;min-width:50px;text-align:right}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔍 Keyword Density Checker</h1><p class="subtitle">Analyze keyword frequency and density in your content. Free SEO tool.</p><div class="card"><textarea id="input" placeholder="Paste your article or text here..."></textarea><div class="stats"><div class="stat"><div class="num" id="wordCount">0</div><div class="label">Words</div></div><div class="stat"><div class="num" id="uniqueWords">0</div><div class="label">Unique Words</div></div><div class="stat"><div class="num" id="charCount">0</div><div class="label">Characters</div></div><div class="stat"><div class="num" id="sentenceCount">0</div><div class="label">Sentences</div></div></div><button class="btn" onclick="analyze()">⚡ Analyze Keywords</button><div class="keyword-list" id="keywordList"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function analyze(){const text=document.getElementById('input').value;const words=text.toLowerCase().match(/\b[a-z]{2,}\b/g)||[];const total=words.length;document.getElementById('wordCount').textContent=total;document.getElementById('uniqueWords').textContent=new Set(words).size;document.getElementById('charCount').textContent=text.replace(/\s/g,'').length;document.getElementById('sentenceCount').textContent=(text.match(/[.!?]+/g)||[]).length;const freq={};words.forEach(w=>freq[w]=(freq[w]||0)+1);const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,20);const maxFreq=sorted[0]?sorted[0][1]:1;const container=document.getElementById('keywordList');container.innerHTML=sorted.map(([word,count])=>{const pct=((count/total)*100).toFixed(1);return`<div class="keyword-row"><span class="keyword-name">${word}</span><div class="keyword-bar"><div class="keyword-fill" style="width:${(count/maxFreq)*100}%"></div></div><span class="keyword-pct">${pct}% (${count})</span></div>`;}).join('');}</script></body></html>
