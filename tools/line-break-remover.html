<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Line Break Remover - ToolGen</title>
    <meta name="description" content="Remove line breaks from text instantly. Convert multi-line text to single line. Free online line break remover tool.">
    <meta name="keywords" content="remove line breaks, line break remover, convert to single line, join lines, text joiner">
    <link rel="canonical" href="https://toolgen.xyz/tools/line-break-remover.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #22c55e; font-family: monospace; font-size: 0.9rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 200px; }
        textarea:focus { border-color: #667eea; }
        .options { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .opt-btn { padding: 8px 16px; background: #0a0a0a; border: 2px solid #333; border-radius: 20px; color: #888; cursor: pointer; font-size: 0.85rem; }
        .opt-btn:hover { border-color: #667eea; color: #fff; }
        .opt-btn.active { border-color: #667eea; color: #fff; background: rgba(102,126,234,0.15); }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔗 Line Break Remover</h1>
        <p class="subtitle">Remove or replace line breaks. Join multiple lines into one.</p>

        <div class="card">
            <label>Paste your text:</label>
            <textarea id="input" placeholder="Paste text with line breaks..."></textarea>

            <div class="options">
                <button class="opt-btn active" onclick="setSep(' ')">Join with Space</button>
                <button class="opt-btn" onclick="setSep(', ')">Join with Comma</button>
                <button class="opt-btn" onclick="setSep('')">No Separator</button>
                <button class="opt-btn" onclick="setSep('\n')">Keep Line Breaks</button>
            </div>

            <button class="btn" onclick="process()">Remove Line Breaks</button>
            <button class="btn" style="background:#333;" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/line-break-remover.html">Line Break Remover</a> - 150+ Free Tools</p>
    </footer>

    <script>
        let sep = ' ';

        function setSep(s) {
            sep = s;
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function process() {
            const text = document.getElementById('input').value;
            const result = text.split(/\r?\n/).join(sep);
            document.getElementById('input').value = result;
        }

        function copy() {
            const text = document.getElementById('input').value;
            if (text) navigator.clipboard.writeText(text);
        }

        function clearText() {
            document.getElementById('input').value = '';
        }
    </script>
</body>
</html>
