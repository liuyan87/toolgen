<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Invisible Character Embedder - ToolGen</title>
    <meta name="description" content="Embed invisible zero-width characters in text. Detect and remove zero-width characters. Free online invisible character tool.">
    <meta name="keywords" content="invisible character, zero width character, zero width space, detect invisible characters, hidden character remover">
    <link rel="canonical" href="https://toolgen.xyz/tools/invisible-character.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #22c55e; font-family: monospace; font-size: 0.9rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 150px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>👻 Invisible Character Embedder</h1>
        <p class="subtitle">Embed zero-width characters in text for unique formatting.</p>

        <div class="card">
            <label>Enter text:</label>
            <textarea id="input" placeholder="Type something..." oninput="embed()"></textarea>

            <button class="btn" onclick="embed()">Embed Zero-Width Space</button>
            <button class="btn" onclick="embedZWJ()">Embed Zero-Width Joiner</button>
            <button class="btn" onclick="detect()">Detect Hidden Characters</button>
            <button class="btn" style="background:#333;" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <textarea id="output" placeholder="Result will appear here..." readonly></textarea>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/invisible-character.html">Invisible Character</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const ZWSP = '\u200B';      // Zero-width space
        const ZWJ = '\u200D';      // Zero-width joiner
        const LRM = '\u200E';      // Left-to-right mark
        const RLM = '\u200F';      // Right-to-left mark

        function embed() {
            const text = document.getElementById('input').value;
            const embedded = text.split('').join(ZWSP);
            document.getElementById('output').value = embedded;
        }

        function embedZWJ() {
            const text = document.getElementById('input').value;
            const embedded = text.split('').join(ZWJ);
            document.getElementById('output').value = embedded;
        }

        function detect() {
            const text = document.getElementById('input').value;
            const invisible = [];
            for (let i = 0; i < text.length; i++) {
                const c = text.charCodeAt(i);
                if ([8203, 8204, 8205, 8206, 8207, 8234, 8235, 8288, 8289, 8290].includes(c)) {
                    invisible.push({char: text[i], pos: i, name: ['ZWSP','ZWJ','LRM','RLM','LRE','RLE','PDF','LRO','RLO','NADS','NODS'][([8203,8204,8205,8206,8207,8234,8235,8288,8289,8290].indexOf(c))]});
                }
            }
            if (invisible.length > 0) {
                document.getElementById('output').value = `Found ${invisible.length} invisible character(s):\n` +
                    invisible.map(i => `Position ${i.pos}: ${i.name} (U+${i.char.charCodeAt(0).toString(16).toUpperCase()})`).join('\n');
            } else {
                document.getElementById('output').value = 'No invisible characters detected.';
            }
        }

        function copy() {
            const text = document.getElementById('output').value;
            if (text) navigator.clipboard.writeText(text);
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
        }
    </script>
</body>
</html>
