<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Lorem Ipsum Generator - ToolGen</title>
    <meta name="description" content="Generate Lorem Ipsum placeholder text instantly. Customizable paragraphs, sentences, and word count. Free online Lorem Ipsum generator.">
    <meta name="keywords" content="lorem ipsum generator, lorem ipsum, placeholder text, dummy text, lorem ipsum generator sentences, lorem ipsum paragraphs">
    <link rel="canonical" href="https://toolgen.xyz/tools/lorem-ipsum-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.8; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .controls { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: end; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { color: #888; font-size: 0.8rem; }
        input, select { padding: 10px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; }
        .btn { display: inline-block; padding: 10px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); }
        .output-box { background: #0a0a0a; border-radius: 10px; padding: 20px; margin-top: 15px; color: #aaa; font-size: 0.95rem; line-height: 1.8; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
        .copy-msg { color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📜 Lorem Ipsum Generator</h1>
        <p class="subtitle">Generate placeholder Lorem Ipsum text for designs, mockups, and layouts.</p>

        <div class="card">
            <div class="controls">
                <div class="control-group">
                    <label>Type</label>
                    <select id="type">
                        <option value="paras">Paragraphs</option>
                        <option value="sentences">Sentences</option>
                        <option value="words">Words</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Count</label>
                    <input type="number" id="count" value="5" min="1" max="50">
                </div>
                <button class="btn" onclick="generate()">🎲 Generate</button>
                <button class="btn" onclick="copyText()">📋 Copy</button>
            </div>

            <div class="output-box" id="output"></div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/lorem-ipsum-generator.html">Lorem Ipsum Generator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const lorem = [
            'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.',
            'Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.',
            'Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.',
            'Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.',
            'Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam.',
            'Eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo.',
            'Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos.',
            'Qui ratione voluptatem sequi nesciunt, neque porro quisquam est, qui dolorem ipsum quia dolor sit amet.',
            'At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti.',
            'Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates.'
        ];

        function generate() {
            const type = document.getElementById('type').value;
            const count = parseInt(document.getElementById('count').value) || 5;
            const output = document.getElementById('output');

            if (type === 'paras') {
                const paras = [];
                for (let i = 0; i < count; i++) paras.push(lorem[i % lorem.length]);
                output.textContent = paras.join('\n\n');
            } else if (type === 'sentences') {
                const sentences = [];
                for (let i = 0; i < count; i++) sentences.push(lorem[i % lorem.length].split('.')[0] + '.');
                output.textContent = sentences.join(' ');
            } else {
                const words = [];
                lorem.forEach(p => p.split(' ').forEach(w => words.push(w)));
                output.textContent = words.slice(0, count).join(' ');
            }
        }

        function copyText() {
            const text = document.getElementById('output').textContent;
            if (text) {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        generate();
    </script>
</body>
</html>
