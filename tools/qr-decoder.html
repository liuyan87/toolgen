<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Decoder - ToolGen</title>
    <meta name="description" content="Decode QR codes from images instantly. Read any QR code online for free.">
    <link rel="canonical" href="https://toolgen.xyz/tools/qr-decoder.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .drop-zone { border: 2px dashed #667eea; border-radius: 16px; padding: 60px 20px; cursor: pointer; transition: all 0.3s; }
        .drop-zone:hover { background: rgba(102,126,234,0.1); }
        input[type="file"] { display: none; }
        .result-box { background: #0a0a0a; border: 2px solid #4ade80; border-radius: 12px; padding: 20px; margin-top: 20px; word-break: break-all; text-align: left; color: #4ade80; font-family: monospace; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>📷 QR Code Decoder</h1>
        <p class="subtitle">Decode QR codes from images instantly. Upload or drag & drop.</p>
        <div class="card">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem;">📷</div>
                <p style="color: #888; margin-top: 15px;">Click or drag QR code image here</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="decodeQR(this.files[0])">
            <div class="result-box" id="result" style="display: none;"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        function decodeQR(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas') || document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, canvas.width, canvas.height);
                    const result = document.getElementById('result');
                    if (code) {
                        result.style.display = 'block';
                        result.textContent = code.data;
                    } else {
                        result.style.display = 'block';
                        result.style.borderColor = '#ef4444';
                        result.style.color = '#ef4444';
                        result.textContent = '❌ No QR code found in this image';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
</html>
