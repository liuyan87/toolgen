<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Regex Tester - ToolGen</title>
    <meta name="description" content="Test and debug regular expressions online. Supports JavaScript. Instant matches, real-time highlighting, free no registration.">
    <meta name="keywords" content="regex tester, regular expression, online regex, regex validator">
    <link rel="canonical" href="https://toolgen.xyz/tools/regex-tester.html">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:900px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:40px}
        .back{color:#667eea;text-decoration:none;font-size:0.9rem}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .desc{color:#888}
        .box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:20px}
        label{display:block;color:#888;font-size:0.85rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
        textarea,input{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-family:'Courier New',monospace;font-size:1rem;padding:12px;resize:vertical}
        input{font-size:1.1rem}
        .btn{display:inline-block;padding:12px 30px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:1rem}
        .btn:hover{transform:scale(1.03)}
        .flags{display:flex;gap:15px;margin-top:10px;flex-wrap:wrap}
        .flag-label{display:flex;align-items:center;gap:6px;color:#888;font-size:0.9rem;cursor:pointer}
        #result{background:#111;border-radius:8px;padding:15px;min-height:80px;font-family:'Courier New',monospace;font-size:0.9rem;white-space:pre-wrap;color:#4ade80}
        .match{background:rgba(102,126,234,0.3);border-radius:3px}
        .no-match{color:#ef4444}
        .match-count{color:#667eea;margin-top:8px;font-size:0.85rem}
        .error{color:#ef4444}
    </style>
</head>
<body>
<div class="container">
<header><a href="/" class="back">&larr; Back to ToolGen</a>
<h1>Regex Tester</h1><p class="desc">Test regular expressions in real-time with syntax highlighting.</p></header>
<div class="box"><label>Pattern</label>
<input type="text" id="pattern" placeholder="e.g., \d{3}-\d{4}" value="\d{3}-\d{4}">
<div class="flags">
<label class="flag-label"><input type="checkbox" id="flag-g" checked> Global (g)</label>
<label class="flag-label"><input type="checkbox" id="flag-i"> Case Insensitive (i)</label>
<label class="flag-label"><input type="checkbox" id="flag-m"> Multiline (m)</label>
</div></div>
<div class="box"><label>Test String</label>
<textarea id="testString" rows="5" placeholder="Enter text to test...">Contact: 123-4567 or 987-6543
Phone: 555-1234</textarea></div>
<button class="btn" onclick="testRegex()">Test Regex</button>
<div class="box" style="margin-top:20px"><label>Result</label>
<div id="result">Enter a pattern and click Test Regex.</div>
<div class="match-count" id="matchCount"></div></div>
<div class="box"><label>Quick Reference</label>
<div style="color:#666;font-size:0.85rem;font-family:monospace;line-height:1.8">
\d = digit | \w = word char | \s = whitespace<br>. = any | ^ = start | $ = end<br>* = 0+ | + = 1+ | ? = 0-1 | {n} = n times<br>[abc] = a/b/c | [^abc] = not a/b/c</div></div>
</div>
<script>
function testRegex(){
const p=document.getElementById('pattern').value;
const s=document.getElementById('testString').value;
let f=(document.getElementById('flag-g').checked?'g':'')+(document.getElementById('flag-i').checked?'i':'')+(document.getElementById('flag-m').checked?'m':'');
const r=document.getElementById('result'),c=document.getElementById('matchCount');
try{
let re=new RegExp(p,f);
let m=s.match(re);
if(!m){r.innerHTML='<span class="no-match">No matches</span>';c.textContent=''}
else{
let h=s.replace(re,'<span class=match>$&</span>');
r.innerHTML=h;c.textContent=`Found ${m.length} match(es): ${m.join(', ')}`}
}catch(e){r.innerHTML='<span class=error>Error: '+e.message+'</span>';c.textContent=''}
}
testRegex();
</script>
</body></html>
