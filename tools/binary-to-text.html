    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-family: monospace; font-size: 0.95rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 120px; }
        textarea:focus { border-color: #667eea; }
        .arrow { text-align: center; font-size: 2rem; color: #667eea; margin: 10px 0; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; cursor: pointer; font-size: 0.95rem; font-weight: 600; margin-right: 10px; }

<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>💻 Binary to Text Converter</h1>
        <p class="subtitle">Convert binary to text and text to binary instantly. 100% free.</p>
        <div class="card">
            <label>Enter binary (space-separated) or text</label>
            <textarea id="input" placeholder="01001000 01101001 or 'Hi'"></textarea>
            <div class="arrow">↓</div>
            <textarea id="output" readonly placeholder="Output..."></textarea>
            <button class="btn" onclick="binaryToText()">🔄 Binary → Text</button>
            <button class="btn" onclick="textToBinary()">🔄 Text → Binary</button>
            <button class="btn" onclick="copy()">📋 Copy</button>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        function binaryToText() {
            try {
                const input = document.getElementById('input').value.trim();
                const binaries = input.includes(' ') ? input.split(' ') : input.match(/.{8}/g);
                const text = binaries.map(b => String.fromCharCode(parseInt(b, 2))).join('');
                document.getElementById('output').value = text;
            } catch(e) { alert('Invalid binary input'); }
        }
        function textToBinary() {
            const text = document.getElementById('input').value;
            const binary = text.split('').map(c => c.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
            document.getElementById('output').value = binary;
        }
        function copy() { navigator.clipboard.writeText(document.getElementById('output').value); alert('Copied!'); }
    </script>
