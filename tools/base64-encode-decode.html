<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Base64 Encoder/Decoder - ToolGen</title>
    <meta name="description" content="Encode and decode Base64 strings instantly. Free online Base64 encoder and decoder. Safe and private - all processing in browser.">
    <meta name="keywords" content="base64 encoder, base64 decoder, encode base64, decode base64, base64 converter, base64 online">
    <link rel="canonical" href="https://toolgen.xyz/tools/base64-encode-decode.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: #0a0a0a; border: 2px solid #333; border-radius: 25px; color: #888; cursor: pointer; font-size: 0.9rem; }
        .tab:hover { border-color: #667eea; color: #fff; }
        .tab.active { border-color: #667eea; color: #fff; background: rgba(102,126,234,0.15); }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #22c55e; font-family: monospace; font-size: 0.95rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 150px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .copy-msg { color: #f59e0b; font-size: 0.85rem; margin-top: 8px; }
        .info { background: #111; border-radius: 8px; padding: 12px; margin-top: 15px; color: #888; font-size: 0.85rem; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔤 Base64 Encoder/Decoder</h1>
        <p class="subtitle">Encode or decode Base64 strings instantly. 100% private - all processing happens in your browser.</p>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="setMode('encode')">Encode</button>
                <button class="tab" onclick="setMode('decode')">Decode</button>
            </div>

            <textarea id="input" placeholder="Enter text to encode..." oninput="process()"></textarea>
            <textarea id="output" placeholder="Result will appear here..." readonly></textarea>

            <button class="btn" onclick="copy()">📋 Copy Result</button>
            <button class="btn" style="background:#333;" onclick="swap()">⇄ Swap</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="info">🔒 All processing happens in your browser. Your data never leaves your device.</div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/base64-encode-decode.html">Base64 Encoder/Decoder</a> - 150+ Free Tools</p>
    </footer>

    <script>
        let mode = 'encode';

        function setMode(m) {
            mode = m;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('input').placeholder = mode === 'encode' ? 'Enter text to encode...' : 'Enter Base64 to decode...';
            document.getElementById('output').value = '';
        }

        function process() {
            const input = document.getElementById('input').value;
            if (!input) {
                document.getElementById('output').value = '';
                return;
            }
            try {
                if (mode === 'encode') {
                    document.getElementById('output').value = btoa(unescape(encodeURIComponent(input)));
                } else {
                    document.getElementById('output').value = decodeURIComponent(escape(atob(input.trim())));
                }
            } catch(e) {
                document.getElementById('output').value = 'Error: Invalid Base64 string';
            }
        }

        function swap() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output').value;
            document.getElementById('input').value = output;
            document.getElementById('output').value = input;
        }

        function copy() {
            const text = document.getElementById('output').value;
            if (text) {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
        }
    </script>
</body>
</html>
