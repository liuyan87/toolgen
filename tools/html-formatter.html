<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free HTML Formatter & Beautifier - ToolGen</title><meta name="description" content="Format, beautify and indent HTML code. Free online HTML formatter."><meta name="keywords" content="html formatter, html beautifier, format html, indent html, html prettifier"><link rel="canonical" href="https://toolgen.xyz/tools/html-formatter.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#aaa}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.9rem;outline:none;resize:vertical;min-height:250px}textarea:focus{border-color:#667eea}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🏗️ HTML Formatter</h1><p class="subtitle">Format, beautify and indent HTML code. Free & instant.</p><div class="card"><textarea id="input" placeholder="<div><p>Hello World</p></div>"></textarea><button class="btn" onclick="format()">⚡ Format HTML</button><button class="btn" onclick="minify()">🗜️ Minify</button><button class="btn" onclick="copy()">📋 Copy</button><textarea id="output" readonly style="margin-top:15px"></textarea></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function formatHTML(html,indent){let formatted='',indentLevel=0;const voidTags=['br','hr','img','input','meta','link','area','base','col','embed','param','source','track','wbr'];let inTag=false,currentTag='';for(let i=0;i<html.length;i++){if(html[i]==='<'){inTag=true;currentTag='';}else if(html[i]==='>'){inTag=false;currentTag+=html[i];const tag=currentTag.trim();const isClosing=tag.startsWith('</');const isSelfClosing=tag.endsWith('/>')||voidTags.some(t=>new RegExp('<'+t+'\\b','i').test(tag));if(isClosing)indentLevel=Math.max(0,indentLevel-1);formatted+=''.padStart(indentLevel*indent,'')+tag+'\n';if(!isClosing&&!isSelfClosing&&!tag.startsWith('!</'))indentLevel++;currentTag='';continue;}if(inTag)currentTag+=html[i];else{const lastChar=formatted.charAt(formatted.length-1);if(html[i]==='\n')continue;if(html[i]===' '&&lastChar===' '&&html[i+1]===' ')continue;formatted+=html[i];}}return formatted.trim();}function format(){document.getElementById('output').value=formatHTML(document.getElementById('input').value,2);}function minify(){document.getElementById('output').value=document.getElementById('input').value.replace(/\s+/g,' ').replace(/>\s+</g,'><').trim();}function copy(){navigator.clipboard.writeText(document.getElementById('output').value);}</script></body></html>
