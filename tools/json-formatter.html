<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free JSON Formatter & Validator - ToolGen</title>
    <meta name="description" content="Format, validate, and minify JSON instantly. Paste your JSON and get beautifully formatted output. Free, no registration.">
    <meta name="keywords" content="json formatter, json validator, json minify, json beautifier">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:900px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:30px}
        .back{color:#667eea;text-decoration:none}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .desc{color:#888}
        .box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:15px}
        textarea{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#67cb88;font-family:'Courier New',monospace;font-size:0.9rem;padding:12px;min-height:200px;resize:vertical}
        label{display:block;color:#888;font-size:0.8rem;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
        .btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}
        .btn{padding:10px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer}
        .btn.secondary{background:#333}
        .ok{color:#4ade80;font-size:0.9rem;margin-top:8px}
        .error-msg{color:#ef4444}
    </style>
</head>
<body>
<div class="container">
<header><a href="/" class="back">&larr; Back to ToolGen</a>
<h1>JSON Formatter & Validator</h1><p class="desc">Format, validate, and minify JSON instantly.</p></header>
<div class="box"><label>Input JSON</label>
<textarea id="input" placeholder='{"name":"ToolGen","version":"1.0","features":["ai","image","developer"]}'></textarea></div>
<div class="btn-row">
<button class="btn" onclick="format()">Format</button>
<button class="btn secondary" onclick="minify()">Minify</button>
<button class="btn secondary" onclick="validate()">Validate</button>
<button class="btn secondary" onclick="copy()">Copy</button>
</div>
<div class="box"><label>Output</label>
<textarea id="output" readonly></textarea>
<div class="ok" id="status"></div></div>
</div>
<script>
function get(){return document.getElementById('input').value}
function set(v){document.getElementById('output').value=v}
function format(){try{set(JSON.stringify(JSON.parse(get()),null,2));stat('Valid JSON - Formatted','#4ade80')}catch(e){set('Error: '+e.message);stat('Invalid JSON','#ef4444')}}
function minify(){try{set(JSON.stringify(JSON.parse(get())));stat('Minified','#4ade80')}catch(e){set('Error: '+e.message);stat('Invalid JSON','#ef4444')}}
function validate(){try{JSON.parse(get());document.getElementById('output').value='Valid JSON';stat('JSON is valid','#4ade80')}catch(e){document.getElementById('output').value='Invalid: '+e.message;stat('Invalid JSON','#ef4444')}}
function stat(msg,color){const s=document.getElementById('status');s.textContent=msg;s.style.color=color}
function copy(){navigator.clipboard.writeText(document.getElementById('output').value);stat('Copied!','#667eea')}
</script>
</body></html>
