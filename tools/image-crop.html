.width-cw));cy=Math.max(0,Math.min(startCY+(my-startY),canvas.height-ch));drawOverlay();}else if(resizing){cw=Math.max(50,Math.min(startW+(mx-startX),canvas.width-cx));ch=Math.max(50,Math.min(startH+(my-startY),canvas.height-cy));drawOverlay();}};window.onmouseup=()=>{dragging=false;resizing=false;};document.getElementById('cropX').oninput=function(){cx=Math.max(0,Math.min(parseInt(this.value)||0,canvas.width-cw));drawOverlay();};document.getElementById('cropY').oninput=function(){cy=Math.max(0,Math.min(parseInt(this.value)||0,canvas.height-ch));drawOverlay();};document.getElementById('cropW').oninput=function(){cw=Math.max(50,Math.min(parseInt(this.value)||0,canvas.width-cx));drawOverlay();};document.getElementById('cropH').oninput=function(){ch=Math.max(50,Math.min(parseInt(this.value)||0,canvas.height-cy));drawOverlay();};function crop(){const scaleX=img.width/canvas.width;const scaleY=img.height/canvas.height;const oc=document.createElement('canvas');oc.width=cw*scaleX;oc.height=ch*scaleY;const octx=oc.getContext('2d');octx.drawImage(img,cx*scaleX,cy*scaleY,cw*scaleX,ch*scaleY,0,0,cw*scaleX,ch*scaleY);const a=document.createElement('a');a.download='cropped-image.png';a.href=oc.toDataURL('image/png');a.click();}function reset(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);cx=50;cy=50;cw=Math.min(200,canvas.width-100);ch=Math.min(200,canvas.height-100);drawOverlay();}</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
