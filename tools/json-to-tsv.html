<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free JSON to TSV Converter - ToolGen</title><meta name="description" content="Convert JSON data to TSV (Tab Separated Values) format instantly."><meta name="keywords" content="json to tsv, json tsv converter, tab separated values"><link rel="canonical" href="https://toolgen.xyz/tools/json-to-tsv.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#aaa}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.9rem;outline:none;resize:vertical;min-height:200px}textarea:focus{border-color:#667eea}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>📊 JSON to TSV Converter</h1><p class="subtitle">Convert JSON data to TSV (Tab Separated Values) format.</p><div class="card"><textarea id="input" placeholder='[{"name":"John","age":30},{"name":"Jane","age":25}]'></textarea><button class="btn" onclick="convert()">⚡ Convert</button><button class="btn" onclick="copy()">📋 Copy TSV</button><textarea id="output" readonly style="margin-top:15px"></textarea></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function convert(){try{const json=JSON.parse(document.getElementById('input').value);if(!Array.isArray(json)||!json.length)throw new Error('JSON must be an array');const keys=Object.keys(json[0]);const tsv=[keys.join('\t')];json.forEach(row=>{tsv.push(keys.map(k=>String(row[k]??'')).join('\t'));});document.getElementById('output').value=tsv.join('\n');}catch(e){alert('Error: '+e.message);}}function copy(){navigator.clipboard.writeText(document.getElementById('output').value);}</script></body></html>
