<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Color Converter (HEX, RGB, HSL) - ToolGen</title>
    <meta name="description" content="Convert colors between HEX, RGB, and HSL formats instantly. Free color picker and converter.">
    <meta name="keywords" content="color converter, hex to rgb, rgb to hsl, color picker, color codes">
    <link rel="canonical" href="https://toolgen.xyz/tools/color-converter.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .color-preview { width: 100%; height: 150px; border-radius: 12px; margin: 20px 0; border: 2px solid #333; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        input[type="color"] { width: 80px; height: 50px; border: none; cursor: pointer; border-radius: 8px; }
        .formats { display: grid; gap: 15px; margin: 20px 0; }
        .format-row { display: flex; align-items: center; gap: 15px; }
        .format-row label { min-width: 80px; text-align: left; color: #888; }
        .format-row input { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-family: monospace; }
        .format-row input:focus { border-color: #667eea; outline: none; }
        .btn { display: inline-block; padding: 12px 28px; background: #667eea; color: #fff; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        .presets { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; justify-content: center; }
        .preset { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid #333; }
        .preset:hover { transform: scale(1.1); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎨 Color Converter</h1>
        <p class="subtitle">Convert colors between HEX, RGB, and HSL formats instantly.</p>
        <div class="card">
            <input type="color" id="colorPicker" value="#667eea" onchange="updateFromPicker()">
            <div class="color-preview" id="preview" style="background:#667eea;">#667eea</div>
            <div class="formats">
                <div class="format-row">
                    <label>HEX</label>
                    <input type="text" id="hexInput" value="#667eea" oninput="updateFromHex()">
                </div>
                <div class="format-row">
                    <label>RGB</label>
                    <input type="text" id="rgbInput" value="rgb(102, 126, 234)" readonly>
                </div>
                <div class="format-row">
                    <label>HSL</label>
                    <input type="text" id="hslInput" value="hsl(229, 76%, 66%)" readonly>
                </div>
            </div>
            <button class="btn" onclick="copyHex()">📋 Copy HEX</button>
            <button class="btn" onclick="copyRGB()">📋 Copy RGB</button>
            <button class="btn" onclick="copyHSL()">📋 Copy HSL</button>
            <div class="presets" id="presets"></div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        const presetColors = ['#ff0000','#ff7f00','#ffff00','#00ff00','#0000ff','#4b0082','#9400d3','#ff1493','#00ffff','#fff'];
        presetColors.forEach(c => {
            const btn = document.createElement('div');
            btn.className = 'preset';
            btn.style.background = c;
            btn.onclick = () => { document.getElementById('colorPicker').value = c; updateFromPicker(); };
            document.getElementById('presets').appendChild(btn);
        });
        function updateFromPicker() {
            const hex = document.getElementById('colorPicker').value;
            updateAll(hex);
        }
        function updateFromHex() {
            let hex = document.getElementById('hexInput').value;
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) updateAll(hex);
        }
        function updateAll(hex) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            const [h, s, l] = rgbToHsl(r, g, b);
            document.getElementById('hexInput').value = hex;
            document.getElementById('rgbInput').value = `rgb(${r}, ${g}, ${b})`;
            document.getElementById('hslInput').value = `hsl(${h}, ${s}%, ${l}%)`;
            document.getElementById('preview').style.background = hex;
            document.getElementById('preview').textContent = hex.toUpperCase();
            document.getElementById('colorPicker').value = hex;
        }
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r,g,b), min = Math.min(r,g,b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch(max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
        }
        function copyHex() { navigator.clipboard.writeText(document.getElementById('hexInput').value); alert('Copied!'); }
        function copyRGB() { navigator.clipboard.writeText(document.getElementById('rgbInput').value); alert('Copied!'); }
        function copyHSL() { navigator.clipboard.writeText(document.getElementById('hslInput').value); alert('Copied!'); }
    </script>
</body>
</html>
