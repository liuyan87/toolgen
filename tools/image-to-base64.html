<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Image to Base64 Converter - ToolGen</title>
    <meta name="description" content="Convert any image to Base64 string for embedding in HTML, CSS, or JSON. Free online tool.">
    <meta name="keywords" content="image to base64, base64 encoder, image encoder, base64 image">
    <link rel="canonical" href="https://toolgen.xyz/tools/image-to-base64.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .drop-zone { border: 2px dashed #667eea; border-radius: 16px; padding: 60px 20px; cursor: pointer; }
        .drop-zone:hover { background: rgba(102,126,234,0.1); }
        input[type="file"] { display: none; }
        .preview-img { max-width: 300px; max-height: 200px; border-radius: 8px; margin: 15px 0; }
        .code-box { background: #0a0a0a; border: 2px solid #333; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left; }
        .code-box pre { color: #667eea; font-size: 0.8rem; overflow: auto; max-height: 200px; word-break: break-all; white-space: pre-wrap; }
        .btn { display: inline-block; padding: 12px 28px; background: #667eea; color: #fff; border: none; border-radius: 25px; cursor: pointer; margin: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🖼️ Image to Base64</h1>
        <p class="subtitle">Convert any image to Base64 string for embedding in HTML or CSS.</p>
        <div class="card">
            <div class="drop-zone onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem;">📷</div>
                <p>Click or drag image to upload</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="convert(this.files[0])">
            <img id="preview" class="preview-img" style="display:none;">
            <div id="result" style="display:none;">
                <div class="code-box"><pre id="htmlCode"></pre></div>
                <button class="btn" onclick="copyHTML()">📋 Copy HTML</button>
                <button class="btn" onclick="copyCSS()">📋 Copy CSS</button>
            </div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script>
        function convert(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64 = e.target.result;
                document.getElementById('preview').src = base64;
                document.getElementById('preview').style.display = 'block';
                const mime = base64.split(',')[0];
                document.getElementById('htmlCode').textContent = `<img src="${base64}" alt="${file.name}">`;
                document.getElementById('result').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
        function copyHTML() {
            const code = document.getElementById('htmlCode').textContent;
            navigator.clipboard.writeText(code);
            alert('HTML copied!');
        }
        function copyCSS() {
            const code = `background-image: url("${document.getElementById('htmlCode').textContent.match(/src="([^"]+)"/)[1]}");`;
            navigator.clipboard.writeText(code);
            alert('CSS copied!');
        }
    </script>
</body>
</html>
