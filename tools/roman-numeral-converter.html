y><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>Ⅶ Roman Numeral Converter</h1><p class="subtitle">Convert between Roman numerals and numbers instantly.</p><div class="card"><input type="text" id="input" placeholder="2026" oninput="convert()"><div class="result" id="result">MMXXVI</div><div class="quick"><button onclick="set('1')">I</button><button onclick="set('4')">IV</button><button onclick="set('9')">IX</button><button onclick="set('10')">X</button><button onclick="set('50')">L</button><button onclick="set('100')">C</button><button onclick="set('500')">D</button><button onclick="set('1000')">M</button></div><button class="btn" onclick="swap()">⇅ Swap</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let mode='toRoman';function set(n){document.getElementById('input').value=n;convert();}function toRoman(n){const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1];const syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];let r='';for(let i=0;i<vals.length;i++){while(n>=vals[i]){r+=syms[i];n-=vals[i];}}return r;}function fromRoman(s){const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0;for(let i=0;i<s.length;i++){const curr=map[s[i]];const next=map[s[i+1]];if(next&&curr<next)n-=curr;else n+=curr;}return n;}function convert(){const v=document.getElementById('input').value.trim();if(!v){document.getElementById('result').textContent='-';return;}if(!isNaN(v)){document.getElementById('result').textContent=toRoman(parseInt(v));}else{const n=fromRoman(v.toUpperCase());document.getElementById('result').textContent=isNaN(n)?'Invalid':n;}}function swap(){mode=mode==='toRoman'?'toNum':'toRoman';document.getElementById('input').placeholder=mode==='toRoman'?'2026':'MMXXVI';document.getElementById('input').value='';document.getElementById('result').textContent='-';}convert();</script></body></html>
