<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>Ⅽ Roman Numeral Converter</h1>
        <p class="subtitle">Convert between Roman numerals and numbers instantly.</p>

        <div class="card">
            <label>Number:</label>
            <input type="text" id="input" placeholder="e.g. 1987 or MCMLXXXVII" oninput="convert()">

            <button class="btn" onclick="swap()">⇄ Swap</button>
            <button class="btn swap-btn" onclick="copy()">📋 Copy</button>
            <button class="btn swap-btn" onclick="clearText()">Clear</button>

            <div class="output-box" id="output">Result</div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/roman-numeral-converter.html">Roman Numeral Converter</a> - 150+ Free Tools</p>
    </footer>

    <script>
        const isRoman = s => /^[IVXLCDMivxlcdm]+$/.test(s.trim());

        function toRoman(num) {
            if (num < 1 || num > 3999) return 'Enter a number 1-3999';
            const vals = [1000,900,500,400,100,90,50,40,10,9,5,4,1];
            const syms = ['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
            let result = '', n = num;
            for (let i = 0; i < vals.length; i++) {
                while (n >= vals[i]) { result += syms[i]; n -= vals[i]; }
            }
            return result;
        }

        function fromRoman(roman) {
            const map = { I:1, V:5, X:10, L:50, C:100, D:500, M:1000 };
            let result = 0, max = 0;
            for (let i = roman.length - 1; i >= 0; i--) {
                const val = map[roman[i].toUpperCase()];
                if (val >= max) { result += val; max = val; }
                else result -= val;
            }
            return result;
        }

        function convert() {
            const input = document.getElementById('input').value.trim();
            if (!input) { document.getElementById('output').textContent = 'Result'; return; }

            if (isNaN(input)) {
                // It's Roman
                document.getElementById('output').textContent = fromRoman(input);
            } else {
                // It's a number
                document.getElementById('output').textContent = toRoman(parseInt(input));
            }
        }

        function swap() {
            const val = document.getElementById('output').textContent;
            if (val && val !== 'Result') {
                document.getElementById('input').value = val;
                convert();
            }
        }

        function copy() {
            const text = document.getElementById('output').textContent;
            if (text && text !== 'Result') {
                navigator.clipboard.writeText(text);
                document.getElementById('copyMsg').textContent = '✓ Copied!';
                setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
            }
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = 'Result';
        }
    </script>
