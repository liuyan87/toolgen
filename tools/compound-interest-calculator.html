<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Compound Interest Calculator - ToolGen</title>
    <meta name="description" content="Calculate compound interest and investment growth. Free online compound interest calculator for savings, investments, and loans.">
    <meta name="keywords" content="compound interest calculator, investment calculator, savings calculator, loan interest, compound interest formula, fd calculator, rd calculator">
    <link rel="canonical" href="https://toolgen.xyz/tools/compound-interest-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #aaa; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-box { background: #0a0a0a; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box .val { font-size: 1.5rem; font-weight: 700; color: #22c55e; }
        .result-box .label { color: #888; font-size: 0.8rem; margin-top: 5px; }
        .result-box.highlight { border: 2px solid #667eea; }
        .result-box.highlight .val { color: #667eea; }
        .breakdown { background: #0a0a0a; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .breakdown-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .breakdown-row:last-child { border-bottom: none; font-weight: 700; color: #22c55e; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>💰 Compound Interest Calculator</h1>
        <p class="subtitle">Calculate your investment growth over time. See the power of compound interest.</p>

        <div class="card">
            <div class="input-grid">
                <div>
                    <label>Principal ($)</label>
                    <input type="number" id="principal" value="10000" min="0">
                </div>
                <div>
                    <label>Annual Interest Rate (%)</label>
                    <input type="number" id="rate" value="7" min="0" step="0.1">
                </div>
                <div>
                    <label>Time Period (Years)</label>
                    <input type="number" id="years" value="10" min="1" max="50">
                </div>
                <div>
                    <label>Compounding Frequency</label>
                    <select id="freq">
                        <option value="1">Annually</option>
                        <option value="2">Semi-Annually</option>
                        <option value="4">Quarterly</option>
                        <option value="12" selected>Monthly</option>
                        <option value="365">Daily</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="calculate()">Calculate</button>
            <button class="btn" style="background:#333;" onclick="reset()">Reset</button>

            <div class="result-grid" id="results">
                <div class="result-box highlight">
                    <div class="val" id="totalValue">$0</div>
                    <div class="label">Future Value</div>
                </div>
                <div class="result-box">
                    <div class="val" id="totalInterest">$0</div>
                    <div class="label">Total Interest</div>
                </div>
                <div class="result-box">
                    <div class="val" id="principalDisplay">$0</div>
                    <div class="label">Principal</div>
                </div>
            </div>

            <div class="breakdown" id="breakdown">
                <div class="breakdown-row"><span>Year</span><span>Balance</span></div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/compound-interest-calculator.html">Compound Interest Calculator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) / 100 || 0;
            const t = parseFloat(document.getElementById('years').value) || 1;
            const n = parseInt(document.getElementById('freq').value) || 1;

            const amount = p * Math.pow(1 + r / n, n * t);
            const interest = amount - p;

            document.getElementById('totalValue').textContent = '$' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('totalInterest').textContent = '$' + interest.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            document.getElementById('principalDisplay').textContent = '$' + p.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

            // Yearly breakdown
            const breakdown = document.getElementById('breakdown');
            breakdown.innerHTML = '<div class="breakdown-row"><span>Year</span><span>Balance</span></div>';
            for (let y = 1; y <= t; y++) {
                const bal = p * Math.pow(1 + r / n, n * y);
                breakdown.innerHTML += `<div class="breakdown-row"><span>Year ${y}</span><span>$${bal.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',')}</span></div>`;
            }
        }

        function reset() {
            document.getElementById('principal').value = 10000;
            document.getElementById('rate').value = 7;
            document.getElementById('years').value = 10;
            document.getElementById('freq').value = 12;
            calculate();
        }

        calculate();
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
</html>
