<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free Compound Interest Calculator - ToolGen</title><meta name="description" content="Calculate compound interest and see your money grow over time. Free investment calculator."><meta name="keywords" content="compound interest calculator, investment calculator, savings calculator, interest calculator, financial calculator"><link rel="canonical" href="https://toolgen.xyz/tools/compound-interest-calculator.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:700px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}label{display:block;margin-bottom:8px;font-weight:600;color:#aaa}input{width:100%;padding:12px;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:1rem;outline:none;margin-bottom:12px}input:focus{border-color:#667eea}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.result-big{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:16px;padding:25px;text-align:center;margin:20px 0}.result-big .total{font-size:3rem;font-weight:800}.result-big .label{font-size:1rem;opacity:0.9;margin-top:5px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.breakdown div{background:#0a0a0a;border-radius:10px;padding:15px;text-align:center}.breakdown div .val{font-size:1.5rem;font-weight:700;color:#667eea}.breakdown div .lbl{color:#888;font-size:0.85rem;margin-top:5px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin-top:15px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>💰 Compound Interest Calculator</h1><p class="subtitle">Calculate compound interest and see your money grow over time.</p><div class="card"><div class="fields"><div><label>Principal ($)</label><input type="number" id="principal" value="10000" oninput="calc()"></div><div><label>Annual Rate (%)</label><input type="number" id="rate" value="7" step="0.1" oninput="calc()"></div><div><label>Time (Years)</label><input type="number" id="years" value="10" oninput="calc()"></div><div><label>Compounding</label><select id="compound" onchange="calc()"><option value="1">Annually</option><option value="12" selected>Monthly</option><option value="4">Quarterly</option><option value="365">Daily</option></select></div></div><div class="result-big"><div class="total" id="total">$22,966.11</div><div class="label">Future Value</div></div><div class="breakdown"><div><div class="val" id="principalOut">$10,000</div><div class="lbl">Principal</div></div><div><div class="val" id="interest">$12,966.11</div><div class="lbl">Interest Earned</div></div></div><button class="btn" onclick="calc()">⚡ Calculate</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function calc(){const p=parseFloat(document.getElementById('principal').value)||0;const r=parseFloat(document.getElementById('rate').value)/100||0;const t=parseFloat(document.getElementById('years').value)||0;const n=parseInt(document.getElementById('compound').value)||1;const total=p*Math.pow(1+r/n,n*t);const interest=total-p;document.getElementById('total').textContent='$'+total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('principalOut').textContent='$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});document.getElementById('interest').textContent='$'+interest.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}calc();</script></body></html>
