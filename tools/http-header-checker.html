<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free HTTP Header Checker - ToolGen</title><meta name="description" content="Check HTTP headers for any URL. See security headers, caching, content-type and more."><meta name="keywords" content="http headers, header checker, check headers, http header viewer, security headers"><link rel="canonical" href="https://toolgen.xyz/tools/http-header-checker.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:700px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}input{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:1rem;outline:none;margin-bottom:15px}input:focus{border-color:#667eea}.result-box{background:#0a0a0a;border-radius:8px;padding:15px;margin-top:15px;max-height:500px;overflow:auto}.header-row{display:flex;padding:8px 0;border-bottom:1px solid #333;flex-wrap:wrap}.header-row:last-child{border-bottom:none}.header-row .key{min-width:200px;font-weight:700;color:#667eea;font-size:0.85rem}.header-row .val{color:#fff;font-family:monospace;font-size:0.85rem;word-break:break-all;flex:1}.status-ok{background:rgba(74,222,128,0.2);border-radius:8px;padding:15px;margin-top:15px;color:#4ade80;font-weight:700;text-align:center}.status-err{background:rgba(239,68,68,0.2);border-radius:8px;padding:15px;margin-top:15px;color:#ef4444;font-weight:700;text-align:center}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.9 .getElementById('result').innerHTML=`<div class="status-err">❌ Error: ${e.message}</div>`;}}</script></body></html>
