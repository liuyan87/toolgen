="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🎨 RGB to HEX</h1><p class="subtitle">Convert RGB color values to HEX color codes.</p><div class="card"><div class="preview" id="preview"></div><div class="sliders"><div class="slider"><label>R</label><input type="range" id="r" min="0" max="255" value="102" oninput="update()"><span id="rVal">102</span></div><div class="slider"><label>G</label><input type="range" id="g" min="0" max="255" value="126" oninput="update()"><span id="gVal">126</span></div><div class="slider"><label>B</label><input type="range" id="b" min="0" max="255" value="234" oninput="update()"><span id="bVal">234</span></div></div><div class="result" id="hex">#667EEA</div><button class="btn" onclick="copy()">📋 Copy HEX</button><button class="btn" onclick="copyRGB()">📋 Copy RGB</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function update(){const r=document.getElementById('r').value;const g=document.getElementById('g').value;const b=document.getElementById('b').value;document.getElementById('rVal').textContent=r;document.getElementById('gVal').textContent=g;document.getElementById('bVal').textContent=b;const hex='#'+[r,g,b].map(v=>parseInt(v).toString(16).padStart(2,'0')).join('');document.getElementById('hex').textContent=hex;document.getElementById('preview').style.background=hex;document.getElementById('preview').textContent=hex.toUpperCase();}function copy(){navigator.clipboard.writeText(document.getElementById('hex').textContent);}function copyRGB(){const r=document.getElementById('r').value;const g=document.getElementById('g').value;const b=document.getElementById('b').value;navigator.clipboard.writeText(`rgb(${r}, ${g}, ${b})`);}update();</script></body></html>
