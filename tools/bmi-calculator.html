<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free BMI Calculator - ToolGen</title>
    <meta name="description" content="Free online BMI calculator. Calculate your Body Mass Index instantly.">
    <meta name="keywords" content="bmi calculator, body mass index, health calculator, bmi check">
    <link rel="canonical" href="https://toolgen.xyz/tools/bmi-calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; margin-bottom: 20px; }
        input:focus, select:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.3s; }
        .btn:hover { transform: scale(1.05); }
        .result-box { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 16px; padding: 30px; text-align: center; margin-top: 20px; }
        .bmi-value { font-size: 4rem; font-weight: 800; }
        .bmi-category { font-size: 1.2rem; margin-top: 10px; }
        .bmi-scale { display: flex; justify-content: space-between; margin-top: 20px; padding: 0 10px; }
        .scale-item { text-align: center; font-size: 0.8rem; }
        .scale-item span { display: block; font-weight: 700; }
        .underweight { color: #60a5fa; }
        .normal { color: #4ade80; }
        .overweight { color: #f59e0b; }
        .obese { color: #ef4444; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>⚖️ BMI Calculator</h1>
        <p class="subtitle">Calculate your Body Mass Index to check your health status.</p>
        <div class="card">
            <label>Height</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="height" placeholder="Enter height" style="flex: 1;">
                <select id="heightUnit" style="width: 100px;" onchange="calculate()">
                    <option value="cm">cm</option>
                    <option value="in">inches</option>
                </select>
            </div>
            <label>Weight</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="weight" placeholder="Enter weight" style="flex: 1;">
                <select id="weightUnit" style="width: 100px;" onchange="calculate()">
                    <option value="kg">kg</option>
                    <option value="lb">lb</option>
                </select>
            </div>
            <br>
            <button class="btn" onclick="calculate()">Calculate BMI</button>
            <div class="result-box" id="result" style="display: none;">
                <div class="bmi-value" id="bmiValue">0</div>
                <div class="bmi-category" id="bmiCategory"></div>
                <div class="bmi-scale">
                    <div class="scale-item underweight"><span>&lt;18.5</span>Underweight</div>
                    <div class="scale-item normal"><span>18.5-24.9</span>Normal</div>
                    <div class="scale-item overweight"><span>25-29.9</span>Overweight</div>
                    <div class="scale-item obese"><span>&gt;30</span>Obese</div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        function calculate() {
            let height = parseFloat(document.getElementById('height').value);
            let weight = parseFloat(document.getElementById('weight').value);
            const heightUnit = document.getElementById('heightUnit').value;
            const weightUnit = document.getElementById('weightUnit').value;
            if (!height || !weight) return;
            if (heightUnit === 'in') height = height * 2.54;
            if (weightUnit === 'lb') weight = weight * 0.453592;
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);
            document.getElementById('result').style.display = 'block';
            document.getElementById('bmiValue').textContent = bmi.toFixed(1);
            let category, color;
            if (bmi < 18.5) { category = 'Underweight'; color = '#60a5fa'; }
            else if (bmi < 25) { category = 'Normal'; color = '#4ade80'; }
            else if (bmi < 30) { category = 'Overweight'; color = '#f59e0b'; }
            else { category = 'Obese'; color = '#ef4444'; }
            const catEl = document.getElementById('bmiCategory');
            catEl.textContent = category;
            catEl.style.color = color;
            document.getElementById('bmiValue').style.color = color;
        }
    </script>
<script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
</body>
</html>
