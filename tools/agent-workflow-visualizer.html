<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Agent Workflow Visualizer - ToolGen</title><meta name="description" content="Visualize multi-agent AI workflows. See how AutoGen, CrewAI, and LangGraph agent systems work."/><meta name="keywords" content="agent workflow, multi-agent system, crewai workflow, langgraph visualization, agentic AI diagram"><link rel="canonical" href="https://toolgen.xyz/tools/agent-workflow-visualizer.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}.presets{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.preset{background:#0a0a0a;border:2px solid #333;border-radius:12px;padding:12px 20px;cursor:pointer;font-size:0.9rem;transition:all 0.2s}.preset:hover,.preset.active{border-color:#667eea;background:rgba(102,126,234,0.1)}.canvas{background:#0a0a0a;border-radius:12px;min-height:400px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}.node{background:#1a1a1a;border:2px solid #667eea;border-radius:12px;padding:15px 20px;text-align:center;min-width:120px;position:absolute;cursor:move;transition:box-shadow 0.2s;font-size:0.9rem}.node:hover{box-shadow:0 0 20px rgba(102,126,234,0.4)}.node .role{font-weight:700;color:#667eea;font-size:0.85rem}.node .task{color:#888;font-size:0.75rem;margin-top:3px}.node.input{border-color:#4ade80}.node.input .role{color:#4ade80}.node.output{border-color:#f59e0b}.node.output .role{color:#f59e0b}.node.agent{border-color:#667eea}.node.supervisor{border-color:#a855f7;background:rgba(168,85,247,0.1)}.node.tool{border-color:#06b6d4}.node.tool .role{color:#06b6d4}.arrow{position:absolute;pointer-events:none;font-size:1.5rem;color:#667eea}.legend{display:flex;flex-wrap:wrap;gap:15px;margin-top:20px;font-size:0.85rem}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:12px;height:12px;border-radius:50%}.flow-desc{color:#888;font-size:0.9rem;margin-top:15px;padding:15px;background:#0a0a0a;border-radius:8px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔄 Agent Workflow Visualizer</h1><p class="subtitle">See how multi-agent systems work. Explore different agent architectures visually.</p><div class="card"><div class="presets"><button class="preset active" onclick="showWorkflow('simple')">🤖 Simple Agent</button><button class="preset" onclick="showWorkflow('crew')">👥 CrewAI Flow</button><button class="preset" onclick="showWorkflow('supervisor')">👔 Supervisor Flow</button><button class="preset" onclick="showWorkflow('hierarchy')">🏢 Hierarchical</button><button class="preset" onclick="showWorkflow('rag')">📚 RAG Agent</button></div><div class="canvas" id="canvas"></div><div class="flow-desc" id="flowDesc"></div><div class="legend"><div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div> Input Node</div><div class="legend-item"><div class="legend-dot" style="background:#667eea"></div> Agent</div><div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div> Supervisor</div><div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div> Tool</div><div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Output</div></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const workflows={simple:{nodes:[{id:'input',type:'input',x:50,y:170,role:'User Input',task:'Initial prompt'},{id:'agent',type:'agent',x:300,y:170,role:'AI Agent',task:'Processes request'},{id:'tool',type:'tool',x:300,y:280,role:'Tools',task:'Web search, code, files'},{id:'output',type:'output',x:550,y:170,role:'Response',task:'Final output'}],arrows:[['input→agent','↓','agent→tool','↙','tool→agent','↑','agent→output','→']],desc:'The simplest agent architecture: one agent receives input, optionally uses tools, and produces output. Most single-agent applications follow this pattern.'},crew:{nodes:[{id:'manager',type:'supervisor',x:350,y:50,role:'Manager',task:'Coordinates crew'},{id:'researcher',type:'agent',x:100,y:180,role:'Researcher',task:'Gathers information'},{id:'writer',type:'agent',x:350,y:180,role:'Writer',task:'Creates content'},{id:'reviewer',type:'agent',x:600,y:180,role:'Reviewer',task:'Reviews & edits'},{id:'input',type:'input',x:350,y:320,role:'Task Input',task:'Multi-step task'}],arrows:[['manager→researcher','↙','manager→writer','↓','manager→reviewer','↘','researcher→writer','→','writer→reviewer','→','input→manager','↑']],desc:'CrewAI flow: A manager agent coordinates specialized agents (Researcher, Writer, Reviewer) who work in sequence or parallel. Each agent has a specific role and responsibility.'},supervisor:{nodes:[{id:'supervisor',type:'supervisor',x:350,y:50,role:'Supervisor',task:'Decides next step'},{id:'agent1',type:'agent',x:150,y:180,role:'Agent A',task:'Task type A'},{id:'agent2',type:'agent',x:350,y:180,role:'Agent B',task:'Task type B'},{id:'agent3',type:'agent',x:550,y:180,role:'Agent C',task:'Task type C'},{id:'input',type:'input',x:50,y:50,role:'Task',task:'User input'}],arrows:[['input→supervisor','↘','supervisor→agent1','↙','supervisor→agent2','↓','supervisor→agent3','↘','agent1→supervisor','↗','agent2→supervisor','↑','agent3→supervisor','↗']],desc:'Supervisor pattern: A supervisor agent decides which specialized agent should handle each sub-task, then synthesizes their results. Common in AutoGen-style systems.'},hierarchy:{nodes:[{id:'ceo',type:'supervisor',x:350,y:30,role:'CEO Agent',task:'Strategic decisions'},{id:'pm',type:'agent',x:100,y:130,role:'PM Agent',task:'Product management'},{id:'eng',type:'agent',x:350,y:130,role:'Eng Agent',task:'Engineering'},{id:'design',type:'agent',x:600,y:130,role:'Design Agent',task:'UX/UI design'},{id:'data',type:'agent',x:100,y:230,role:'Data Agent',task:'Analytics'},{id:'qa',type:'agent',x:350,y:230,role:'QA Agent',task:'Testing'},{id:'input',type:'input',x:350,y:320,role:'Goal',task:'Complex project goal'}],arrows:[['ceo→pm','↙','ceo→eng','↓','ceo→design','↘','ceo→data','↙','ceo→qa','↓','input→ceo','↑']],desc:'Hierarchical pattern: Like a company org chart. CEO agent delegates to department heads, who manage their teams. Used in MetaGPT and similar systems.'},rag:{nodes:[{id:'input',type:'input',x:50,y:170,role:'Query',task:'User question'},{id:'retriever',type:'agent',x:250,y:100,role:'Retriever',task:'Finds relevant docs'},{id:'vector_db',type:'tool',x:250,y:230,role:'Vector DB',task:'Pinecone, Chroma, etc.'},{id:'synthesizer',type:'agent',x:450,y:170,role:'Synthesizer',task:'Generates answer'},{id:'output',type:'output',x:650,y:170,role:'Answer',task:'Context-rich response'}],arrows:[['input→retriever','→','retriever→vector_db','↓','vector_db→retriever','↑','retriever→synthesizer','→','synthesizer→output','→']],desc:'RAG (Retrieval-Augmented Generation): Agent retrieves relevant documents from a vector database, then synthesizes an answer using that context. Best for question-answering over private documents.'}};let current='simple';function showWorkflow(id){current=id;document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));event.target.classList.add('active');render();}function render(){const canvas=document.getElementById('canvas');const wf=workflows[current];canvas.innerHTML='';wf.nodes.forEach(n=>{const div=document.createElement('div');div.className='node '+n.type;div.style.left=n.x+'px';div.style.top=n.y+'px';div.innerHTML=`<div class="role">${n.role}</div><div class="task">${n.task}</div>`;canvas.appendChild(div);});document.getElementById('flowDesc').textContent=wf.desc;}render();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
