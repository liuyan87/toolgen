lity">🏆 Quality First</option><option value="cost">💰 Cost First</option><option value="speed">⚡ Speed First</option></select><select id="volume"><option value="low">Low Volume (<1M tokens/mo)</option><option value="medium">Medium Volume (1-10M tokens/mo)</option><option value="high">High Volume (10M+ tokens/mo)</option></select></div><div id="result" style="display:none"><div class="result"><div class="winner">🏆</div><div class="model" id="winnerName">-</div><div class="reason" id="winnerReason">-</div></div><div class="alternatives" id="alts"></div></div><button class="btn" onclick="findBest()">🔍 Find Best Model</button></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let selectedTask='';function selectTask(task,btn){selectedTask=task;document.querySelectorAll('.task-tag').forEach(t=>t.classList.remove('active'));btn.classList.add('active');findBest();}function findBest(){const desc=(document.getElementById('taskDesc').value+' '+selectedTask).toLowerCase();const priority=document.getElementById('priority').value;const models={'gpt-4o':{name:'GPT-4o',ctx:'128K',input:2.5,output:10,best:'General purpose, vision, coding',s:88},'gpt-4o-mini':{name:'GPT-4o-mini',ctx:'128K',input:0.15,output:0.6,best:'High volume, cost-sensitive',s:75},'o1-preview':{name:'o1-preview',ctx:'128K',input:15,output:60,best:'Hard reasoning, math, research',s:95},'o1-mini':{name:'o1-mini',ctx:'128K',input:3,output:12,best:'Fast reasoning',s:82},'claude-3-5-sonnet':{name:'Claude 3.5 Sonnet',ctx:'200K',input:3,output:15,best:'Writing, long context',s:92},'claude-3-opus':{name:'Claude 3 Opus',ctx:'200K',input:15,output:75,best:'Highest quality',s:95},'claude-3-haiku':{name:'Claude 3 Haiku',ctx:'200K',input:0.8,output:4,best:'Fast, cheap',s:68},'gemini-1-5-pro':{name:'Gemini 1.5 Pro',ctx:'2M',input:1.25,output:5,best:'Very long context',s:88},'gemini-1-5-flash':{name:'Gemini 1.5 Flash',ctx:'1M',input:0.075,output:0.3,best:'Ultra cheap',s:72},'gemini-2-0-flash':{name:'Gemini 2.0 Flash',ctx:'1M',input:0,output:0,best:'Free tier',s:70},'deepseek-v3':{name:'DeepSeek V3',ctx:'64K',input:0.27,output:1.1,best:'Budget coding',s:75},'deepseek-r1':{name:'DeepSeek R1',ctx:'64K',input:0.55,output:2.19,best:'Advanced reasoning',s:94}};const scores={};const desc_text=desc.toLowerCase();if(desc_text.match(/coding|code|debug|program|function|script/)){Object.assign(scores,{'gpt-4o':85,'claude-3-5-sonnet':90,'deepseek-v3':88,'o1-preview':95,'gpt-4o-mini':70});}else if(desc_text.match(/writing|blog|article|content/)){Object.assign(scores,{'claude-3-5-sonnet':95,'gpt-4o':88,'gemini-1-5-flash':75});}else if(desc_text.match(/reason|math|science|complex/)){Object.assign(scores,{'o1-preview':98,'deepseek-r1':94,'claude-3-5-sonnet':92,'claude-3-opus':95});}else if(desc_text.match(/fast|quick|simple/)){Object.assign(scores,{'gemini-2-0-flash':85,'gpt-4o-mini':80,'claude-3-haiku':78,'gemini-1-5-flash':80});}else if(desc_text.match(/budget|cheap|cost/)){Object.assign(scores,{'gemini-2-0-flash':90,'deepseek-v3':85,'gpt-4o-mini':80,'gemini-1-5-flash':82});}else if(desc_text.match(/long|document|pdf|book/)){Object.assign(scores,{'gemini-1-5-pro':92,'claude-3-5-sonnet':90,'gemini-2-0-flash':78});}else if(desc_text.match(/vision|image|photo|visual/)){Object.assign(scores,{'gpt-4o':90,'claude-3-5-sonnet':92,'gemini-1-5-pro':88});}else{Object.assign(scores,{'gpt-4o':88,'claude-3-5-sonnet':90,'gpt-4o-mini':72});}const results=Object.entries(scores).map(([k,sc])=>{let finalScore=sc;if(priority==='cost'){const d=models[k].input;finalScore=sc*0.3+(100-d/15*100)*0.7;}else if(priority==='quality'){finalScore=sc+(100-models[k].input)*0.1;}return{...models[k],score:finalScore};});results.sort((a,b)=>b.score-a.score);if(results.length===0)return;document.getElementById('result').style.display='block';document.getElementById('winnerName').textContent=results[0].name;document.getElementById('winnerReason').textContent=results[0].best;const altDiv=document.getElementById('alts');altDiv.innerHTML='<div style="color:#888;font-size:0.9rem;margin-bottom:10px">Other good options:</div>';results.slice(1,4).forEach((r,i)=>{altDiv.innerHTML+=`<div class="alt"><div class="rank">#${i+2}</div><div class="info"><div class="name">${r.name}</div><div class="price">${r.ctx} · $${r.input}/$${r.output} per 1M tokens</div><div style="color:#888;font-size:0.8rem;margin-top:3px">${r.best}</div></div><div class="badge">Score: ${r.score.toFixed(0)}</div></div>`;});}</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
