t-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🖨️ Image DPI / Print Calculator</h1><p class="subtitle">Calculate print size and check if your image is suitable for printing.</p><div class="card"><div class="input-row"><input type="number" id="w" placeholder="Width (px)" oninput="calc()"><input type="number" id="h" placeholder="Height (px)" oninput="calc()"></div><input type="number" id="dpi" placeholder="Target DPI (default: 300)" value="300" oninput="calc()"><div class="result-box" id="result"><div class="result-row"><span class="label">Print Size at 300 DPI</span><span class="val" id="r300">-</span></div><div class="result-row"><span class="label">Print Size at 150 DPI</span><span class="val" id="r150">-</span></div><div class="result-row"><span class="label">Print Size at 72 DPI</span><span class="val" id="r72">-</span></div><div class="result-row"><span class="label">Total Megapixels</span><span class="val" id="rMP">-</span></div></div><div class="quality" id="quality"></div><div class="input-row" style="margin-top:15px"><div><strong style="color:#888">Common Sizes:</strong></div><button class="btn" onclick="setSize(10,15)">4×6"</button><button class="btn" onclick="setSize(20,25)">8×10"</button><button class="btn" onclick="setSize(30,40)">12×16"</button><button class="btn" onclick="setSize(50,50)">20×20"</button></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function fmt(inches){const feet=Math.floor(inches/12);const rem=inches%12;if(feet>0)return `${feet}' ${rem.toFixed(1)}" (${(inches*2.54).toFixed(1)} cm)`;return `${rem.toFixed(1)}" (${(inches*2.54).toFixed(1)} cm)`;}function calc(){const w=parseFloat(document.getElementById('w').value)||0;const h=parseFloat(document.getElementById('h').value)||0;const dpi=parseFloat(document.getElementById('dpi').value)||300;if(!w||!h)return;document.getElementById('r300').textContent=`${(w/300).toFixed(1)}" × ${(h/300).toFixed(1)}" (${fmt(w/300)} × ${fmt(h/300)})`;document.getElementById('r150').textContent=`${(w/150).toFixed(1)}" × ${(h/150).toFixed(1)}" (${fmt(w/150)} × ${fmt(h/150)})`;document.getElementById('r72').textContent=`${(w/72).toFixed(1)}" × ${(h/72).toFixed(1)}" (${fmt(w/72)} × ${fmt(h/72)})`;document.getElementById('rMP').textContent=`${((w*h)/1000000).toFixed(1)} MP`;const targetW=w/dpi;const targetH=h/dpi;const qualityEl=document.getElementById('quality');if(dpi>=300){qualityEl.textContent=`✅ Great for print! ${targetW.toFixed(1)}" × ${targetH.toFixed(1)}" at ${dpi} DPI`;qualityEl.className='quality q-good';}else if(dpi>=150){qualityEl.textContent=`⚠️ Good for web print. Better at 300 DPI.`;qualityEl.className='quality q-ok';}else{qualityEl.textContent=`❌ Low resolution. Will appear pixelated when printed.`;qualityEl.className='quality q-bad';}}function setSize(wIn,hIn){const dpi=parseFloat(document.getElementById('dpi').value)||300;document.getElementById('w').value=Math.round(wIn*dpi);document.getElementById('h').value=Math.round(hIn*dpi);calc();}</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
