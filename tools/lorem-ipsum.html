    <div class="container">

        <h1>📝 Lorem Ipsum Generator</h1>
        <p class="subtitle">Generate placeholder text for your designs and mockups. Free & instant.</p>
        <div class="card">
            <div class="options">
                <label>Count<input type="number" id="count" value="5" min="1" max="100"></label>
                <label>Type<select id="type"><option value="paragraphs">Paragraphs</option><option value="sentences">Sentences</option><option value="words">Words</option></select></label>
                <label style="justify-content:flex-end;"><button class="btn" onclick="generate()">⚡ Generate</button></label>
            </div>
            <div class="output" id="output" style="display:none;"></div>
            <button class="btn" id="copyBtn" style="display:none;margin-top:15px;" onclick="copy()">📋 Copy to Clipboard</button>
        </div>

    <script>
        const lorem = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.".split(' ');
        let generatedText = '';
        function generate() {
            const count = parseInt(document.getElementById('count').value);
            const type = document.getElementById('type').value;
            let result = '';
            if (type === 'words') {
                result = lorem.slice(0, count).join(' ');
            } else if (type === 'sentences') {
                const sent = lorem.join(' ') + '. ';
                result = Array(count).fill(sent).join('\n\n');
            } else {
                const para = lorem.join(' ') + '. ';
                result = Array(count).fill(para).join('\n\n');
            }
            generatedText = result;
            const out = document.getElementById('output');
            out.textContent = result;
            out.style.display = 'block';
            document.getElementById('copyBtn').style.display = 'inline-block';
        }
        function copy() { navigator.clipboard.writeText(generatedText); alert('Copied!'); }
    </script>
