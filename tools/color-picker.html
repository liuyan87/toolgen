<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - ToolGen</title>
    <meta name="description" content="Pick colors and get HEX, RGB, HSL codes instantly. Free online color picker.">
    <link rel="canonical" href="https://toolgen.xyz/tools/color-picker.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        input[type="color"] { width: 100%; height: 80px; border: none; border-radius: 12px; cursor: pointer; background: none; }
        .code-box { background: #0a0a0a; border: 2px solid #333; border-radius: 10px; padding: 15px; font-family: 'Courier New', monospace; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .code-box span { font-size: 1.1rem; }
        .btn { display: inline-block; padding: 10px 24px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎨 Color Picker</h1>
        <p class="subtitle">Pick any color and get HEX, RGB, and HSL codes instantly.</p>
        <div class="card">
            <input type="color" id="colorPicker" value="#667eea" onchange="updateColors()">
            <div class="code-box"><span>HEX</span><span id="hex">#667EEA</span><button class="btn" onclick="copy('hex')">📋 Copy</button></div>
            <div class="code-box"><span>RGB</span><span id="rgb">rgb(102, 126, 234)</span><button class="btn" onclick="copy('rgb')">📋 Copy</button></div>
            <div class="code-box"><span>HSL</span><span id="hsl">hsl(229, 76%, 66%)</span><button class="btn" onclick="copy('hsl')">📋 Copy</button></div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        function updateColors() {
            const hex = document.getElementById('colorPicker').value;
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            document.getElementById('hex').textContent = hex.toUpperCase();
            document.getElementById('rgb').textContent = `rgb(${r}, ${g}, ${b})`;
            const max = Math.max(r,g,b)/255, min = Math.min(r,g,b)/255;
            const l = (max+min)/2;
            let h=0, s=0;
            if (max !== min) { const d = max - min; s = l > 0.5 ? d/(2-max-min) : d/(max+min); }
            document.getElementById('hsl').textContent = `hsl(${h}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;
        }
        function copy(id) { navigator.clipboard.writeText(document.getElementById(id).textContent); }
        updateColors();
    </script>
</body>
</html>
