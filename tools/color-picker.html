<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Color Picker - ToolGen</title>
    <meta name="description" content="Pick any color and get HEX, RGB, HSL values. Free online color picker with color codes for web design and graphics.">
    <meta name="keywords" content="color picker, color codes, hex color, rgb color, hsl color, color converter, web colors">
    <link rel="canonical" href="https://toolgen.xyz/tools/color-picker.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .color-preview { width: 100%; height: 150px; border-radius: 12px; background: #667eea; margin-bottom: 20px; border: 2px solid #333; }
        input[type="color"] { width: 100%; height: 60px; border: none; background: none; cursor: pointer; margin-bottom: 20px; }
        input[type="range"] { width: 100%; margin-bottom: 5px; }
        .code-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .code-box { background: #0a0a0a; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .code-label { color: #888; font-size: 0.85rem; }
        .code-value { font-family: monospace; color: #667eea; font-weight: 700; cursor: pointer; }
        .copy-msg { color: #f59e0b; font-size: 0.8rem; margin-top: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎨 Color Picker</h1>
        <p class="subtitle">Pick any color and get HEX, RGB, HSL codes instantly.</p>

        <div class="card">
            <input type="color" id="colorPicker" value="#667eea" oninput="update()">

            <div class="code-grid">
                <div class="code-box">
                    <span class="code-label">HEX</span>
                    <span class="code-value" id="hexVal" onclick="copy('hex')">#667EEA</span>
                </div>
                <div class="code-box">
                    <span class="code-label">RGB</span>
                    <span class="code-value" id="rgbVal" onclick="copy('rgb')">rgb(102, 126, 234)</span>
                </div>
                <div class="code-box">
                    <span class="code-label">HSL</span>
                    <span class="code-value" id="hslVal" onclick="copy('hsl')">hsl(229, 76%, 66%)</span>
                </div>
                <div class="code-box">
                    <span class="code-label">HSV</span>
                    <span class="code-value" id="hsvVal" onclick="copy('hsv')">hsv(229, 56%, 92%)</span>
                </div>
            </div>
            <p class="copy-msg" id="copyMsg"></p>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/color-picker.html">Color Picker</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function update() {
            const c = document.getElementById('colorPicker').value;
            document.querySelector('.color-preview').style.background = c;

            const r = parseInt(c.substr(1,2), 16);
            const g = parseInt(c.substr(3,2), 16);
            const b = parseInt(c.substr(5,2), 16);

            document.getElementById('hexVal').textContent = c.toUpperCase();
            document.getElementById('rgbVal').textContent = `rgb(${r}, ${g}, ${b})`;

            const max = Math.max(r,g,b)/255, min = Math.min(r,g,b)/255;
            const l = (max+min)/2;
            let h=0, s=0;
            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2-max-min) : d / (max+min);
                const rr=r/255, gg=g/255, bb=b/255;
                if (max===rr) h = ((gg-bb)/d + (gg<bb?6:0))/6;
                else if (max===gg) h = ((bb-rr)/d + 2)/6;
                else h = ((rr-gg)/d + 4)/6;
            }
            document.getElementById('hslVal').textContent = `hsl(${Math.round(h*360)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;

            const v = max;
            const sv = max === 0 ? 0 : (max-min)/max;
            document.getElementById('hsvVal').textContent = `hsv(${Math.round(h*360)}, ${Math.round(sv*100)}%, ${Math.round(v*100)}%)`;
        }

        function copy(type) {
            const map = { hex: 'hexVal', rgb: 'rgbVal', hsl: 'hslVal', hsv: 'hsvVal' };
            navigator.clipboard.writeText(document.getElementById(map[type]).textContent);
            document.getElementById('copyMsg').textContent = '✓ Copied!';
            setTimeout(() => document.getElementById('copyMsg').textContent = '', 2000);
        }

        update();
    </script>
</body>
</html>
