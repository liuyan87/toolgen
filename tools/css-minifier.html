<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free CSS Minifier - ToolGen</title>
    <meta name="description" content="Minify and compress CSS code instantly. Reduce CSS file size by up to 70%. Free online CSS minifier for web developers.">
    <meta name="keywords" content="css minifier, compress css, minify css, css compressor, css optimizer, reduce css file size">
    <link rel="canonical" href="https://toolgen.xyz/tools/css-minifier.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #22c55e; font-family: monospace; font-size: 0.85rem; outline: none; margin-bottom: 15px; resize: vertical; min-height: 300px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        .stats { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .stat { background: #0a0a0a; padding: 10px 20px; border-radius: 8px; }
        .stat .label { color: #888; font-size: 0.8rem; }
        .stat .value { color: #22c55e; font-weight: 700; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🎨 CSS Minifier</h1>
        <p class="subtitle">Minify and compress CSS code. Reduce file size by up to 70% for faster page loads.</p>

        <div class="card">
            <label>Paste your CSS code:</label>
            <textarea id="input" placeholder="/* Paste your CSS here */&#10;.class {&#10;  color: red;&#10;  margin: 10px;&#10;  padding: 5px;&#10;}" oninput="minify()"></textarea>

            <button class="btn" onclick="minify()">Minify CSS</button>
            <button class="btn" style="background:#333;" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="stats" id="stats">
                <div class="stat"><span class="label">Original:</span> <span class="value" id="originalSize">0</span> bytes</div>
                <div class="stat"><span class="label">Minified:</span> <span class="value" id="minifiedSize">0</span> bytes</div>
                <div class="stat"><span class="label">Saved:</span> <span class="value" id="savedSize">0</span> bytes (<span id="savedPct">0</span>%)</div>
            </div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/css-minifier.html">CSS Minifier</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function minify() {
            const input = document.getElementById('input').value;
            const originalSize = new Blob([input]).size;

            // Simple CSS minification
            let minified = input
                .replace(/\/\*[\s\S]*?\*\//g, '') // remove comments
                .replace(/\s+/g, ' ')               // collapse whitespace
                .replace(/\s*{\s*/g, '{')           // remove space around {
                .replace(/\s*;\s*/g, ';')            // remove space around ;
                .replace(/\s*:\s*/g, ':')          // remove space around :
                .replace(/;\}/g, '}')               // remove last ; before }
                .trim();

            const minifiedSize = new Blob([minified]).size;
            const saved = originalSize - minifiedSize;
            const pct = originalSize > 0 ? Math.round(saved / originalSize * 100) : 0;

            document.getElementById('originalSize').textContent = originalSize;
            document.getElementById('minifiedSize').textContent = minifiedSize;
            document.getElementById('savedSize').textContent = saved;
            document.getElementById('savedPct').textContent = pct;

            document.getElementById('input').value = minified;
        }

        function copy() {
            const text = document.getElementById('input').value;
            if (text) navigator.clipboard.writeText(text);
        }

        function clearText() {
            document.getElementById('input').value = '';
        }
    </script>
</body>
</html>
