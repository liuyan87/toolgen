<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Hash Generator (MD5, SHA) - ToolGen</title>
    <meta name="description" content="Generate MD5, SHA-1, SHA-256, SHA-512 hashes from any text. Free online hash generator.">
    <meta name="keywords" content="hash generator, md5, sha1, sha256, sha512, hash checksum">
    <link rel="canonical" href="https://toolgen.xyz/tools/hash-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; font-family: monospace; outline: none; margin-bottom: 15px; resize: vertical; min-height: 120px; }
        textarea:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .hash-result { background: #0a0a0a; border: 2px solid #333; border-radius: 10px; padding: 15px; margin: 10px 0; font-family: monospace; word-break: break-all; font-size: 0.9rem; color: #667eea; }
        .hash-result .label { color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔏 Hash Generator</h1>
        <p class="subtitle">Generate MD5, SHA-1, SHA-256, SHA-512 hashes from any text. Free & secure.</p>
        <div class="card">
            <label>Enter text to hash</label>
            <textarea id="input" placeholder="Type or paste your text here..."></textarea>
            <button class="btn" onclick="generateHashes()">🔄 Generate Hashes</button>
            <button class="btn" onclick="copyAll()">📋 Copy All</button>
            <div id="results"></div>
        </div>
    </div>
    <footer><p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        function generateHashes() {
            const text = document.getElementById('input').value;
            if (!text) return;
            const results = document.getElementById('results');
            const hashes = {
                'MD5': CryptoJS.MD5(text).toString(),
                'SHA-1': CryptoJS.SHA1(text).toString(),
                'SHA-256': CryptoJS.SHA256(text).toString(),
                'SHA-512': CryptoJS.SHA512(text).toString(),
                'SHA-3 (256)': CryptoJS.SHA3(text, { outputLength: 256 }).toString()
            };
            results.innerHTML = Object.entries(hashes).map(([alg, hash]) => `
                <div class="hash-result">
                    <div class="label">${alg}</div>
                    ${hash}
                </div>
            `).join('');
        }
        function copyAll() {
            const hashes = document.querySelectorAll('.hash-result');
            const text = Array.from(hashes).map(h => h.textContent).join('\n');
            navigator.clipboard.writeText(text);
        }
    </script>
</body>
</html>
