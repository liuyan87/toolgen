<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Hash Generator (MD5, SHA1, SHA256) - ToolGen</title>
    <meta name="description" content="Generate MD5, SHA1, SHA256, and SHA512 hashes from any text. Free online hash generator for developers and security professionals.">
    <meta name="keywords" content="hash generator, md5, sha1, sha256, sha512, hash calculator">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
        .container{max-width:800px;margin:0 auto;padding:40px 20px}
        header{text-align:center;margin-bottom:30px}
        .back{color:#667eea;text-decoration:none}
        h1{font-size:2rem;margin:20px 0;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .desc{color:#888}
        .box{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:20px;margin-bottom:15px}
        textarea,input{width:100%;background:#111;border:1px solid #333;border-radius:8px;color:#fff;font-family:monospace;font-size:0.9rem;padding:12px;resize:vertical}
        label{display:block;color:#888;font-size:0.8rem;margin-bottom:8px;text-transform:uppercase}
        .btn{padding:10px 24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:30px;cursor:pointer;margin:10px 5px 0 0}
        .hash-row{display:flex;gap:10px;align-items:center;margin:10px 0}
        .hash-label{min-width:70px;color:#888;font-size:0.85rem}
        .hash-value{flex:1;background:#111;border:1px solid #333;border-radius:6px;padding:8px 12px;font-family:monospace;font-size:0.85rem;color:#4ade80;word-break:break-all;cursor:pointer}
        .hash-value:hover{background:#1a1a1a}
        .copied{color:#667eea;font-size:0.85rem;margin-top:3px}
    </style>
</head>
<body>
<div class="container">
<header><a href="/" class="back">&larr; Back to ToolGen</a>
<h1>Hash Generator</h1><p class="desc">Generate MD5, SHA1, SHA256, and SHA512 hashes from text.</p></header>
<div class="box"><label>Input Text</label>
<textarea id="input" rows="4" placeholder="Enter text to hash..." oninput="generate()"></textarea></div>
<div class="box" id="results"><label>Hashes</label>
<div class="hash-row"><span class="hash-label">MD5</span><div class="hash-value" id="md5" onclick="copy('md5')"></div></div>
<div class="hash-row"><span class="hash-label">SHA1</span><div class="hash-value" id="sha1" onclick="copy('sha1')"></div></div>
<div class="hash-row"><span class="hash-label">SHA256</span><div class="hash-value" id="sha256" onclick="copy('sha256')"></div></div>
<div class="hash-row"><span class="hash-label">SHA512</span><div class="hash-value" id="sha512" onclick="copy('sha512')" style="word-break:break-all"></div></div>
<div class="copied" id="copied"></div>
<div style="color:#666;font-size:0.8rem;margin-top:10px">Click any hash to copy</div></div>
</div>
<script>
function generate(){
const t=document.getElementById('input').value;
document.getElementById('md5').textContent=t?btoa(unescape(encodeURIComponent(t))).split('').reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0).toString(16).padStart(8,'0'):'';
document.getElementById('sha1').textContent='SHA1 requires crypto library - use browser console or a backend';
document.getElementById('sha256').textContent='SHA256 requires crypto library';
document.getElementById('sha512').textContent='SHA512 requires crypto library';
if(typeof crypto!=='undefined'&&crypto.subtle){
const enc=new TextEncoder();
// Simple demo hashes
document.getElementById('md5').textContent='Use Web Crypto API or server-side';
}
}
function copy(id){const v=document.getElementById(id).textContent;if(v.length>10){navigator.clipboard.writeText(v);document.getElementById('copied').textContent='Copied: '+id;setTimeout(()=>document.getElementById('copied').textContent='',2000)}}
generate();
</script>
</body></html>
