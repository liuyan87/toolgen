<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Prompt Version Control - ToolGen</title><meta name="description" content="Version control your AI prompts like code. Track experiments, compare results, and rollback."><link rel="canonical" href="https://toolgen.xyz/tools/prompt-version-control.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:900px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}textarea,input,select{width:100%;padding:12px;border-radius:8px;border:2px solid #333;background:#0a0a0a;color:#fff;font-size:0.95rem;outline:none;margin-bottom:12px}textarea{min-height:100px;resize:vertical}textarea:focus,input:focus,select:focus{border-color:#667eea}.version-item{display:flex;gap:15px;align-items:flex-start;padding:15px;background:#0a0a0a;border-radius:10px;margin-bottom:8px;border:2px solid transparent;cursor:pointer}.version-item:hover,.version-item.selected{border-color:#667eea}.version-item.current{border-color:#4ade80}.v-num{font-weight:700;color:#667eea;font-size:0.9rem;min-width:60px}.v-info{flex:1}.v-meta{color:#888;font-size:0.8rem;margin-bottom:3px}.v-prompt{color:#ccc;font-size:0.85rem;margin-top:5px;font-family:monospace;max-height:60px;overflow:hidden;white-space:pre-wrap}.v-score{text-align:right;min-width:80px}.v-score .score{font-size:1.5rem;font-weight:800;color:#4ade80}.diff{background:#0a0a0a;border-radius:10px;padding:15px;margin:15px 0;font-family:monospace;font-size:0.8rem;white-space:pre;max-height:300px;overflow:auto}.code-output{background:#0a0a0a;border-radius:10px;padding:15px;font-family:monospace;font-size:0.8rem;color:#667eea;white-space:pre;max-height:300px;overflow:auto;margin-top:15px}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px 5px 0 0}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>📜 Prompt Version Control</h1><p class="subtitle">Version control your AI prompts. Track experiments, compare versions, and rollback.</p><div class="card"><h3 style="color:#667eea;margin-bottom:15px">Current Prompt</h3><textarea id="currentPrompt">You are a helpful customer support agent. Be friendly, professional, and resolve issues quickly. Always end with "How else can I help?"</textarea><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px"><input type="text" id="commitMsg" placeholder="Version message..."><select id="modelUsed"><option>GPT-4o</option><option>Claude 3.5 Sonnet</option></select><input type="number" id="versionScore" value="85"></div><button class="btn" onclick="commitVersion()">📝 Commit Version</button><button class="btn" onclick="generateCode()">⚡ Generate Code</button></div><div class="card"><h3 style="color:#667eea;margin-bottom:15px">Version History</h3><div id="versionList"></div></div><div class="code-output" id="codeOutput"></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let versions=[];function commitVersion(){const prompt=document.getElementById('currentPrompt').value;const msg=document.getElementById('commitMsg').value||'Update';const model=document.getElementById('modelUsed').value;const score=parseInt(document.getElementById('versionScore').value)||0;versions.unshift({num:versions.length+1,prompt,msg,model,score,date:new Date().toLocaleString()});renderVersions();document.getElementById('commitMsg').value='';}function renderVersions(){document.getElementById('versionList').innerHTML=versions.map((v,i)=>`<div class="version-item ${i===0?'current':''}"><div class="v-num">v${v.num}</div><div class="v-info"><div class="v-meta">${v.date} · ${v.model} · ${v.msg}</div><div class="v-prompt">${v.prompt}</div></div><div class="v-score"><div class="score">${v.score}</div>/100</div></div>`).join('')||'<div style="color:#888;text-align:center;padding:20px">No versions yet.</div>';}function generateCode(){const code=`# Prompt Version Control - ToolGen
from dataclasses import dataclass
from datetime import datetime

@dataclass
class PromptVersion:
    version: int
    prompt: str
    message: str
    model: str
    score: float
    timestamp: str

class PromptVersionControl:
    def __init__(self, name: str):
        self.name = name
        self.versions = []
    
    def commit(self, prompt: str, message: str, model: str, score: float = 0):
        v = PromptVersion(
            version=len(self.versions) + 1,
            prompt=prompt, message=message, model=model,
            score=score, timestamp=datetime.now().isoformat()
        )
        self.versions.append(v)
        return v
    
    def checkout(self, version: int) -> str:
        for v in self.versions:
            if v.version == version:
                return v.prompt
        raise ValueError(f"Version {version} not found")
    
    def diff(self, v1: int, v2: int) -> str:
        p1 = next((v for v in self.versions if v.version==v1), None)
        p2 = next((v for v in self.versions if v.version==v2), None)
        if not p1 or not p2: raise ValueError("Version not found")
        lines1, lines2 = p1.prompt.split('\n'), p2.prompt.split('\n')
        diff = []
        for a, b in zip(lines1, lines2):
            if a != b: diff.append(f"-{a}\n+{b}")
            else: diff.append(a)
        return '\n'.join(diff)

pvc = PromptVersionControl("support_agent")
pvc.commit("You are a helpful assistant.", "initial", "gpt-4o", 75)
pvc.commit("You are a helpful assistant. Be friendly.", "added tone", "gpt-4o", 85)`;document.getElementById('codeOutput').textContent=code;}versions=[{num:2,prompt:'You are a helpful customer support agent. Be friendly, professional, and resolve issues quickly. Always end with "How else can I help?"',msg:'added closing',model:'GPT-4o',score:88,date:'2026-04-28 10:30'},{num:1,prompt:'You are a helpful customer support agent. Be friendly and professional.',msg:'initial',model:'GPT-4o',score:72,date:'2026-04-28 09:15'}];renderVersions();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
