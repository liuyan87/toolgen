<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG/JPG Converter - ToolGen</title>
    <meta name="description" content="Convert images between PNG, JPG, WEBP formats instantly. Free online image converter.">
    <link rel="canonical" href="https://toolgen.xyz/tools/png-converter.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; text-align: center; }
        .drop-zone { border: 2px dashed #667eea; border-radius: 16px; padding: 60px 20px; cursor: pointer; }
        .drop-zone:hover { background: rgba(102,126,234,0.1); }
        input[type="file"] { display: none; }
        select { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; margin-bottom: 15px; }
        .btn { display: inline-block; padding: 14px 36px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔄 PNG/JPG Converter</h1>
        <p class="subtitle">Convert images between PNG, JPG, and WEBP formats instantly.</p>
        <div class="card">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size: 3rem;">🖼️</div>
                <p style="color: #888; margin-top: 15px;">Click or drag image to upload</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="convertImage(this.files[0])">
            <select id="format">
                <option value="image/jpeg">Convert to JPG</option>
                <option value="image/png">Convert to PNG</option>
                <option value="image/webp">Convert to WEBP</option>
            </select>
            <a class="btn" id="downloadBtn" download style="display:none;">⬇️ Download</a>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p>
    </footer>
    <script>
        function convertImage(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    const format = document.getElementById('format').value;
                    const ext = format === 'image/jpeg' ? 'jpg' : format === 'image/png' ? 'png' : 'webp';
                    const converted = canvas.toDataURL(format, 0.92);
                    const a = document.getElementById('downloadBtn');
                    a.href = converted;
                    a.download = file.name.replace(/\.[^.]+$/, '.' + ext);
                    a.style.display = 'inline-block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
