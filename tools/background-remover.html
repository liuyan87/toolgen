    <script>
        function removeBg(file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('resultCanvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Draw image
                    ctx.drawImage(img, 0, 0);
                    
                    // Get image data
                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;
                    
                    // Simple background removal (works best for solid backgrounds)
                    // Get corner color sample
                    const sampleSize = 10;
                    let rSum=0, gSum=0, bSum=0, count=0;
                    for (let y = 0; y < sampleSize; y++) {
                        for (let x = 0; x < sampleSize; x++) {
                            const idx = (y * canvas.width + x) * 4;
                            rSum += data[idx]; gSum += data[idx+1]; bSum += data[idx+2]; count++;
                        }
                    }
                    const bgR = rSum/count, bgG = gSum/count, bgB = bSum/count;
                    
                    // Remove similar colors (simple approach)
                    const threshold = 50;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i], g = data[i+1], b = data[i+2];
                        const dist = Math.sqrt((r-bgR)**2 + (g-bgG)**2 + (b-bgB)**2);
                        if (dist < threshold) {
                            data[i+3] = 0; // transparent
                        }
                    }
                    
                    ctx.putImageData(imgData, 0, 0);
                    
                    document.getElementById('originalImg').src = e.target.result;
                    document.getElementById('preview').style.display = 'flex';
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                    
                    // Set download
                    document.getElementById('downloadBtn').href = canvas.toDataURL('image/png');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    </script>
