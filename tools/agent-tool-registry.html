<!DOCTYPE html>

-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔧 Agent Tool Registry Builder</h1><p class="subtitle">Build a complete tool registry for your AI agent.</p><div class="card"><h3 style="color:#667eea;margin-bottom:15px">Tools</h3><div id="tools"></div><div onclick="addTool()" style="background:#0a0a0a;border:2px dashed #667eea;border-radius:12px;padding:15px;text-align:center;cursor:pointer;color:#667eea;font-size:0.9rem;margin-bottom:15px">+ Add Tool</div><button class="btn" onclick="generateCode()">⚡ Generate Registry Code</button><div class="code-output" id="codeOutput"></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>let tools=[];let toolCount=0;function addTool(){toolCount++;tools.push({id:toolCount,name:'get_weather',description:'Get weather for a city',params:[{name:'city',type:'string'}]});renderTools();}function removeTool(id){tools=tools.filter(t=>t.id!==id);renderTools();}function renderTools(){document.getElementById('tools').innerHTML=tools.map(t=>`<div class="tool-item"><div class="tool-header"><input type="text" value="${t.name}" style="width:200px;margin:0" onchange="updateTool(${t.id},'name',this.value)"><div class="tool-actions"><button onclick="addParam(${t.id})">+ Param</button><button onclick="removeTool(${t.id})" style="background:#ef4444">Delete</button></div></div><input type="text" value="${t.description}" placeholder="Tool description" style="margin-bottom:10px" onchange="updateTool(${t.id},'description',this.value)"><div>${t.params.map(p=>`<div style="background:#1a1a1a;border-radius:8px;padding:8px;margin:5px 0;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center"><input type="text" value="${p.name}" style="margin:0;width:100px" onchange="updateParam(${t.id},${p.name},'name',this.value)"><select style="margin:0;width:100px"><option>string</option><option>integer</option><option>number</option><option>boolean</option></select><button onclick="removeParam(${t.id},'${p.name}')" style="background:#ef4444;border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer">×</button></div>`).join('')}</div></div>`).join('');}function updateTool(id,field,val){const t=tools.find(t=>t.id===id);if(t)t[field]=val;}function updateParam(tid,pname,field,val){const t=tools.find(t=>t.id===tid);if(t){const p=t.params.find(p=>p.name===pname);if(p)p[field]=val;}}function addParam(tid){const t=tools.find(t=>t.id===tid);if(t)t.params.push({name:'param_'+t.params.length,type:'string'});renderTools();}function removeParam(tid,pname){const t=tools.find(t=>t.id===tid);if(t)t.params=t.params.filter(p=>p.name!==pname);renderTools();}function generateCode(){let code='# Tool Registry
';tools.forEach(t=>{code+=`def ${t.name}(${t.params.map(p=>p.name).join(', ')}):
    """${t.description}"""
    pass

`;});code+='registry = '+(JSON.stringify(tools.map(t=>({name:t.name,description:t.description,parameters:{type:'object',properties:Object.fromEntries(t.params.map(p=>[p.name,{type:p.type}])),required:t.params.map(p=>p.name)}})),null,2));document.getElementById('codeOutput').textContent=code;}addTool();addTool();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
