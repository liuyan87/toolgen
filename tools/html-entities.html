<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free HTML Entities Reference - ToolGen</title><meta name="description" content="Complete HTML entities reference chart. Find &copy; &reg; &trade; and special characters."><meta name="keywords" content="html entities, entity codes, special characters, symbols"><link rel="canonical" href="https://toolgen.xyz/tools/html-entities.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}.entity{padding:15px;background:#1a1a1a;border:1px solid #333;border-radius:8px;cursor:pointer;transition:border-color 0.2s;display:flex;flex-direction:column;align-items:center;text-align:center}.entity:hover{border-color:#667eea}.entity .sym{font-size:2rem;margin-bottom:5px}.entity .code{color:#667eea;font-family:monospace;font-size:0.8rem}.entity .name{color:#888;font-size:0.8rem;margin-top:3px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🏷️ HTML Entities</h1><p class="subtitle">Click any entity to copy its code to clipboard.</p><div class="grid" id="grid"></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const entities=[['&amp;','&amp;amp;','ampersand'],['&lt;','&amp;lt;','less than'],['&gt;','&amp;gt;','greater than'],['&quot;','&amp;quot;','quotation mark'],["'",'&apos;','apostrophe'],['&nbsp;','&amp;nbsp;','non-breaking space'],['&copy;','&amp;copy;','copyright'],['&reg;','&amp;reg;','registered'],['&trade;','&amp;trade;','trademark'],['&hellip;','&amp;hellip;','ellipsis'],['&ndash;','&amp;ndash;','en dash'],['&mdash;','&amp;mdash;','em dash'],['&lsquo;','&amp;lsquo;','left single quote'],['&rsquo;','&amp;rsquo;','right single quote'],['&ldquo;','&amp;ldquo;','left double quote'],['&rdquo;','&amp;rdquo;','right double quote'],['&laquo;','&amp;laquo;','guillemet left'],['&raquo;','&amp;raquo;','guillemet right'],['&cent;','&amp;cent;','cent'],['&pound;','&amp;pound;','pound'],['&euro;','&amp;euro;','euro'],['&yen;','&amp;yen;','yen'],['&sect;','&amp;sect;','section'],['&para;','&amp;para;','pilcrow'],['&deg;','&amp;deg;','degree'],['&plusmn;','&amp;plusmn;','plus-minus'],['&frac14;','&amp;frac14;','quarter'],['&frac12;','&amp;frac12;','half'],['&frac34;','&amp;frac34;','three quarters'],['&times;','&amp;times;','multiplication'],['&divide;','&amp;divide;','division'],['&pi;','&amp;pi;','pi'],['&star;','&amp;star;','star'],['&bull;','&amp;bull;','bullet'],['&larr;','&amp;larr;','left arrow'],['&rarr;','&amp;rarr;','right arrow'],['&uarr;','&amp;uarr;','up arrow'],['&darr;','&amp;darr;','down arrow'],['&harr;','&amp;harr;','left right arrow']];const grid=document.getElementById('grid');entities.forEach(([sym,code,name])=>{const el=document.createElement('div');el.className='entity';el.innerHTML=`<span class="sym">${sym}</span><span class="code">${code}</span><span class="name">${name}</span>`;el.onclick=()=>{navigator.clipboard.writeText(code);el.style.borderColor='#4ade80';setTimeout(()=>el.style.borderColor='',1000);};grid.appendChild(el);});</script></body></html>
