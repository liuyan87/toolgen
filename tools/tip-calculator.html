late tips and split bills easily.</p><div class="card"><label>Bill Amount ($)</label><input type="number" id="bill" value="50" oninput="calc()"><label>Tip %</label><div class="tip-presets"><div class="preset active" onclick="setTip(10)">10%</div><div class="preset" onclick="setTip(15)">15%</div><div class="preset" onclick="setTip(18)">18%</div><div class="preset" onclick="setTip(20)">20%</div><div class="preset" onclick="setTip(25)">25%</div></div><input type="number" id="tipPct" value="18" min="0" max="100" oninput="calc()"><label>Split Between</label><input type="number" id="split" value="1" min="1" oninput="calc()"><div class="summary"><div>Tip: $<span id="tipAmt">0.00</span></div><div>Total: $<span id="total">0.00</span></div><div class="big">$<span id="perPerson">0.00</span>/person</div></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function setTip(p){document.getElementById('tipPct').value=p;document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));event.target.classList.add('active');calc();}function calc(){const bill=parseFloat(document.getElementById('bill').value)||0;const tip=parseFloat(document.getElementById('tipPct').value)||0;const split=parseInt(document.getElementById('split').value)||1;const tipAmt=bill*tip/100;const total=bill+tipAmt;const perPerson=total/split;document.getElementById('tipAmt').textContent=tipAmt.toFixed(2);document.getElementById('total').textContent=total.toFixed(2);document.getElementById('perPerson').textContent=perPerson.toFixed(2);}calc();</script><script src="https://pl29333664.profitablecpmratenetwork.com/14/bd/3e/14bd3e70ee1ef00b369d60928d7e3a03.js"></script>
