<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Slug Generator - ToolGen</title>
    <meta name="description" content="Generate URL slugs from any text. Create SEO-friendly URL slugs. Free online slug generator.">
    <meta name="keywords" content="slug generator, url slug, seo friendly url, create slug, blog slug">
    <link rel="canonical" href="https://toolgen.xyz/tools/slug-generator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        textarea { width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #667eea; font-size: 1.1rem; font-family: monospace; outline: none; margin-bottom: 15px; resize: vertical; min-height: 100px; }
        textarea:focus { border-color: #667eea; }
        .output-box { background: #0a0a0a; border-radius: 10px; padding: 20px; margin-top: 15px; font-size: 1.3rem; color: #22c55e; font-family: monospace; min-height: 60px; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: translateY(-2px); }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🔗 Slug Generator</h1>
        <p class="subtitle">Generate URL-friendly slugs for SEO and blog posts.</p>

        <div class="card">
            <label>Enter your title:</label>
            <textarea id="input" placeholder="My Amazing Blog Post Title!" oninput="generate()"></textarea>

            <button class="btn" onclick="copy()">📋 Copy</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

            <div class="output-box" id="output">Your slug will appear here...</div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/slug-generator.html">Slug Generator</a> - 150+ Free Tools</p>
    </footer>

    <script>
        function generate() {
            const text = document.getElementById('input').value.trim();
            if (!text) {
                document.getElementById('output').textContent = 'Your slug will appear here...';
                return;
            }
            const slug = text.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            document.getElementById('output').textContent = slug;
        }

        function copy() {
            const text = document.getElementById('output').textContent;
            if (text && text !== 'Your slug will appear here...') {
                navigator.clipboard.writeText(text);
            }
        }

        function clearText() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = 'Your slug will appear here...';
        }
    </script>
</body>
</html>
