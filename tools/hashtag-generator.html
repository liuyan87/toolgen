667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>#️⃣ Hashtag Generator</h1><p class="subtitle">Generate trending hashtags for Instagram, Twitter, and TikTok.</p><div class="card"><textarea id="input" placeholder="Enter your post content or keywords (e.g. travel photography sunset beach)..."></textarea><button class="btn" onclick="generate()">⚡ Generate Hashtags</button><button class="btn" onclick="copy()">📋 Copy All</button><button class="btn" onclick="clear()">🗑️ Clear</button><div class="hashtags" id="hashtags" onclick="copySingle(event)">Click generate to create hashtags...</div><div class="stats"><div class="stat"><div class="num" id="count">0</div><div class="label">Hashtags</div></div></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>const templates=['#','trending','viral','fyp','explore','instagood','photooftheday','love','beautiful','happy','fashion','followme','likeforlikes','photography','art','travel','nature','food','fitness','music','style','motivation','success','lifestyle','inspiration','quotes','motivationalquotes','business','entrepreneur','startup'];const modifiers=['daily','official','2026','best','top','real','world','global','hot','new','fresh','epic','lit','dope','cool','amazing','awesome','incredible','ultimate','mustsee'];function generate(){const text=document.getElementById('input').value.toLowerCase().trim();const words=text.match(/\b[a-z]{3,}\b/g)||[];const keywords=[...new Set(words)];const hashtags=keywords.map(w=>'#'+w);const trending=keywords.slice(0,5).map(w=>'#'+w+ modifiers[Math.floor(Math.random()*modifiers.length)]);const randomHashtags=[];while(randomHashtags.length<10){const t=templates[Math.floor(Math.random()*templates.length)];if(!randomHashtags.includes('#'+t))randomHashtags.push('#'+t);}const all=[...hashtags,...trending,...randomHashtags].slice(0,30);document.getElementById('hashtags').innerHTML=all.map(h=>`<span>${h}</span>`).join('');document.getElementById('count').textContent=all.length;}function copySingle(e){if(e.target.tagName==='SPAN'){navigator.clipboard.writeText(e.target.textContent);e.target.style.color='#4ade80';setTimeout(()=>e.target.style.color='#667eea',500);}}function copy(){navigator.clipboard.writeText(document.getElementById('hashtags').textContent);}function clear(){document.getElementById('input').value='';document.getElementById('hashtags').innerHTML='Click generate to create hashtags...';document.getElementById('count').textContent='0';}</script></body></html>
