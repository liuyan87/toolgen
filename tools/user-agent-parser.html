<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Free User Agent Parser - ToolGen</title><meta name="description" content="Parse and identify user agent strings. See browser, OS, and device info."><meta name="keywords" content="user agent, user agent parser, browser detection, ua parser"><link rel="canonical" href="https://toolgen.xyz/tools/user-agent-parser.html"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;line-height:1.6}.container{max-width:800px;margin:0 auto;padding:40px 20px}.back{color:#667eea;text-decoration:none;margin-bottom:30px;display:inline-block}h1{font-size:2rem;margin-bottom:10px}.subtitle{color:#888;margin-bottom:30px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:30px;margin-bottom:20px}textarea{width:100%;padding:14px;border-radius:10px;border:2px solid #333;background:#0a0a0a;color:#667eea;font-family:monospace;font-size:0.9rem;outline:none;resize:vertical;min-height:80px;margin-bottom:15px}textarea:focus{border-color:#667eea}.info{background:#0a0a0a;border-radius:8px;padding:15px;margin-top:15px}.info-row{display:flex;padding:10px 0;border-bottom:1px solid #333}.info-row:last-child{border-bottom:none}.info-row .label{min-width:120px;color:#888}.info-row .value{color:#667eea}.btn{display:inline-block;padding:12px 28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:25px;cursor:pointer;font-size:0.95rem;font-weight:600;margin:5px}footer{text-align:center;padding:40px 0;color:#666;font-size:0.9rem;border-top:1px solid #333;margin-top:40px}footer a{color:#667eea;text-decoration:none}</style></head><body><div class="container"><a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a><h1>🔎 User Agent Parser</h1><p class="subtitle">Parse user agent strings and identify browser, OS, and device.</p><div class="card"><textarea id="ua" placeholder="Paste user agent string or leave empty to use your current browser..."></textarea><button class="btn" onclick="parse()">🔎 Parse</button><button class="btn" onclick="detectMyUA()">📍 Detect My UA</button><div id="result" style="display:none"><div class="info"><div class="info-row"><span class="label">Browser</span><span class="value" id="rBrowser"></span></div><div class="info-row"><span class="label">OS</span><span class="value" id="rOS"></span></div><div class="info-row"><span class="label">Device</span><span class="value" id="rDevice"></span></div><div class="info-row"><span class="label">Engine</span><span class="value" id="rEngine"></span></div></div></div></div></div><footer><p>© 2026 ToolGen.xyz - <a href="https://toolgen.xyz/">Free Online Tools</a></p></footer><script>function parseUA(ua){const isMobile=/mobile|android|iphone|ipad|ipod/i.test(ua);const isBot=/bot|crawl|spider|slurp/i.test(ua);let browser='Unknown',os='Unknown';if(/edg\/([\d.]+)/i.test(ua))browser='Microsoft Edge '+ua.match(/edg\/([\d.]+)/i)[1];else if(/chrome\/([\d.]+)/i.test(ua)&&!/edge/i.test(ua))browser='Chrome '+ua.match(/chrome\/([\d.]+)/i)[1];else if(/firefox\/([\d.]+)/i.test(ua))browser='Firefox '+ua.match(/firefox\/([\d.]+)/i)[1];else if(/safari\/([\d.]+)/i.test(ua)&&!/chrome/i.test(ua))browser='Safari '+ua.match(/safari\/([\d.]+)/i)[1];else if(/opera|opr\//i.test(ua))browser='Opera';else if(/msie|trident/i.test(ua))browser='Internet Explorer';if(/windows nt 10/i.test(ua))os='Windows 10/11';else if(/windows nt 6\.3/i.test(ua))os='Windows 8.1';else if(/windows/i.test(ua))os='Windows';else if(/mac os x/i.test(ua))os='macOS';else if(/android/i.test(ua))os='Android';else if(/iphone|ipad|ipod/i.test(ua))os='iOS';else if(/linux/i.test(ua))os='Linux';return{browser,os,device:isMobile?(/ipad/i.test(ua)?'iPad':/iphone/i.test(ua)?'iPhone':'Mobile'):'Desktop',engine:(browser.includes('Blink')?'Blink':browser.includes('Gecko')?'Gecko':'WebKit')};}function parse(){const ua=document.getElementById('ua').value||navigator.userAgent;const r=parseUA(ua);document.getElementById('rBrowser').textContent=r.browser;document.getElementById('rOS').textContent=r.os;document.getElementById('rDevice').textContent=r.device;document.getElementById('rEngine').textContent=r.engine;document.getElementById('result').style.display='block';}function detectMyUA(){document.getElementById('ua').value=navigator.userAgent;parse();}parse();</script></body></html>
