<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free IP Lookup - ToolGen</title>
    <meta name="description" content="Look up IP address location and details. Find IP geolocation, ISP, and hostname. Free online IP lookup tool.">
    <meta name="keywords" content="ip lookup, ip geolocation, find ip location, my ip address, ip checker, ip location finder">
    <link rel="canonical" href="https://toolgen.xyz/tools/iplookup.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0a; color: #fff; line-height: 1.6; }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .back { color: #667eea; text-decoration: none; margin-bottom: 30px; display: inline-block; }
        h1 { font-size: 2rem; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 14px; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #667eea; }
        .btn { display: inline-block; padding: 12px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 25px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); }
        .result-grid { display: grid; gap: 10px; margin-top: 20px; }
        .result-row { display: flex; justify-content: space-between; padding: 12px 15px; background: #0a0a0a; border-radius: 8px; }
        .result-row .label { color: #888; }
        .result-row .value { color: #22c55e; font-weight: 600; }
        footer { text-align: center; padding: 40px 0; color: #666; font-size: 0.9rem; border-top: 1px solid #333; margin-top: 40px; }
        footer a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="https://toolgen.xyz/" class="back">← Back to ToolGen</a>
        <h1>🌍 IP Lookup</h1>
        <p class="subtitle">Find IP address location, ISP, and geolocation details.</p>

        <div class="card">
            <div class="input-row">
                <input type="text" id="ipInput" placeholder="Enter IP address or leave blank for your IP">
                <button class="btn" onclick="lookup()">Lookup</button>
            </div>

            <div class="result-grid" id="results"></div>
        </div>
    </div>

    <footer>
        <p>🔗 <a href="https://toolgen.xyz/">ToolGen</a> - <a href="https://toolgen.xyz/tools/iplookup.html">IP Lookup</a> - 150+ Free Tools</p>
    </footer>

    <script>
        async function lookup() {
            const ip = document.getElementById('ipInput').value.trim();
            const url = ip ? `https://ipapi.co/${ip}/json/` : 'https://ipapi.co/json/';

            try {
                const res = await fetch(url);
                const data = await res.json();

                const fields = [
                    ['IP Address', data.ip],
                    ['City', data.city],
                    ['Region', data.region],
                    ['Country', data.country_name + ' (' + data.country_code + ')'],
                    ['ISP', data.org],
                    ['ASN', data.asn],
                    ['Timezone', data.timezone],
                    ['UTC Offset', data.utc_offset],
                ];

                document.getElementById('results').innerHTML = fields.map(([label, value]) =>
                    `<div class="result-row"><span class="label">${label}</span><span class="value">${value || 'N/A'}</span></div>`
                ).join('');
            } catch(e) {
                document.getElementById('results').innerHTML = '<div class="result-row"><span class="label">Error</span><span class="value">Could not fetch IP data</span></div>';
            }
        }

        lookup();
    </script>
</body>
</html>
