            <label>Enter text to paraphrase:</label>
            <textarea id="inputText" placeholder="Paste or type your text here..."></textarea>

            <button class="btn" onclick="paraphrase()">Paraphrase</button>
            <button class="btn" style="background:#333;" onclick="clearText()">Clear</button>

    <script>
        let currentMode = 'standard';

        const synonyms = {

            'die': ['expire', 'pass away', 'perish', 'cease'],
            'send': ['dispatch', 'transmit', 'forward', 'ship'],
            'expect': ['anticipate', 'foresee', 'predict', 'await'],
            'build': ['construct', 'establish', 'create', 'develop'],
            'stay': ['remain', 'continue', 'persist', 'last'],
            'fall': ['drop', 'decline', 'descend', 'tumble'],
            'cut': ['slice', 'trim', 'reduce', 'diminish'],
            'reach': ['attain', 'achieve', 'arrive', 'extend'],
            'kill': ['eliminate', 'end', 'destroy', 'terminate'],
            'remain': ['stay', 'continue', 'persist', 'endure'],
        };

        const replacements = {
            fluency: {
                'a lot of': 'much',
                'in order to': 'to',
                'due to the fact that': 'because',
                'at this point in time': 'now',
                'in the event that': 'if',
                'with regard to': 'about',
                'for the purpose of': 'to',
                'in spite of the fact that': 'although',
            },
            creative: {
                'very happy': 'ecstatic',
                'very sad': 'heartbroken',
                'very big': 'enormous',
                'very small': 'minuscule',
                'very important': 'crucial',
                'a lot': 'numerous',
                'good': 'exceptional',
                'bad': 'terrible',
                'nice': 'wonderful',
                'thing': 'item',
            },
            formal: {
                'a lot of': 'considerable',
                'get': 'obtain',
                'got': 'obtained',
                'kids': 'children',
                'buy': 'purchase',
                'show': 'demonstrate',
                'tell': 'inform',
                'ask': 'inquire',
                'want': 'desire',
            },
            simple: {
                'utilize': 'use',
                'commence': 'start',
                'terminate': 'end',
                'endeavor': 'try',
                'assistance': 'help',
                'nevertheless': 'still',
                'subsequently': 'then',
                'accordingly': 'so',
            }
        };

        function setMode(btn, mode) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
        }

        function paraphrase() {
            let text = document.getElementById('inputText').value.trim();
            if (!text) { alert('Please enter some text.'); return; }

            const modeMap = replacements[currentMode] || {};
            const words = text.split(/(\s+)/);

            const result = words.map(part => {
                if (/^\s+$/.test(part)) return part;

                const lower = part.toLowerCase().replace(/[.,!?;:'"()]/g, '');
                const punct = part.match(/[.,!?;:'"()]+$/)?.[0] || '';
                const key = lower;

                if (modeMap[key]) {
                    return modeMap[key] + punct;
                }

                if (synonyms[key] && Math.random() > 0.5) {
                    const syns = synonyms[key];
                    const syn = syns[Math.floor(Math.random() * syns.length)];
                    return (part[0] === part[0].toUpperCase() ? syn.charAt(0).toUpperCase() + syn.slice(1) : syn) + punct;
                }

                return part;
            }).join('');

            const resultBox = document.getElementById('resultBox');
            resultBox.textContent = result;

            const statsBox = document.getElementById('statsBox');
            statsBox.style.display = 'flex';

            const originalWords = text.split(/\s+/).length;
            const resultWords = result.split(/\s+/).length;
            const changes = Math.abs(resultWords - originalWords);

            document.getElementById('wordCount').textContent = resultWords;
            document.getElementById('charCount').textContent = result.length;
            document.getElementById('changeCount').textContent = changes + (result !== text ? '~' : '0');
        }

        function clearText() {
            document.getElementById('inputText').value = '';
            document.getElementById('resultBox').textContent = 'Your paraphrased text will appear here...';
            document.getElementById('statsBox').style.display = 'none';
        }
    </script>
